version: 2

# GoReleaser builds the release binaries and the container image.
#
# The SPA is NOT built here. It has to exist at internal/web/dist before the Go
# build runs, because embed.FS resolves at compile time, so the release workflow
# runs "make web" first and GoReleaser only ever sees a tree that already has it.
# A "before" hook could do it, but then a local "goreleaser build" would silently
# produce a binary with whatever SPA the developer last built, which is worse.

project_name: alder

before:
  hooks:
    - go mod download
    # Fails loudly if the release workflow forgot to build the SPA, rather than
    # shipping a binary that serves the "not built" placeholder.
    # The whole command is one YAML scalar; without the quotes the ": " in the
    # message makes the parser read the line as a map.
    - "sh -c 'test -f internal/web/dist/index.html || { echo \"the SPA is missing from internal/web/dist — run make web before releasing\"; exit 1; }'"

builds:
  - id: alder
    main: ./cmd/alder
    binary: alder
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: alder
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - SECURITY.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Everything else
      order: 2
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

# dockers_v2 replaces the old dockers + docker_manifests pair: one entry builds
# every platform and pushes the multi-arch manifest itself.
dockers_v2:
  - images:
      - ghcr.io/hazame-hub/alder
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.release
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A web UI for engineering OpenLDAP and 389 Directory Server"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: "AGPL-3.0-only"

release:
  draft: true
  footer: |
    ## Verifying

    Every archive is checksummed in `checksums.txt` and ships an SBOM.

    ## Running it

    ```sh
    docker run --rm -p 8443:8443 \
      -v /path/to/certs:/certs:ro \
      ghcr.io/hazame-hub/alder:{{ .Version }} \
      serve --tls-cert /certs/tls.crt --tls-key /certs/tls.key
    ```

    Alder refuses to start without TLS: it holds a directory bind password in
    memory for the life of a session. Pass `--allow-http` only when something in
    front of it is terminating TLS.
