# https://taskfile.dev
#
# Run `task` with no arguments to list everything.
#
# Chosen over make for the reason that actually bites on this project: several
# targets are multi-step shell that make runs one line per process, so every
# `cd web && ...` needs joining with && and every `$` needs doubling. Task runs
# a task body as one script, and the sources/generates fields express "rebuild
# only when these changed" without writing sentinel files.

version: "3"

vars:
  BIN: bin/alder
  COMPOSE: docker compose -f test/compose/docker-compose.yml
  # Vite empties this directory on every build. .gitkeep is put back by a Vite
  # plugin rather than here, so a bare `npm run build` cannot leave the tree in
  # a state where `go build` fails on //go:embed.
  WEB_OUT: internal/web/dist

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  # --- build ---------------------------------------------------------------

  generate:
    desc: Regenerate the API types from api/openapi.yaml
    # The spec is the source of truth. Edit it, run this, then satisfy the
    # compiler on both sides.
    cmds:
      # Pinned, and run straight from the module cache: the generator is a
      # build tool, not something the binary links against, so it has no
      # business in go.mod. Without the version this needs it to be a
      # dependency, and it is not one.
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 -config api/codegen.yaml api/openapi.yaml
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 -config api/codegen-client.yaml api/openapi.yaml
      - npm --prefix web run generate

  web:
    desc: Build the SPA into the binary's embedded filesystem
    sources:
      - web/src/**/*
      - web/index.html
      - web/package.json
      - web/package-lock.json
      - web/vite.config.ts
      - api/openapi.yaml
    generates:
      - "{{.WEB_OUT}}/index.html"
    cmds:
      # ci, not install: install may rewrite package-lock.json, which leaves the
      # tree dirty and makes GoReleaser refuse to release. ci installs exactly
      # what the lockfile says and never modifies it, which is what a build
      # feeding a release wants anyway.
      - npm --prefix web ci
      - npm --prefix web run build

  build:
    desc: Build the alder binary with the SPA embedded
    deps: [web]
    cmds:
      - go build -o {{.BIN}} ./cmd/alder

  build:go:
    desc: Build the binary without rebuilding the SPA
    cmds:
      - go build -o {{.BIN}} ./cmd/alder

  dev:
    desc: Print the two commands that run the API and the Vite dev server
    silent: true
    # Two processes on purpose: the SPA reloads on save without a Go rebuild.
    cmds:
      - echo "run these in two terminals:"
      - echo "  go run ./cmd/alder serve --addr 127.0.0.1:8899 --allow-http --log-level debug"
      - echo "  npm --prefix web run dev"

  # --- checks --------------------------------------------------------------

  test:
    desc: Run the unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run the unit tests with the race detector
    cmds:
      - go test -race ./...

  cover:
    desc: Run the unit tests and report total coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  fuzz:
    desc: Run every fuzz target briefly, as a smoke test
    # The seed corpora run as ordinary unit tests; this gives them a short
    # random budget as well, which is where the interesting inputs have always
    # come from.
    cmds:
      - go test ./internal/dn -run FuzzParse -fuzz FuzzParse -fuzztime 30s
      - go test ./internal/filter -run FuzzParse -fuzz FuzzParse -fuzztime 30s
      - go test ./internal/schema -run FuzzParseObjectClass -fuzz FuzzParseObjectClass -fuzztime 30s
      - go test ./internal/schema -run FuzzParseAttributeType -fuzz FuzzParseAttributeType -fuzztime 30s
      - go test ./internal/ldif -run FuzzUnmarshal -fuzz FuzzUnmarshal -fuzztime 30s

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    # A linter that cannot type-check the code still prints "0 issues" and
    # exits 0, which is how a toolchain bump nearly shipped with lint doing
    # nothing. The same guard as CI: no type-checking, no pass.
    cmds:
      - |
        status=0
        out="$(golangci-lint run 2>&1)" || status=$?
        echo "$out"
        if echo "$out" | grep -q "typechecking error"; then
          echo "golangci-lint could not type-check this code, so its result means nothing" >&2
          exit 1
        fi
        exit "$status"

  fmt:
    desc: Format the Go sources
    cmds:
      - gofmt -w $(git ls-files '*.go')

  typecheck:
    desc: Type-check the SPA
    cmds:
      - npm --prefix web run typecheck

  lint:web:
    desc: Lint the SPA
    # The rules that catch what tsc and the unit tests cannot -- a hook below
    # an early return, a dependency list that lies. Warnings fail it, because
    # a warning nobody has to fix is one that accumulates until the number is
    # the point and the findings are not.
    cmds:
      - npm --prefix web run lint

  test:web:
    desc: Run the SPA unit tests
    # Node, not a browser. What is tested is the logic that decides what
    # reaches a directory: which modification a diff produces, how a value is
    # escaped into a DN, whether a value looks like a switch.
    cmds:
      - npm --prefix web run test

  check:
    desc: Everything CI runs
    cmds:
      - task: vet
      - task: lint
      - task: test
      - task: typecheck
      - task: lint:web
      - task: test:web

  # --- the conformance harness ---------------------------------------------

  seed:
    desc: Regenerate the committed seed LDIF
    cmds:
      - go run ./test/compose/seed/gen -out test/compose/seed

  compose:up:
    desc: Bring the four directory servers up, seed them and start replication
    cmds:
      # certs on its own first, and force-recreated. A container that exited
      # successfully satisfies service_completed_successfully for ever, so an
      # edit to certgen.sh -- adding a server to the harness, say -- would
      # otherwise never run again, and the new server would start without a
      # certificate. Issuing is per file and idempotent, so this costs a
      # second and changes nothing when there is nothing to do.
      # No --wait: it treats a container that exits as a failure, and this
      # one is meant to exit. The next line waits for it through the
      # service_completed_successfully the servers already declare.
      - "{{.COMPOSE}} up --build --detach --force-recreate certs"
      - "{{.COMPOSE}} up --build --detach --wait openldap ds389 openldap-replica ds389-replica"
      - "{{.COMPOSE}} run --rm --build seed"
      # After the seed: the 389 DS agreement is created with --init, so the
      # consumer is filled from what the supplier holds at that moment.
      - "{{.COMPOSE}} run --rm replicate"

  compose:bulk:
    desc: 'Rebuild the harness with N generated filler entries under ou=bulk, loaded offline. Usage: task compose:bulk -- 100000'
    # Opt-in, for scale work only. The filler is generated here and never
    # committed, it lives under its own OU, and nothing in the conformance
    # suite may depend on it. `compose:down` then `compose:up` gets back to the
    # plain 320-entry harness the suite does run against.
    #
    # It rebuilds from scratch rather than adding to a running harness, because
    # slapadd needs slapd stopped and the only moment a container's slapd is
    # stopped is before it starts. That is also the honest shape: bulk mode is
    # a different harness, not the usual one with more in it.
    vars:
      COUNT: '{{.CLI_ARGS | default "100000"}}'
    env:
      # Read by docker-compose.yml, passed into the openldap container, acted
      # on by its entrypoint. Scoped to this task, so a later `task compose:up`
      # creates a container that has never heard of bulk mode.
      ALDER_BULK_LDIF: /bulk/bulk.ldif
    cmds:
      - go run ./test/compose/seed/gen -bulk {{.COUNT}} -out test/compose/bulk
      - "{{.COMPOSE}} down --remove-orphans"
      - "{{.COMPOSE}} up --build --detach --wait certs openldap ds389 openldap-replica ds389-replica"
      # No --build on these two, unlike compose:up. The image is already built
      # by the line above, and a rebuild here leaves the running openldap
      # container out of date against its image -- so the *next* `compose run`
      # recreates it, which throws away the mdb database the entrypoint just
      # slapadded into. The count check at the end of bulk.sh is what caught
      # that: OpenLDAP held the filler and none of the fixtures.
      - "{{.COMPOSE}} run --rm seed"
      - "{{.COMPOSE}} run --rm replicate"
      - "{{.COMPOSE}} run --rm bulk"

  compose:down:
    desc: Tear the harness down, keeping the test CA
    cmds:
      - "{{.COMPOSE}} down --remove-orphans"

  compose:reset:
    desc: Tear the harness down and discard the test CA too
    cmds:
      - "{{.COMPOSE}} down --remove-orphans --volumes"
      - rm -rf test/compose/certs

  compose:logs:
    desc: Follow the harness logs
    cmds:
      - "{{.COMPOSE}} logs --follow"

  test:conformance:
    desc: Run the conformance suite against both servers
    # Behind a build tag so a plain `go test ./...` needs no Docker. It asserts
    # identical behaviour from one table; there is no per-vendor test file and
    # adding one would defeat the point.
    cmds:
      - go test -tags conformance -count=1 -timeout 300s ./test/conformance/

  test:conformance:up:
    desc: Bring the harness up, then run the conformance suite
    cmds:
      - task: compose:up
      - task: test:conformance

  test:e2e:
    desc: Run the end-to-end journeys against both servers (harness must be up)
    # The real UI in a real browser, served by the real binary, against the
    # same two directories as the conformance suite. Playwright starts Alder
    # itself; the SPA is built first because the binary embeds it, and a
    # journey run against yesterday's SPA would be testing the wrong thing.
    deps: [web]
    cmds:
      - npm --prefix test/e2e run typecheck
      - npm --prefix test/e2e test

  test:e2e:up:
    desc: Bring the harness up, run the end-to-end journeys, and tear it down
    cmds:
      - task: compose:up
      - defer: { task: compose:down }
      - task: test:e2e

  # --- packaging -----------------------------------------------------------

  docker:
    desc: Build the distroless image from source
    cmds:
      - docker build -t alder:dev .

  clean:
    desc: Remove build output
    cmds:
      - rm -rf bin dist coverage.out web/dist {{.WEB_OUT}}/assets {{.WEB_OUT}}/index.html
