openapi: 3.0.3

info:
  title: Alder
  version: "1.0.0"
  description: |
    The HTTP API of Alder, a directory engineering tool for OpenLDAP and 389
    Directory Server.

    This document is the source of truth. The Go server interface and the
    TypeScript client are both generated from it, so the two cannot drift.

    **`info.version` above is the version of this contract, not of the binary
    serving it.** They are both 1.x and are meant to stay that way: Alder 1.x
    serves contract 1.x, and the contract only changes within a major by adding
    -- a new endpoint, a new optional field, a new enum value a client may
    ignore. Anything a client could break on waits for the next major of both.
    `docs/COMPATIBILITY.md` says what that covers and what it does not. The
    running binary reports its own version in `GET /api/v1/source`, which is
    served outside this document because the AGPL section 13 offer it carries
    must not require a session.

    Two conventions run through the whole API.

    A **distinguished name is always a query or body parameter, never a path
    segment.** DNs contain commas, equals signs, escaped characters and
    non-ASCII text; putting one in a path means every client and every proxy in
    the chain has to agree about double-encoding, and they do not.

    An **attribute value is an octet string, not a string.** Every value is
    carried as an object that is either `{ "text": ... }` for a value that is
    valid UTF-8 and belongs to a textual syntax, or `{ "base64": ... }` for
    anything else. There is no path by which a JPEG becomes mangled text.

servers:
  - url: /api/v1

tags:
  - name: session
    description: Connecting to a directory. Credentials live in memory only.
  - name: browse
    description: Reading the tree and its entries.
  - name: schema
    description: Browsing the schema the server published.
  - name: changes
    description: Previewing and applying modifications.
  - name: transfer
    description: LDIF import and export, and Ansible generation.
  - name: snapshots
    description: |
      Capturing directory state as a versioned snapshot, and comparing states.
      Nothing here writes: a comparison can propose change requests, and those
      only ever reach the directory through `/plan` and the ordinary apply.
  - name: preflight
    description: |
      Migration and compatibility preflight (1.12): reading a change package,
      a schema snapshot or a data snapshot against the connected directory and
      reporting what would carry across. Analysis only: nothing here writes,
      transforms the artifact, or produces anything a plan or an apply reads.
  - name: licence
    description: |
      The AGPL section 13 offer. The only endpoint here that answers without a
      session, because the obligation runs to anyone who can reach the service.

paths:
  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: Describe the current session
      responses:
        "200":
          description: The session and what the server it is bound to can do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [session]
      operationId: createSession
      summary: Connect and bind to a directory
      description: |
        Opens a connection, binds, and reads the RootDSE. On success the
        response sets an httpOnly, Secure, SameSite=Strict cookie naming an
        in-memory session. The bind password is held in that in-memory session
        and is never written to disk, never placed in a token, and never
        returned by any endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectRequest" }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: |
            The operator has configured an allowlist of directories Alder may
            connect to, and this host and port are not on it. The `error` code
            is `target_not_allowed`, which is distinct from `forbidden` so that
            a client can tell "this deployment will not go there" from "the
            directory said no". The message names the target as Alder
            normalised it and the endpoints that are permitted, so an operator
            reading it can see what to add.

            A target that is not a usable host and port at all is a `400`,
            whether or not an allowlist is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The directory refused the connection or the bind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      tags: [session]
      operationId: deleteSession
      summary: Disconnect
      description: Closes the connection and discards the credentials.
      responses:
        "204": { description: Disconnected. }

  /tree:
    get:
      tags: [browse]
      operationId: listChildren
      summary: List the children of an entry
      description: |
        With no `dn`, returns the naming contexts the server holds, which are
        the roots of the tree. With a `dn`, returns that entry's immediate
        children. This is the lazy-loading tree browser's only endpoint.
      parameters:
        - name: dn
          in: query
          schema: { type: string }
          description: The parent. Omit for the roots.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cookie
          in: query
          schema: { type: string }
          description: Continuation cookie from a previous page.
      responses:
        "200":
          description: One page of children.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /count:
    get:
      tags: [browse]
      operationId: countEntries
      summary: Count the entries under a base, up to a limit
      description: |
        A subtree count, bounded like every other search. It asks the server for
        no attributes at all, so the cost is the search rather than the values.

        `truncated` is the important half of the answer: it means the count
        reached the limit and the real number is higher. The UI reports "at
        least N" in that case rather than a number that is simply wrong, which
        is why this is an action somebody asks for rather than something a
        landing page does to every naming context on load.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 10000 }
      responses:
        "200":
          description: How many entries were counted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /compare:
    get:
      tags: [browse]
      operationId: compareEntries
      summary: What differs between two entries
      description: |
        Answers "why does this account work and that one not".

        A naive diff answers it badly in three ways, and avoiding those is most
        of what this endpoint is. It compares what is *present*, so an attribute
        one entry's classes require and it does not hold is invisible — and that
        absence is frequently the whole answer. It compares bytes, so two DNs
        naming the same entry in different case read as a difference the
        directory does not agree with. And its instinct is to show both sides of
        everything, which for `userPassword` is what rule 6 forbids.

        So each side is annotated from its *own* object classes, which the two
        entries need not share; DN-valued attributes are compared as DNs; and a
        sensitive attribute is compared on presence alone.
      parameters:
        - name: left
          in: query
          required: true
          schema: { type: string }
          description: Usually the entry that works.
        - name: right
          in: query
          required: true
          schema: { type: string }
        - name: includeOperational
          in: query
          schema: { type: boolean, default: true }
          description: |
            On by default, unlike the LDIF export. `nsAccountLock` and
            `pwdAccountLockedTime` are operational on the target servers and are
            frequently the entire answer.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Values reported per attribute.
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryComparison" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /entry:
    get:
      tags: [browse]
      operationId: getEntry
      summary: Read one entry
      description: |
        Returns the entry with every attribute annotated from the schema: its
        syntax, whether it is single-valued, whether the server owns it, and
        which input control the editor should offer. Also returns the MUST and
        MAY sets computed from the entry's object classes.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: includeOperational
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    post:
      tags: [browse]
      operationId: search
      summary: Search the directory
      description: |
        Every search is paged and bounded. `filter` is a raw RFC 4515 string
        which is parsed, not interpolated: a value containing filter
        metacharacters cannot escape into the filter structure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: One page of results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /views:
    get:
      tags: [browse]
      operationId: listObjectViews
      summary: The object-aware views this directory supports
      description: |
        Users, groups and organizational units, expressed as saved searches
        derived from the schema the connected server published.

        A view is offered only where the server defines a class to anchor it
        on, so a directory holding no person class has no Users view rather
        than an empty one. The anchors are standards-track classes — RFC 4519,
        RFC 4524, RFC 2307 — never vendor names, and a site class inheriting
        from one of them is matched without being named, because an entry
        carries its superclasses in its own `objectClass` attribute.

        The filter is built here and goes back to `/search` unmodified. The
        columns are the attributes the anchor classes actually permit, so a
        directory without `inetOrgPerson` gets no mail column instead of an
        empty one.
      responses:
        "200":
          description: The views this connection supports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectViewList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /inventory:
    post:
      tags: [browse]
      operationId: inventoryValues
      summary: What values one attribute holds, and how many entries carry each
      description: |
        The question that finds a team name spelled "platfrm" with four people
        on it, a cost centre nobody has used since a reorganisation, or the
        accounts still pointing at a decommissioned site.

        It is a tally over a **bounded** search, so it never claims to describe
        the directory — only the entries it examined. Every number is scoped
        that way and `truncated` says the bound was reached. A tally that
        quietly summarises a truncated result set is not a weaker answer than
        the truth; it is a confident wrong one.

        Sensitive attributes are refused before the search runs rather than
        filtered out of the result, which is the difference between never
        reading a password and reading every password and choosing not to say.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryRequest" }
      responses:
        "200":
          description: The tally.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /members:
    get:
      tags: [browse]
      operationId: expandMembers
      summary: Who is in this group, following nested groups
      description: |
        The entry view lists a group's `member` values, which is the whole
        answer for a flat group and no answer at all for a nested one:
        `cn=everyone` in the test harness lists five members and contains no
        people, because all five are themselves groups.

        This walks that structure and says, for each person reached, which
        chain of groups brought them in.

        What it finds on the way is reported rather than dropped: a group that
        contains itself, a member DN whose entry cannot be read — the dangling
        reference the referenced-by panel exists to prevent, seen from the
        other side — and membership values that are not DNs at all, since
        `memberUid` holds a login name and `memberURL` a search.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
          description: The group to expand.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /references:
    get:
      tags: [browse]
      operationId: listReferences
      summary: The entries that name this one, and the attribute each names it by
      description: |
        Answers "which groups is this in, and what else points at it" — and,
        unlike the filter on the entry itself, says *how* each one points.

        That is the part a link cannot give you. A search returns the entries
        matching the filter but not which term matched, and removing a
        reference means modifying a named attribute on the referencing entry:
        without knowing whether a group holds this DN in `member` or in `owner`,
        there is nothing safe to offer.

        It is one bounded search. The reference attributes are requested and
        matched here rather than in the browser, so a group's five hundred
        members are compared where they already are instead of being sent
        across to be compared and discarded.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
          description: The entry being referred to.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: What names this entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /resolve:
    get:
      tags: [browse]
      operationId: resolve
      summary: What could this input be — an entry, or a search
      description: |
        Backs one box that takes a DN, an RFC 4515 filter, or a name.

        It parses and never searches. `internal/dn` and `internal/filter` are
        the authorities on what these strings are, and a regex in the browser
        would drift from them the first time either grew a case — but probing
        the directory to see whether an entry exists would turn every keystroke
        into a read, to answer a question the operator is about to answer by
        pressing enter.

        The three kinds overlap. `cn=platform` is a valid one-component DN
        *and* almost certainly a request to find something called platform, so
        an ambiguous input returns both destinations and the operator picks.
        Guessing would be wrong about half the time.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Where this input could go.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schema:
    get:
      tags: [schema]
      operationId: getSchema
      summary: The whole schema, indexed for browsing
      responses:
        "200":
          description: The schema.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schema/objectclasses/{name}:
    get:
      tags: [schema]
      operationId: getObjectClass
      summary: One object class, with its cross-links resolved
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: A name or an OID.
      responses:
        "200":
          description: The object class.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectClassDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schema/attributetypes/{name}:
    get:
      tags: [schema]
      operationId: getAttributeType
      summary: One attribute type, with its cross-links resolved
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The attribute type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttributeTypeDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schema/requirements:
    get:
      tags: [schema]
      operationId: getRequirements
      summary: What an entry of these object classes must and may hold
      description: |
        The MUST and MAY sets for a set of object classes, with the schema's
        opinion about each attribute — syntax, single-valuedness, description,
        which control to offer.

        It exists so a creation form is generated from the schema rather than
        from a template. Without it the form has attribute names and nothing
        else, which is how creating an entry ended up with a plain text box for
        every field while editing the same entry a moment later offered a
        Boolean control, an entry picker and the attribute's description.
      parameters:
        - name: class
          in: query
          required: true
          explode: true
          schema:
            type: array
            items: { type: string }
          description: |
            The object classes, repeated. Superiors are followed, so naming the
            most specific one is enough.
      responses:
        "200":
          description: What such an entry would require and permit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementsView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schema/change:
    post:
      operationId: buildSchemaChange
      summary: Build the modification that installs, replaces or removes a definition
      description: |
        Renders a definition and returns the change that would apply it, without
        applying anything.

        A schema definition is a value of an attribute on an ordinary entry, so
        the change this returns is an ordinary modify, and it goes on to the
        same preview, the same confirmation and the same changeset as every
        other write. There is still exactly one path that writes.

        The definition text is built here rather than in the browser, for the
        same reason the LDIF preview is: what the person confirms and what the
        directory receives have to be the same bytes.

        A replace or a delete needs the value the server actually stores, which
        is not always the value the schema browser displays — a server keeping
        its schema in configuration prefixes each stored definition with its
        load order and strips that prefix from what it publishes. This reads the
        target to find it, which is why the request names an OID rather than
        carrying a definition to remove.
      tags: [schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchemaChangeRequest" }
      responses:
        "200":
          description: The change that would perform this, and the definition it carries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaChangeBuild" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /changes/preview:
    post:
      tags: [changes]
      operationId: previewChange
      summary: Render a change as LDIF and as an Ansible task
      deprecated: true
      description: |
        Renders without applying and without reading the directory.

        Deprecated since 1.6, and kept for 1.x clients. The interface no longer
        calls it: its confirmation dialog plans the change with `POST /plan`,
        which returns the same rendering inside the plan item together with
        what the change would do against the directory as it is, and a token
        that `/changes/apply` holds the change to. A rendering alone says
        nothing about whether the change still applies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRequest" }
      responses:
        "200":
          description: The rendered change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /changes/apply:
    post:
      tags: [changes]
      operationId: applyChange
      summary: Apply a change
      description: |
        Applies one change. With the `baseline` a plan returned, the server first
        re-reads the entry and refuses the change if it is not the operation the
        plan was issued for (`400 plan_mismatch`) or the directory has moved
        since (`409 conflict`, `cause: plan_stale`). A secret in the change -- a
        new password, a sensitive attribute value -- is part of that operation:
        a different value than the one planned is a mismatch.

        Without a `baseline` the change is applied as it always was. The
        interface always plans first and always sends one.

        With `recovery=true` the response carries a recovery bundle for the
        change once it has succeeded: the compensating change derived from the
        entry as it was read immediately before the change ran. See
        `docs/RECOVERY.md`. A bundle is never applied from here or anywhere
        else; it becomes ordinary changes through `POST /recovery/inspect`.
      parameters:
        - name: recovery
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Return a recovery bundle for the change once it has been applied. Added in 1.9.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRequest" }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            A change carried a `baseline` and the directory no longer matches
            it: something the plan depended on has been changed by somebody
            else. The code is `conflict`, as it was in 1.4, with
            `cause: plan_stale`; `affected` lists every stale change, not only
            the first. Nothing was applied, and nothing is
            replanned on the caller's behalf — a plan the operator did not see
            is not the plan they confirmed. Plan again to see what these changes
            would do now.

            A change whose `baseline` was issued for a different operation is
            refused with `400 plan_mismatch` instead, and nothing is applied
            either.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The server rejected the change on schema or policy grounds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /changeset/preview:
    post:
      tags: [changes]
      operationId: previewChangeset
      summary: Render several changes as one LDIF document and one playbook
      description: |
        A changeset is an ordered list of changes reviewed and applied together.
        It is held by the client, not the server: Alder keeps no per-session
        state beyond the connection itself, so this endpoint is a pure
        rendering of whatever it is given.

        The order is the caller's and is preserved exactly. Alder does not sort
        the changes to make them work -- an entry created before its parent is
        reported as a warning so it can be reordered, because guessing the
        intended order silently is worse than saying what is wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesetRequest" }
      responses:
        "200":
          description: The rendered changeset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesetPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /changeset/apply:
    post:
      tags: [changes]
      operationId: applyChangeset
      summary: Apply several changes in order
      description: |
        Applies each change in the order given and stops at the first failure.

        A directory has no transaction spanning entries, so a changeset is not
        atomic and does not pretend to be. The response says exactly which
        changes were applied and which was not, so the caller can fix the one
        that failed and resume from there rather than starting again and
        re-applying what already succeeded.

        With `recovery: true` the result carries a recovery bundle covering
        exactly the changes that were applied -- on a run that stopped partway,
        only those before the failure -- whose compensations run in the reverse
        order. See `docs/RECOVERY.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesetRequest" }
      responses:
        "200":
          description: |
            The run finished. This is returned whether or not every change
            succeeded: a partial run is an outcome to report, not an error to
            raise, and the body says where it stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesetResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            A change carried a `baseline` and the directory no longer matches
            it: something the plan depended on has been changed by somebody
            else. The code is `conflict`, as it was in 1.4, with
            `cause: plan_stale`; `affected` lists every stale change, not only
            the first. Nothing was applied, and nothing is
            replanned on the caller's behalf — a plan the operator did not see
            is not the plan they confirmed. Plan again to see what these changes
            would do now.

            A change whose `baseline` was issued for a different operation is
            refused with `400 plan_mismatch` instead, and nothing is applied
            either.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /recovery/inspect:
    post:
      tags: [changes]
      operationId: inspectRecovery
      summary: Validate a recovery bundle and turn it into changes to plan
      description: |
        Validates an uploaded recovery bundle and returns its compensating
        changes as ordinary change requests, in the order they would have to
        run, each carrying the `expect` precondition that makes it a conflict
        in a plan if the entry is no longer as the original apply left it.
        Added in 1.9; see `docs/RECOVERY.md`.

        Nothing is applied, and there is no endpoint that applies a bundle.
        The changes go to `POST /plan`, are reviewed, and are applied with
        `POST /changeset/apply` like any other change. `drift` is that plan's
        verdict on each change against the directory as it is now, for the
        preview; the plan made afterwards is the one that counts.

        A bundle is untrusted input. It is refused when its format or version
        is not one this Alder reads (`recovery_unsupported_version` for another
        version), when any field is malformed or unknown, when a sensitive
        attribute appears with values, when a compensation is a password
        change (`recovery_invalid`), or when a checksum is present and does
        not match (`recovery_checksum_mismatch`).

        `originMatches` compares the vendor and naming contexts the bundle
        records with this session's directory. Neither is proof of identity:
        two directories can announce the same.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryBundle" }
      responses:
        "200":
          description: The bundle, described, and its changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryInspection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /plan:
    post:
      tags: [changes]
      operationId: planChanges
      summary: What a set of changes would do, without doing it
      description: |
        Answers the question one level above the preview: given these proposed
        changes and the directory as it is, which are additions, which are
        modifications, which would do nothing at all, and which cannot be
        applied as written.

        Nothing is written. Every entry named is read, each change is
        classified, and the records that would run come back in `items[].record`
        — the same values `POST /changeset/apply` takes, not a description of
        them. That is what stops a plan from promising one thing and an apply
        doing another.

        `action` is a stable identifier and is what a client should switch on.
        `reason` is prose for a person and may be reworded in any release.

        Each applicable item carries a `baseline`: an opaque token binding two
        things — the exact operation in `record`, and the state of the directory
        that operation was planned against. Hand it back on the corresponding
        change when applying. The server re-reads the entry and refuses the
        whole set before anything runs: `400 plan_mismatch` if a change is not
        the operation its baseline was issued for, `409 conflict` with
        `cause: plan_stale` if the directory has moved since. Neither is silently replanned. The token
        holds no attribute values; a sensitive attribute contributes only
        whether it is set and how many values it has, and a password change
        binds the entry and the fact of the change, never the password.
        Baselines are meaningless to any other Alder process and do not survive
        a restart.

        The input is either `changes` or `ldif`, never both.

        **`ldif` with `mode: changes`** (the default) plans every record as the
        exact operation it states. A record with no `changetype` is an add,
        which is what `ldapadd` does with it. An add of an entry that already
        exists is a conflict (`entry_exists`); it is never turned into a
        modification nobody asked for.

        **`ldif` with `mode: desired`** reads the document as the state entries
        should be in. Only content records — no `changetype` — are accepted; a
        record with one is refused with `400 ldif_mode_mismatch`, because a
        document mixing "this entry looks like this" with "do this" has no
        single meaning. Each record is reconciled: created if the entry is
        absent, turned into the modification of the attributes it names if
        present, reported `unchanged` if it already matches. Attributes a record
        does not name are left alone. **An entry the document does not mention
        is not deleted**; there is no mode in which absence means deletion.

        `impact` reports facts, not a risk score: which target area each change
        touches (ordinary data, schema, server configuration), memberships
        gained and lost, deletions grouped into the branches they remove, and —
        for deletions and renames — the entries that name the affected DN and
        how many of those references the plan would leave dangling. Reference
        search runs as the session's own bind, so it reports what that bind can
        see; see `impact.references`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "200":
          description: |
            The plan. Nothing has been applied. A plan in which every item is
            `unchanged` is a successful answer, not an error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400":
          description: |
            The request could not be planned: neither or both of `changes` and
            `ldif`, LDIF that does not parse (`bad_request`, with the line in
            `detail`), or a record with a `changetype` in `mode: desired`
            (`ldif_mode_mismatch`, with the record in `affected`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: The directory could not be read, so no plan could be made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /snapshots/capture:
    post:
      tags: [snapshots]
      operationId: captureSnapshot
      summary: Capture a subtree as a versioned snapshot
      description: |
        Reads the subtree as the session's own identity and returns it as an
        Alder snapshot: a versioned, canonical JSON document, safe to keep in a
        repository. See `docs/SNAPSHOTS.md`.

        - Entries, attribute names and values are in one defined order, so two
          captures of an unchanged subtree differ only in `createdAt`, and have
          the same `checksum`.
        - Operational attributes are left out unless
          `operationalAttributes` is set. Each entry's stable identity
          (`entryUUID` or `nsUniqueId`) is recorded as its `id` either way.
        - Sensitive attributes are recorded as a `withheld` count, never as a
          value or anything derived from one.
        - A capture that cannot finish -- more than 50,000 entries, a search
          limit, a failure part way -- is an error. There is no partial
          snapshot.
        - A data snapshot's base must be ordinary data: a base inside the schema
          or the server's configuration is refused with
          `snapshot_scope_unsupported`.

        With `kind: schema` (1.10) the published subschema is captured instead,
        and `base`, `scope`, `filter` and `operationalAttributes` are not used.
        Attribute types and object classes are captured for comparison; LDAP
        syntaxes, matching rules, matching rule uses, DIT content rules and name
        forms as context. A definition that does not parse is kept verbatim and
        makes the snapshot `partial`. Server configuration is never captured, and
        there is no `kind: config`.

        Nothing is kept on the server. The snapshot is returned and belongs to
        the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotCaptureRequest" }
      responses:
        "200":
          description: The snapshot document, with a download filename.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Snapshot"
                  - $ref: "#/components/schemas/SchemaSnapshot"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /snapshots/inspect:
    post:
      tags: [snapshots]
      operationId: inspectSnapshot
      summary: Validate a snapshot and describe it
      description: |
        Validates an uploaded snapshot exactly as a comparison would and
        describes what it covers. Read-only: nothing is kept and nothing is
        applied.

        A snapshot is refused when its format or version is not one this Alder
        reads (`snapshot_unsupported_version` for a newer version), when any DN,
        value or field is malformed or unknown (`snapshot_invalid`), when a
        sensitive attribute carries a value, or when a checksum is present and
        does not match (`snapshot_checksum_mismatch`). A snapshot without a
        checksum is accepted and described as `integrity: unverified`.

        A schema snapshot (1.10) is checked as strictly: every OID, no OID twice,
        every parsed field equal to what its definition text parses to, counts
        and coverage true, and no inheritance cycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Snapshot"
                - $ref: "#/components/schemas/SchemaSnapshot"
      responses:
        "200":
          description: What the snapshot covers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotInspection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /diff:
    post:
      tags: [snapshots]
      operationId: diffStates
      summary: Compare two directory states
      description: |
        Compares `source` with `target`, each a snapshot or the live directory
        this session is bound to. The direction is explicit: `added` means in
        the target and not in the source. See `docs/SNAPSHOTS.md`.

        - Values compare by the equality rule both sides recorded for the
          attribute where Alder models it, and byte for byte otherwise; the
          attributes compared by bytes are listed.
        - A rename is only reported when both sides share an entry's stable
          identity. Otherwise a moved entry is removed and added.
        - What could not be seen is `unknown`, never `removed` or `added`: an
          entry beyond a live search's bound, outside the other side's scope, or
          an attribute the live directory will not show. Any of those makes the
          comparison `complete: false`, with `reasons`.
        - A live side reads as the session's identity. An entry the access
          rules hide is indistinguishable from one that does not exist; see the
          limits in `docs/SNAPSHOTS.md`.

        **Two snapshots need no session.** Comparing two documents the caller
        sent reads no directory, so the request is answered without a session
        and opens none. It is still bounded like any request -- the request body
        limit, the in-flight limit and the request timeout -- and its snapshots
        are read exactly as strictly. A request with a live side needs a
        session; without one it is refused with `401` before either snapshot is
        read.

        **Schema (1.10).** Two schema snapshots, or a schema snapshot and the
        live schema (`live: {kind: schema}`, or `live: {}` beside a schema
        snapshot), compare definitions instead of entries, and the response has
        `kind: schema` and a `schema` section. Identity is the OID; definitions
        compare by meaning, not text; a difference only in X- extensions is
        `metadata_only`; what did not parse is `unknown`. `counts` summarises
        both element kinds, with `metadata_only` counted as unchanged. A schema
        and a data side cannot be compared.

        When the source is live, each item carries a `candidate`: change
        requests that would move the live directory toward the target. They are
        input for `POST /plan`, never applied from here. Deleting an entry is a
        `destructive` candidate, is never selected for the caller, and is
        withheld entirely when the comparison is partial. A missing entry in the
        target is never, by itself, a reason to delete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiffRequest" }
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diff" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /packages/build:
    post:
      tags: [packages]
      operationId: buildPackage
      summary: Build a change package from changes
      description: |
        Turns changes into an `alder-change-package` document (1.11): a portable
        description of intended directory and schema changes that can be carried
        to another environment and validated there.

        The package holds intent, not execution. Every `baseline` is dropped,
        every expectation is dropped, and a change to a schema entry is recorded
        as what it means -- this element, this operation, this definition --
        rather than as the modification this server happens to need, because the
        entry and attribute that hold schema differ between products.

        What cannot be packaged is never dropped silently. A password change
        needs its secret to mean anything, so it is refused, and the package
        records the omission with a machine-readable reason.

        Dependencies are derived from the changes themselves -- an object class
        after the attribute types it names, an entry after the class it uses and
        after its parent -- and written into the document. Array order carries no
        meaning; the graph does.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageBuildRequest" }
      responses:
        "200":
          description: The package document, with a download filename.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePackage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /packages/inspect:
    post:
      tags: [packages]
      operationId: inspectPackage
      summary: Read a change package and check everything that needs no directory
      description: |
        Reads a package strictly and reports what it holds: its identity, its
        provenance, its assumptions, its changes and its dependency order.

        Everything that can be checked without a directory is checked here --
        the format and version, unknown fields, trailing content, duplicate
        identifiers, missing dependencies, self-dependencies, cycles, malformed
        DNs, schema definitions that do not parse, secrets, and the checksum.
        Nothing is executed and no directory is read, so no session is needed:
        this is the check a pipeline runs before it has credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePackage" }
      responses:
        "200":
          description: What the package holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageInspection" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /packages/validate:
    post:
      tags: [packages]
      operationId: validatePackage
      summary: Validate a change package against the current directory
      description: |
        Reads the package, then asks this directory what its intent means here:
        which changes are ready, which the target already satisfies, which
        conflict with what is there now, which name something that is missing,
        and which this server cannot do at all.

        Validation is not a plan. It prepares the ordinary change requests a
        plan would take and stops; the plan reads the directory again, issues
        the baselines an apply checks, and remains the only thing that decides
        what is written. Nothing here writes, and a validation is not something
        to keep: carry the package to the next environment and validate it
        there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageValidationRequest" }
      responses:
        "200":
          description: What this target makes of the package.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageValidation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /preflight:
    post:
      tags: [preflight]
      operationId: preflight
      summary: Report what of an artifact would carry across to this directory
      description: |
        Reads a change package, a schema snapshot or a data snapshot -- told
        apart by its own `format` and `kind`, never by a file name -- and reports,
        finding by finding, what this directory already holds, what it could take,
        what needs something done first, what contradicts it, what it cannot
        represent, and what could not be seen.

        A preflight is not a plan and not a migration. It reads the directory and
        never writes to it; it never rewrites a DN, maps an attribute or object
        class, or changes the artifact; and it produces no baseline and no
        prepared change. Package validation is its first step for a package, and
        its answer is carried on every finding about an item.

        `overall` is derived from the findings: `incompatible` when any finding
        that blocks portability is incompatible or unsupported, `incomplete` when
        otherwise something could not be decided, `compatible_with_prerequisites`
        when something has to be done first, and `compatible` only when none of
        these hold. Access control and server configuration are never evaluated,
        and `notEvaluated` says so on every report.

        A document that is none of the three is refused with
        `preflight_artifact_unsupported`; an artifact that is malformed, forged
        or from a newer version is refused with the code its own endpoints use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreflightRequest" }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreflightReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /export/ldif:
    get:
      tags: [transfer]
      operationId: exportLdif
      summary: Export an entry or a subtree as LDIF
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema:
            type: string
            enum: [base, one, sub]
            default: base
        - name: includeOperational
          in: query
          schema: { type: boolean, default: false }
          description: Operational attributes cannot be written back, so they are off by default.
        - name: includeSensitive
          in: query
          schema: { type: boolean, default: false }
          description: |
            Password hashes and similar are omitted unless this is set. An LDIF
            export ends up in tickets and repositories.
        - name: filter
          in: query
          schema: { type: string }
          description: |
            An RFC 4515 filter, defaulting to `(objectClass=*)`. It is parsed
            here, never pasted, exactly as the search filter is.

            It exists so a table can export what it is showing. Without it the
            only exports available are one entry, or a whole subtree, and
            "the thirty people I just searched for" — which is what somebody
            actually wants to put in a ticket or a repository — could only be
            assembled by hand.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 250000, default: 1000 }
          description: |
            The document is streamed and rendered a page at a time, so this
            bounds how long the export runs rather than how much it holds.
      responses:
        "200":
          description: The LDIF document.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export/ansible:
    get:
      tags: [transfer]
      operationId: exportAnsible
      summary: Export an entry or a subtree as a playbook that enforces it
      description: |
        A playbook that makes a directory match what is here, rather than one
        that merely reports on it.

        This is a separate path from `/export/ldif` on purpose. The obvious
        alternative was `format=ansible` on that operation, which would leave
        the URL saying "ldif" while returning YAML — and the two differ in more
        than serialisation. An LDIF export is a transcription of entries; this
        is an assertion about what they should be, and it is ordered parent
        first because `ldap_entry` cannot create a child under a parent that
        does not exist yet.

        Each entry becomes two tasks: `community.general.ldap_entry` to create
        it if it is missing, and `community.general.ldap_attrs` with
        `state: exact` to bring the listed attributes to exactly these values.
        `ldap_entry` with `state: present` alone would report success against
        an entry that exists with entirely different attributes, which is the
        failure this endpoint exists to avoid.

        Attributes the directory owns — operational, `NO-USER-MODIFICATION` —
        are omitted, because enforcing them would produce a task that fails on
        every run against a server doing its job. Sensitive attributes are
        omitted with no option to include them: a playbook is a file destined
        for a repository.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema:
            type: string
            enum: [base, one, sub]
            default: base
        - name: filter
          in: query
          schema: { type: string }
          description: |
            An RFC 4515 filter, defaulting to `(objectClass=*)`, parsed here
            and never pasted — so a table can export what it is showing.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        "200":
          description: The playbook.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export/outline:
    get:
      tags: [transfer]
      operationId: exportOutline
      summary: The shape of a subtree, as a tree
      description: |
        The same entries an LDIF export would give, drawn as the hierarchy they
        form rather than listed one after another.

        Asked for by an operator testing Alder: an LDIF export is flat, and a
        flat list of three hundred records does not tell you the shape of what
        you exported.

        **This is not LDIF and cannot be applied.** It could not be: RFC 2849
        gives a leading space its own meaning -- it continues the line above --
        so a tree drawn with indentation would stop being a document you can
        import. Rather than a format that is almost LDIF and quietly broken,
        this is plainly something else, and says so on its first line.

        Bounded rather than streamed, unlike the LDIF export: a tree cannot be
        drawn until its last entry has arrived, because the entry that decides
        whether a node is a leaf may be the final one to come back.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [base, one, sub], default: sub }
        - name: filter
          in: query
          schema: { type: string }
          description: An RFC 4515 filter, parsed and never pasted.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        "200":
          description: The outline.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export/yaml:
    get:
      tags: [transfer]
      operationId: exportYaml
      summary: The subtree as nested YAML
      description: |
        The entries and what they hold, nested as the tree they form, in a
        format an editor folds and colours. Asked for so that a subtree can be
        opened in an editor and read: LDIF is flat and YAML is not.

        Every attribute is a list, even where the schema says one value. An LDAP
        attribute holds a set, and a document whose shape changed with the data
        would make a second value look like a type change in the diff.

        A value that is not valid printable UTF-8 is written with YAML's own
        `!!binary` tag rather than passed off as a string.

        **Nothing reads this back.** Alder imports LDIF, which is the format with
        a specification and a changetype; this is for looking at. It is bounded
        rather than streamed for the same reason the outline is: a tree cannot be
        nested until its last entry has arrived.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [base, one, sub], default: sub }
        - name: filter
          in: query
          schema: { type: string }
          description: An RFC 4515 filter, parsed and never pasted.
        - name: includeOperational
          in: query
          schema: { type: boolean, default: false }
        - name: includeSensitive
          in: query
          schema: { type: boolean, default: false }
          description: |
            Off by default, as for LDIF. A file destined for an editor is a file
            destined for a repository soon after.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        "200":
          description: The YAML document.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import/ldif:
    post:
      tags: [transfer]
      operationId: parseLdif
      summary: Parse an LDIF document into change records
      description: |
        Parses and validates without applying anything. The response is the
        list of changes the document describes, each rendered back as LDIF, for
        the user to review and confirm one at a time or all at once.

        URL-valued attributes (`attr:< url`) are refused: following one from a
        process holding a privileged bind would be file disclosure and request
        forgery. So are LDAP controls, which would change what the server does
        with a record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: The parsed changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /source:
    get:
      tags: [licence]
      operationId: getSourceOffer
      summary: Where to get the source of this running instance
      description: |
        AGPL-3.0 section 13: someone using a modified Alder over a network is
        entitled to its Corresponding Source. The offer is served rather than
        written in a README because the obligation runs to the person using the
        running instance, and the user of a modified instance has no reason to
        know where its source went.

        **This is the one endpoint that answers without a session,** and it has
        no 401 for that reason: an offer only the already-connected can read
        would not discharge the obligation. It is described here so that the
        contract in this document is the whole contract -- it was served outside
        it until 1.0, which made `openapi.yaml` quietly incomplete about the one
        endpoint a licence requires.
      responses:
        "200":
          description: The offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceOffer" }

components:
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: There is no session, or it has expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The directory refused the operation for this bind.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such entry or definition.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: A stable machine-readable code.
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - target_not_allowed
            - plan_mismatch
            - ldif_mode_mismatch
            - snapshot_invalid
            - snapshot_unsupported_version
            - snapshot_checksum_mismatch
            - snapshot_too_large
            - snapshot_scope_unsupported
            - recovery_invalid
            - recovery_unsupported_version
            - recovery_checksum_mismatch
            - recovery_too_large
            - package_invalid
            - package_unsupported_version
            - package_checksum_mismatch
            - package_too_large
            - preflight_artifact_unsupported
            - not_found
            - conflict
            - constraint_violation
            - upstream
            - internal
        message:
          type: string
          description: A human-readable explanation. Never contains a credential.
        cause:
          type: string
          description: |
            A more precise reason beside `error`, where the error code has to
            stay what an earlier release sent. `plan_stale` accompanies
            `error: conflict` when a planned change's baseline no longer matches
            the directory: 1.4 answered that case with `conflict`, and a client
            switching on that must keep working, so the code is unchanged and the
            precision is added here. Added in 1.5.
          enum: [plan_stale]
          x-enum-varnames: [ErrorCausePlanStale]
        affected:
          type: array
          description: |
            The changes or records an error is about, by position in what was
            sent and by DN: every stale change, not just the first. Added in
            1.5.
          items: { $ref: "#/components/schemas/ErrorAffected" }
        detail:
          type: string
          description: Extra context, such as the LDIF line a parse failed on.
        ldapCode:
          type: integer
          description: The LDAP result code, where the failure came from the directory.
        hint:
          type: string
          description: |
            What that result code usually means for the operation that was
            attempted, and what to do about it.

            Written by Alder from the standard result code and the change being
            made. It never repeats the server's own diagnostic text, which is
            withheld on purpose: some servers name entries the caller may not be
            allowed to know exist, and some echo part of the request back. A
            result code alone is rarely enough to act on, which is what this is
            for.

    ErrorAffected:
      type: object
      required: [index, dn]
      properties:
        index: { type: integer }
        dn: { type: string }

    ConnectRequest:
      type: object
      required: [host, port, tls]
      properties:
        host:
          type: string
          minLength: 1
          description: |
            A host name or an IP literal. Where the operator has configured an
            allowlist, a host and port outside it is refused with `403` and
            `target_not_allowed` before any connection is opened.
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls:
          type: string
          enum: [ldaps, starttls, plaintext]
          description: |
            `plaintext` is refused unless the server was started with
            `--i-know-this-is-insecure`.
        insecureSkipVerify:
          type: boolean
          default: false
          description: |
            Skip certificate verification for this connection. Per-connection
            and never a default; a session using it is marked unverified.
        caCertificate:
          type: string
          description: A PEM bundle to verify against instead of the system roots.
        serverName:
          type: string
          description: Override the name checked against the certificate.
        bindDn:
          type: string
          description: Omit for an anonymous bind.
        configBindDn:
          type: string
          description: |
            An optional second identity, used only for the server's own
            configuration tree.

            A directory keeps its configuration beside its data, and the account
            that administers a suffix normally has no rights there; they are
            separate administrative domains on purpose. Without this, reaching
            the configuration means connecting as the configuration
            administrator and losing access to the data — which on a server that
            stores its schema in its configuration makes schema editing and
            entry browsing mutually exclusive. Operations are routed by DN, so
            one session does both.
        configBindPassword:
          type: string
          format: password
          writeOnly: true
          description: |
            Held in the server's memory for the life of the session, exactly
            like the bind password. Never written to disk, never returned.
        bindPassword:
          type: string
          format: password
          description: Held in memory for the life of the session and nowhere else.

    Capabilities:
      type: object
      required: [namingContexts, subschemaSubentry, paging]
      properties:
        namingContexts: { type: array, items: { type: string } }
        subschemaSubentry: { type: string }
        supportedControls: { type: array, items: { type: string } }
        supportedExtensions: { type: array, items: { type: string } }
        supportedSaslMechanisms: { type: array, items: { type: string } }
        paging: { type: boolean }
        serverSort: { type: boolean }
        whoAmI: { type: boolean }
        passwordModify:
          type: boolean
          description: |
            RFC 3062 Password Modify. Where a server offers it, Alder sets
            passwords with it rather than writing a hash, so the server chooses
            the scheme and applies its own policy.
        configContext:
          type: string
          description: |
            The DN of the server's own configuration tree, when it publishes
            one. Its presence is how Alder knows the subschema subentry is a
            generated view rather than the schema itself.
        schemaWrite:
          $ref: "#/components/schemas/SchemaWrite"
        config:
          $ref: "#/components/schemas/ConfigAccess"
        monitor:
          $ref: "#/components/schemas/MonitorAccess"

    MonitorAccess:
      type: object
      description: |
        A server's monitoring entry, where it publishes one this session can
        read. Found by reading the conventional location and believing only what
        the server answers, exactly as the configuration tree is.

        Absent is an ordinary answer. One of the two servers Alder targets
        publishes such an entry and the other does not, and a directory with
        none gets no monitoring section rather than an empty one.
      required: [readable]
      properties:
        dn: { type: string }
        readable: { type: boolean }

    ConfigAccess:
      type: object
      description: |
        This session's reach into the server's own configuration tree. The DN
        is preferred from what the server announces and otherwise found by
        trying the conventional location and believing only what the server
        answers.
      required: [readable, separateBind]
      properties:
        dn:
          type: string
          description: The configuration tree's root. Absent where there is none.
        readable:
          type: boolean
          description: |
            Whether this session can actually read it. A server may announce a
            tree the bound identity has no rights in.
        separateBind:
          type: boolean
          description: Whether a second identity is being used for it.
        boundAs:
          type: string
          description: The identity the configuration tree is read as.
        reason:
          type: string
          description: Why it is unreachable, in a sentence meant to be read.

    SchemaWrite:
      type: object
      description: |
        Where, and whether, this session can write schema definitions. Style is
        derived from what the server announced, never from its name: a server
        that publishes a configContext keeps its schema in configuration
        entries, and one that does not lets its subschema subentry be modified.
      required: [style]
      properties:
        style:
          type: string
          enum: [none, subschema, config]
          # Named explicitly: the generated constant for "config" would
          # otherwise be Config, which the server package already uses.
          x-enum-varnames: [SchemaStyleNone, SchemaStyleSubschema, SchemaStyleConfig]
        targets:
          type: array
          items: { $ref: "#/components/schemas/SchemaTarget" }
          description: |
            The entries a definition may be written to. Exactly one under the
            subschema style. Under the config style a server holds several, and
            which one a new definition joins is a choice with consequences,
            because they load in order.
        objectClassAttr: { type: string }
        attributeTypeAttr: { type: string }
        unavailable:
          type: string
          description: |
            Why there is nowhere to write, in a sentence meant to be read.
            Present only when style is none.

    SchemaTarget:
      type: object
      required: [dn, name, objectClasses, attributeTypes]
      properties:
        dn: { type: string }
        name: { type: string }
        objectClasses: { type: integer }
        attributeTypes: { type: integer }

    SessionInfo:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        host: { type: string }
        port: { type: integer }
        tls: { type: string }
        verified:
          type: boolean
          description: False when the session skipped certificate verification.
        bindDn:
          type: string
          description: Empty for an anonymous bind.
        vendorName:
          type: string
          description: Display only. Nothing branches on it.
        vendorVersion: { type: string }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        readOnly:
          type: boolean
          description: True when the server was started with --read-only.

    SnapshotScope:
      type: string
      enum: [base, one, sub]
      x-enum-varnames: [SnapshotScopeBase, SnapshotScopeOne, SnapshotScopeSub]

    SnapshotValue:
      type: object
      description: Exactly one of `text` or `base64`.
      properties:
        text: { type: string }
        base64: { type: string }

    SnapshotAttribute:
      type: object
      required: [name]
      properties:
        name: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/SnapshotValue" }
        withheld:
          type: integer
          description: For a sensitive attribute, how many values it held. It never has values.

    SnapshotEntry:
      type: object
      required: [dn, attributes]
      properties:
        dn: { type: string }
        id:
          type: string
          description: The server's stable identity for the entry, as `entryUUID=...` or `nsUniqueId=...`.
        attributes:
          type: array
          items: { $ref: "#/components/schemas/SnapshotAttribute" }

    SnapshotAttributeInfo:
      type: object
      required: [name]
      properties:
        name: { type: string }
        equality: { type: string }
        syntax: { type: string }
        singleValue: { type: boolean }
        operational: { type: boolean }
        sensitive: { type: boolean }

    SnapshotSource:
      type: object
      required: [base, scope, filter]
      properties:
        vendor: { type: string }
        vendorVersion: { type: string }
        base: { type: string }
        scope: { $ref: "#/components/schemas/SnapshotScope" }
        filter: { type: string }

    SnapshotExcluded:
      type: string
      enum: [operational-attributes, sensitive-values]
      x-enum-varnames: [SnapshotExcludedOperationalAttributes, SnapshotExcludedSensitiveValues]

    Snapshot:
      type: object
      description: |
        An Alder snapshot, format version 1. The document is canonical: see
        `docs/SNAPSHOTS.md` for its ordering and what `checksum` covers.
      required: [format, version, kind, createdAt, source, operationalAttributes, schemaAvailable,
        excluded, completeness, entryCount, attributes, entries]
      properties:
        format:
          type: string
          enum: [alder-snapshot]
          x-enum-varnames: [SnapshotFormatAlderSnapshot]
        version: { type: integer, description: "The snapshot format version. This Alder reads 1." }
        kind:
          type: string
          enum: [data]
          x-enum-varnames: [SnapshotKindData]
        createdAt: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/SnapshotSource" }
        operationalAttributes: { type: boolean }
        schemaAvailable: { type: boolean }
        excluded:
          type: array
          items: { $ref: "#/components/schemas/SnapshotExcluded" }
        completeness:
          type: string
          enum: [complete]
          x-enum-varnames: [SnapshotCompletenessComplete]
        entryCount: { type: integer }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/SnapshotAttributeInfo" }
        checksum:
          type: string
          description: "`sha256:<hex>` over the canonical content: every field except `createdAt` and `checksum`. A change to the captured entries or to the covered metadata invalidates it; a change to `createdAt` does not. An integrity check against corruption, not authentication or a signature."
        entries:
          type: array
          items: { $ref: "#/components/schemas/SnapshotEntry" }

    SnapshotCaptureRequest:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/StateKind"
          description: What to capture. `data` (the default) needs `base`. Added in 1.10.
        base: { type: string, description: "The subtree to capture. Required for kind data." }
        scope: { $ref: "#/components/schemas/SnapshotScope" }
        filter:
          type: string
          description: An RFC 4515 filter, defaulting to `(objectClass=*)`. Parsed, never pasted.
        operationalAttributes:
          type: boolean
          description: Capture operational attributes too. Off by default.

    PackageValue:
      type: object
      description: "One attribute value: exactly one of text or base64."
      properties:
        text: { type: string }
        base64: { type: string }

    PackageAttribute:
      type: object
      required: [name, values]
      properties:
        name: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/PackageValue" }

    PackageMod:
      type: object
      required: [op, name]
      properties:
        op:
          type: string
          enum: [add, delete, replace]
          x-enum-varnames: [PackageModAdd, PackageModDelete, PackageModReplace]
        name: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/PackageValue" }
          description: "A delete with no values removes the attribute."

    PackageDataChange:
      type: object
      required: [dn, type]
      description: |
        An intended change to an ordinary entry. The same operations the rest of
        Alder uses, without `setpassword`, which cannot travel without its
        secret.
      properties:
        dn: { type: string }
        type:
          type: string
          enum: [add, modify, delete, rename]
          x-enum-varnames: [PackageOpAdd, PackageOpModify, PackageOpDelete, PackageOpRename]
        attributes:
          type: array
          items: { $ref: "#/components/schemas/PackageAttribute" }
        mods:
          type: array
          items: { $ref: "#/components/schemas/PackageMod" }
        newRdn: { type: string }
        deleteOldRdn: { type: boolean }
        newSuperior: { type: string }

    PackageSchemaChange:
      type: object
      required: [element, op, oid]
      description: |
        An intended change to a schema definition, as what it means rather than
        as one server's modification: the entry and attribute that hold schema
        differ between products, and each target works that out for itself.
      properties:
        element:
          type: string
          enum: [attributeType, objectClass]
          x-enum-varnames: [PackageElementAttributeType, PackageElementObjectClass]
        op:
          type: string
          enum: [add, replace, delete]
          x-enum-varnames: [PackageSchemaAdd, PackageSchemaReplace, PackageSchemaDelete]
        oid: { type: string }
        definition:
          type: string
          description: "The RFC 4512 definition, canonicalised. Required to add or replace."

    PackageChange:
      type: object
      required: [id, kind, destructive]
      properties:
        id:
          type: string
          description: "Identifies this change inside the package. Dependencies name it."
        label:
          type: string
          description: "What the operator was doing when the change was made. Carries no meaning."
        kind:
          type: string
          enum: [data, schema]
          x-enum-varnames: [PackageKindData, PackageKindSchema]
        intent:
          type: string
          enum: [exact, desired]
          x-enum-varnames: [PackageIntentExact, PackageIntentDesired]
          description: |
            How the change is planned. `desired` reconciles an add against the
            entry that is there, changing only the attributes it names, and only
            an add may ask for it. Absence never implies deletion: a deletion is
            only ever an explicit `delete`.
        destructive:
          type: boolean
          description: "The change removes something. Written out rather than inferred."
        data: { $ref: "#/components/schemas/PackageDataChange" }
        schema: { $ref: "#/components/schemas/PackageSchemaChange" }
        dependsOn:
          type: array
          items: { type: string }
          description: "The changes that must be applied before this one."

    PackageOmitted:
      type: object
      required: [reason]
      description: |
        An intended change the package deliberately does not carry, with the
        reason. Nothing is dropped silently.
      properties:
        subject: { type: string, description: "What was left out, named without its values." }
        kind: { type: string }
        reason:
          type: string
          enum: [secret_not_portable, unsupported_change, server_specific]
          x-enum-varnames: [PackageOmittedSecret, PackageOmittedUnsupported, PackageOmittedServerSpecific]
        detail: { type: string }

    PackageProvenance:
      type: object
      description: |
        Where a package came from. Informational: a package proves nothing about
        its origin, and nothing here grants any authority. No host, no bind DN,
        no path, no credential.
      properties:
        alderVersion: { type: string }
        method:
          type: string
          enum: [changeset, data_diff, schema_diff, cli]
          x-enum-varnames: [PackageMethodChangeset, PackageMethodDataDiff, PackageMethodSchemaDiff, PackageMethodCLI]
        vendor: { type: string }
        vendorVersion: { type: string }
        namingContexts: { type: array, items: { type: string } }
        snapshotChecksum: { type: string }
        schemaSnapshotChecksum: { type: string }

    PackageAssumptions:
      type: object
      description: |
        What the package expects of a target, checked at validation. About
        directory semantics, never about a host: the same package should suit
        dev, test and production when their directories are compatible.
      properties:
        namingContexts: { type: array, items: { type: string } }
        schemaOids: { type: array, items: { type: string } }
        objectClasses: { type: array, items: { type: string } }

    PackageCounts:
      type: object
      required: [changes, data, schema, destructive, omitted]
      properties:
        changes: { type: integer }
        data: { type: integer }
        schema: { type: integer }
        destructive: { type: integer }
        omitted: { type: integer }

    ChangePackage:
      type: object
      description: |
        An Alder change package: format `alder-change-package`, version 1 (1.11).
        A portable description of intended changes. It holds no plan token, no
        baseline, no session, no credential and no secret, and it is never
        applied: a target validates it and makes its own plan.
      required: [format, version, id, createdAt, source, assumptions, counts, changes, omitted]
      properties:
        format:
          type: string
          enum: [alder-change-package]
          x-enum-varnames: [PackageFormatAlderChangePackage]
        version: { type: integer }
        id:
          type: string
          description: |
            A generated UUID, stable across copies and independent of the
            filename. Provenance only: it authorises nothing and Alder keeps no
            record of it.
        createdAt: { type: string, format: date-time }
        title: { type: string }
        description: { type: string }
        source: { $ref: "#/components/schemas/PackageProvenance" }
        assumptions: { $ref: "#/components/schemas/PackageAssumptions" }
        counts: { $ref: "#/components/schemas/PackageCounts" }
        changes:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/PackageChange" }
          description: |
            In the package's canonical order: a dependency before what depends
            on it, ties broken by identifier. The order a target applies them in
            comes from the graph.
        omitted:
          type: array
          items: { $ref: "#/components/schemas/PackageOmitted" }
        checksum:
          type: string
          description: |
            SHA-256 over the canonical content without `createdAt` and without
            the checksum itself, so the same intent captured twice has the same
            checksum. Integrity, not authentication: anyone who edits a package
            can recompute it. Packages are not signed.

    PackageBuildRequest:
      type: object
      required: [changes]
      properties:
        title: { type: string }
        description: { type: string }
        changes:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/ChangeRequest" }
          description: |
            The changes to package. A `baseline` or an `expect` on one is
            ignored rather than carried: both describe the environment the
            change was planned in.
        assumptions: { $ref: "#/components/schemas/PackageAssumptions" }
        method:
          type: string
          enum: [changeset, data_diff, schema_diff, cli]
          x-enum-varnames: [PackageBuildChangeset, PackageBuildDataDiff, PackageBuildSchemaDiff, PackageBuildCLI]
        recordSource:
          type: boolean
          description: |
            Record this directory's vendor and naming contexts as provenance.
            Off by default: provenance is informational, and a package that says
            nothing about where it was made is still a valid package.

    PackageItemStatus:
      type: string
      description: |
        What validation concluded about one change against this target.
        `already_satisfied` is a success: a change applied here by hand is not a
        problem to report. `unknown` is never read as ready.
      enum: [ready, already_satisfied, no_op, conflict, dependency_missing, unsupported, target_incompatible, unknown]
      x-enum-varnames: [PackageStatusReady, PackageStatusAlreadySatisfied, PackageStatusNoOp, PackageStatusConflict,
        PackageStatusDependencyMissing, PackageStatusUnsupported, PackageStatusTargetIncompatible, PackageStatusUnknown]

    PackageProblem:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: |
            Why the change is not simply ready, in the vocabulary the plan and
            the schema comparison already use where the situation is the same.
          enum: [entry_missing, entry_exists, parent_missing, rename_target_exists, attribute_undefined,
            object_class_undefined, definition_missing, definition_differs, dependency_required,
            referenced_by_schema, schema_not_editable, schema_target_required, server_defined,
            outside_naming_contexts, assumption_unmet, read_failed, unbuildable_change]
          x-enum-varnames: [PackageProblemEntryMissing, PackageProblemEntryExists, PackageProblemParentMissing,
            PackageProblemRenameTargetExists, PackageProblemAttributeUndefined, PackageProblemObjectClassUndefined,
            PackageProblemDefinitionMissing, PackageProblemDefinitionDiffers, PackageProblemDependencyRequired,
            PackageProblemReferencedBySchema, PackageProblemSchemaNotEditable, PackageProblemSchemaTargetRequired,
            PackageProblemServerDefined, PackageProblemOutsideNamingContexts, PackageProblemAssumptionUnmet,
            PackageProblemReadFailed, PackageProblemUnbuildable]
        subject: { type: string }
        detail: { type: string }

    PackageAssumptionResult:
      type: object
      required: [kind, value, satisfied]
      properties:
        kind: { type: string }
        value: { type: string }
        satisfied: { type: boolean }
        detail: { type: string }

    PackageTarget:
      type: object
      required: [namingContexts, schemaWritable]
      description: "What the directory a package was validated against announces. Display only."
      properties:
        vendor: { type: string }
        vendorVersion: { type: string }
        namingContexts: { type: array, items: { type: string } }
        schemaWritable: { type: boolean }
        schemaEntries: { type: array, items: { type: string } }

    PackageValidationCounts:
      type: object
      required: [ready, alreadySatisfied, noOp, conflict, dependencyMissing, unsupported, targetIncompatible, unknown]
      properties:
        ready: { type: integer }
        alreadySatisfied: { type: integer }
        noOp: { type: integer }
        conflict: { type: integer }
        dependencyMissing: { type: integer }
        unsupported: { type: integer }
        targetIncompatible: { type: integer }
        unknown: { type: integer }

    PackageValidationItem:
      type: object
      required: [id, kind, destructive, status]
      properties:
        id: { type: string }
        kind: { type: string }
        label: { type: string }
        destructive: { type: boolean }
        status: { $ref: "#/components/schemas/PackageItemStatus" }
        intent: { type: string }
        dependsOn: { type: array, items: { type: string } }
        problems:
          type: array
          items: { $ref: "#/components/schemas/PackageProblem" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/ChangeRequest" }
          description: |
            For a ready change: the ordinary change requests it means on this
            target, prepared for `POST /plan` and nothing else. They carry no
            baseline, because only a plan issues one.

    PackageInspection:
      type: object
      required: [packageId, version, createdAt, integrity, source, assumptions, counts, changes, omitted, order]
      properties:
        packageId: { type: string }
        version: { type: integer }
        createdAt: { type: string }
        title: { type: string }
        description: { type: string }
        integrity: { $ref: "#/components/schemas/SnapshotIntegrity" }
        source: { $ref: "#/components/schemas/PackageProvenance" }
        assumptions: { $ref: "#/components/schemas/PackageAssumptions" }
        counts: { $ref: "#/components/schemas/PackageCounts" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/PackageChange" }
        omitted:
          type: array
          items: { $ref: "#/components/schemas/PackageOmitted" }
        order:
          type: array
          items: { type: string }
          description: "The changes in the order a target must apply them."

    PackageValidationRequest:
      type: object
      required: [package]
      properties:
        package: { $ref: "#/components/schemas/ChangePackage" }
        schemaTarget:
          type: string
          description: |
            The schema entry an added definition should be written to, where the
            server keeps schema in several. Without it such a change is a
            conflict with `schema_target_required`.

    PackageValidation:
      type: object
      required: [packageId, integrity, target, assumptions, counts, items, order]
      properties:
        packageId: { type: string }
        integrity: { $ref: "#/components/schemas/SnapshotIntegrity" }
        target: { $ref: "#/components/schemas/PackageTarget" }
        assumptions:
          type: array
          items: { $ref: "#/components/schemas/PackageAssumptionResult" }
        counts: { $ref: "#/components/schemas/PackageValidationCounts" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PackageValidationItem" }
        order:
          type: array
          items: { type: string }
          description: "The identifiers of the ready changes, in the order to apply them."

    PreflightRequest:
      type: object
      required: [artifact]
      properties:
        artifact:
          type: object
          additionalProperties: true
          description: |
            The artifact exactly as its file holds it: a change package, a schema
            snapshot or a data snapshot. It is decoded strictly, as its own
            endpoints decode it.
        schemaTarget:
          type: string
          description: |
            For a change package, the schema entry an added definition would be
            written to, where the server keeps schema in several.

    PreflightClassification:
      type: string
      description: |
        What a finding concludes about one source object. `excluded` is what
        does not travel by design, such as a server-generated value or a withheld
        secret, and does not by itself stop anything else.
      enum: [portable, already_satisfied, prerequisite_required, incompatible, unsupported, unknown, excluded]
      x-enum-varnames: [PreflightPortable, PreflightAlreadySatisfied, PreflightPrerequisiteRequired, PreflightIncompatible, PreflightUnsupported, PreflightUnknown, PreflightExcluded]

    PreflightOverall:
      type: string
      enum: [compatible, compatible_with_prerequisites, incompatible, incomplete]
      x-enum-varnames: [PreflightCompatible, PreflightCompatibleWithPrerequisites, PreflightNotCompatible, PreflightIncomplete]

    PreflightCategory:
      type: string
      enum: [artifact, schema, naming, entries, references, capabilities, operational, sensitive]
      x-enum-varnames: [PreflightCategoryArtifact, PreflightCategorySchema, PreflightCategoryNaming, PreflightCategoryEntries, PreflightCategoryReferences, PreflightCategoryCapabilities, PreflightCategoryOperational, PreflightCategorySensitive]

    PreflightScope:
      type: string
      enum: [artifact, item, definition, entry, attribute, value]
      x-enum-varnames: [PreflightScopeArtifact, PreflightScopeItem, PreflightScopeDefinition, PreflightScopeEntry, PreflightScopeAttribute, PreflightScopeValue]

    PreflightSourceRef:
      type: object
      description: The source object a finding is about. Which fields are set depends on the scope.
      properties:
        item:
          type: string
          description: A change package item id.
        element:
          type: string
          description: attributeType or objectClass.
        oid: { type: string }
        name: { type: string }
        dn: { type: string }
        attribute: { type: string }
        value: { type: string }

    PreflightTargetFact:
      type: object
      required: [fact]
      properties:
        fact:
          type: string
          description: A stable identifier for what the target showed, such as absent, present, hidden or defined_differently.
        detail: { type: string }

    PreflightPrerequisite:
      type: object
      required: [type]
      description: Something that has to be true first, as data rather than advice.
      properties:
        type:
          type: string
          description: schema, syntax, matching_rule, entry or capability.
        element: { type: string }
        oid: { type: string }
        name: { type: string }
        dn: { type: string }
        capability: { type: string }
        providedBy:
          type: string
          description: The finding about the source object that supplies it, when the same source does.

    PreflightFinding:
      type: object
      required: [id, code, classification, category, scope, source, explanation, blocksPortability, blocksPlan, manualAction]
      properties:
        id:
          type: string
          description: Assigned after findings are sorted, so the same source against the same target state gives the same ids.
        code:
          type: string
          description: |
            A stable identifier to switch on, for example definition_portable,
            definition_conflict, syntax_unavailable, naming_context_mismatch,
            parent_missing, parent_unknown, existing_entry_differs,
            reference_missing, reference_unknown, ignored_operational and
            sensitive_value_not_migratable. docs/PREFLIGHT.md lists them all.
        classification: { $ref: "#/components/schemas/PreflightClassification" }
        category: { $ref: "#/components/schemas/PreflightCategory" }
        scope: { $ref: "#/components/schemas/PreflightScope" }
        source: { $ref: "#/components/schemas/PreflightSourceRef" }
        target: { $ref: "#/components/schemas/PreflightTargetFact" }
        explanation: { type: string }
        blocksPortability: { type: boolean }
        blocksPlan:
          type: boolean
          description: A plan made now for the change this concerns would refuse it.
        manualAction:
          type: boolean
          description: An operator has something to do that Alder will not do for them.
        prerequisites:
          type: array
          items: { $ref: "#/components/schemas/PreflightPrerequisite" }
        causes:
          type: array
          description: Ids of the findings that explain this one.
          items: { type: string }
        count:
          type: integer
          description: How many source objects an aggregated finding stands for.
        validationStatus:
          type: string
          description: For a package item, what change package validation concluded.

    PreflightCounts:
      type: object
      required: [portable, alreadySatisfied, prerequisiteRequired, incompatible, unsupported, unknown, excluded]
      properties:
        portable: { type: integer }
        alreadySatisfied: { type: integer }
        prerequisiteRequired: { type: integer }
        incompatible: { type: integer }
        unsupported: { type: integer }
        unknown: { type: integer }
        excluded: { type: integer }

    PreflightSection:
      type: object
      required: [category, counts]
      properties:
        category: { $ref: "#/components/schemas/PreflightCategory" }
        counts: { $ref: "#/components/schemas/PreflightCounts" }

    PreflightSource:
      type: object
      required: [type, format, version, integrity, objects]
      properties:
        type:
          type: string
          enum: [change_package, schema_snapshot, data_snapshot]
          x-enum-varnames: [PreflightSourceChangePackage, PreflightSourceSchemaSnapshot, PreflightSourceDataSnapshot]
        format: { type: string }
        version: { type: integer }
        kind: { type: string }
        id: { type: string }
        title: { type: string }
        checksum: { type: string }
        integrity:
          type: string
          description: verified or unverified.
        vendor: { type: string }
        vendorVersion: { type: string }
        objects: { type: integer }

    PreflightTarget:
      type: object
      required: [namingContexts, schemaWritable, crossVendor]
      properties:
        vendor: { type: string }
        vendorVersion: { type: string }
        namingContexts:
          type: array
          items: { type: string }
        schemaEntry: { type: string }
        schemaWritable: { type: boolean }
        crossVendor:
          type: boolean
          description: Source and target name different products. Metadata only; no finding follows from it.

    PreflightCapability:
      type: object
      required: [capability, available, requiredBy, explanation]
      description: A target capability this source needs. Capabilities it does not need are not listed.
      properties:
        capability: { type: string }
        available: { type: boolean }
        requiredBy: { type: string }
        explanation: { type: string }

    PreflightNotEvaluated:
      type: object
      required: [area, reason]
      properties:
        area: { type: string }
        reason: { type: string }

    PreflightReport:
      type: object
      required: [reportVersion, createdAt, source, target, overall, complete, reasons, counts, sections, capabilities, notEvaluated, findings, truncated]
      properties:
        reportVersion: { type: integer }
        createdAt: { type: string }
        source: { $ref: "#/components/schemas/PreflightSource" }
        target: { $ref: "#/components/schemas/PreflightTarget" }
        overall: { $ref: "#/components/schemas/PreflightOverall" }
        complete: { type: boolean }
        reasons:
          type: array
          description: Why the report is not complete, as stable codes.
          items: { type: string }
        counts: { $ref: "#/components/schemas/PreflightCounts" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/PreflightSection" }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/PreflightCapability" }
        notEvaluated:
          type: array
          items: { $ref: "#/components/schemas/PreflightNotEvaluated" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/PreflightFinding" }
        truncated: { type: boolean }

    StateKind:
      type: string
      description: |
        What a snapshot or comparison is of: directory data, or the published
        schema (1.10). Server configuration is not a kind.
      enum: [data, schema]
      x-enum-varnames: [StateKindData, StateKindSchema]

    SchemaSnapshotSource:
      type: object
      required: [subschemaEntry, collections]
      properties:
        vendor: { type: string }
        vendorVersion: { type: string }
        subschemaEntry: { type: string, description: The DN the server publishes its schema at. }
        collections:
          type: boolean
          description: |
            The server keeps schema in configuration collections and the capturing
            session could read them, so definitions record the collection holding
            them.

    SchemaSnapshotCoverage:
      type: object
      required: [compared, context, notCaptured]
      properties:
        compared: { type: array, items: { type: string } }
        context: { type: array, items: { type: string } }
        notCaptured: { type: array, items: { type: string } }

    SchemaSnapshotCounts:
      type: object
      required: [attributeTypes, objectClasses, ldapSyntaxes, matchingRules, matchingRuleUse, ditContentRules, nameForms, unparsed]
      properties:
        attributeTypes: { type: integer }
        objectClasses: { type: integer }
        ldapSyntaxes: { type: integer }
        matchingRules: { type: integer }
        matchingRuleUse: { type: integer }
        ditContentRules: { type: integer }
        nameForms: { type: integer }
        unparsed: { type: integer }

    SchemaExtensions:
      type: object
      additionalProperties:
        type: array
        items: { type: string }

    SchemaAttributeTypeDefinition:
      type: object
      required: [oid, usage, definition]
      properties:
        oid: { type: string }
        names: { type: array, items: { type: string } }
        desc: { type: string }
        obsolete: { type: boolean }
        sup: { type: string }
        equality: { type: string }
        ordering: { type: string }
        substr: { type: string }
        syntax: { type: string }
        syntaxLength: { type: integer }
        singleValue: { type: boolean }
        collective: { type: boolean }
        noUserModification: { type: boolean }
        usage: { type: string }
        extensions: { $ref: "#/components/schemas/SchemaExtensions" }
        unrecognized: { type: array, items: { type: string } }
        collection: { type: string }
        definition: { type: string, description: The definition text the server published. }

    SchemaObjectClassDefinition:
      type: object
      required: [oid, kind, definition]
      properties:
        oid: { type: string }
        names: { type: array, items: { type: string } }
        desc: { type: string }
        obsolete: { type: boolean }
        sup: { type: array, items: { type: string } }
        kind: { type: string }
        must: { type: array, items: { type: string } }
        may: { type: array, items: { type: string } }
        extensions: { $ref: "#/components/schemas/SchemaExtensions" }
        unrecognized: { type: array, items: { type: string } }
        collection: { type: string }
        definition: { type: string }

    SchemaContextDefinition:
      type: object
      required: [oid, definition]
      properties:
        oid: { type: string }
        names: { type: array, items: { type: string } }
        desc: { type: string }
        syntax: { type: string }
        definition: { type: string }

    SchemaSnapshotContext:
      type: object
      required: [ldapSyntaxes, matchingRules, matchingRuleUse, ditContentRules, nameForms]
      properties:
        ldapSyntaxes: { type: array, items: { $ref: "#/components/schemas/SchemaContextDefinition" } }
        matchingRules: { type: array, items: { $ref: "#/components/schemas/SchemaContextDefinition" } }
        matchingRuleUse: { type: array, items: { $ref: "#/components/schemas/SchemaContextDefinition" } }
        ditContentRules: { type: array, items: { $ref: "#/components/schemas/SchemaContextDefinition" } }
        nameForms: { type: array, items: { $ref: "#/components/schemas/SchemaContextDefinition" } }

    SchemaUnparsedDefinition:
      type: object
      required: [attribute, definition, error]
      properties:
        attribute: { type: string }
        definition: { type: string }
        error: { type: string }

    SchemaSnapshot:
      type: object
      description: |
        An Alder schema snapshot: format `alder-snapshot`, version 1, kind
        `schema` (1.10). See `docs/SNAPSHOTS.md`. Canonical, checksummed like a
        data snapshot, and holding no server configuration.
      required: [format, version, kind, createdAt, source, completeness, coverage, counts, attributeTypes,
        objectClasses, context, unparsed]
      properties:
        format:
          type: string
          enum: [alder-snapshot]
          x-enum-varnames: [SchemaSnapshotFormatAlderSnapshot]
        version: { type: integer }
        kind:
          type: string
          enum: [schema]
          x-enum-varnames: [SchemaSnapshotKindSchema]
        createdAt: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/SchemaSnapshotSource" }
        completeness:
          type: string
          enum: [complete, partial]
          x-enum-varnames: [SchemaSnapshotComplete, SchemaSnapshotPartial]
        coverage: { $ref: "#/components/schemas/SchemaSnapshotCoverage" }
        counts: { $ref: "#/components/schemas/SchemaSnapshotCounts" }
        attributeTypes: { type: array, items: { $ref: "#/components/schemas/SchemaAttributeTypeDefinition" } }
        objectClasses: { type: array, items: { $ref: "#/components/schemas/SchemaObjectClassDefinition" } }
        context: { $ref: "#/components/schemas/SchemaSnapshotContext" }
        unparsed: { type: array, items: { $ref: "#/components/schemas/SchemaUnparsedDefinition" } }
        checksum: { type: string }

    SnapshotIntegrity:
      type: string
      enum: [verified, unverified]
      x-enum-varnames: [SnapshotIntegrityVerified, SnapshotIntegrityUnverified]

    SnapshotInspection:
      type: object
      required: [version, kind, createdAt, source, operationalAttributes, schemaAvailable, excluded,
        entryCount, checksum, integrity]
      properties:
        version: { type: integer }
        kind: { type: string }
        createdAt: { type: string }
        source: { $ref: "#/components/schemas/SnapshotSource" }
        operationalAttributes: { type: boolean }
        schemaAvailable: { type: boolean }
        excluded:
          type: array
          items: { $ref: "#/components/schemas/SnapshotExcluded" }
        entryCount: { type: integer }
        checksum: { type: string, description: "The checksum of the canonical content, whether or not the document carried one." }
        integrity: { $ref: "#/components/schemas/SnapshotIntegrity" }
        schema:
          $ref: "#/components/schemas/SchemaSnapshotSummary"
          description: |
            For a schema snapshot (1.10): what it holds. The data fields then describe
            the read of the subschema entry: `source.base` is that entry, `scope` is
            `base`, `operationalAttributes` is true and `entryCount` is 1.

    SchemaSnapshotSummary:
      type: object
      required: [subschemaEntry, completeness, counts, collections]
      properties:
        subschemaEntry: { type: string }
        completeness:
          type: string
          enum: [complete, partial]
          x-enum-varnames: [SchemaSummaryComplete, SchemaSummaryPartial]
        counts: { $ref: "#/components/schemas/SchemaSnapshotCounts" }
        collections: { type: boolean }

    DiffLiveSide:
      type: object
      description: |
        The live directory. Omitted fields are taken from the other side's
        snapshot, so `{}` means "the same subtree, as it is now".
      properties:
        base: { type: string }
        scope: { $ref: "#/components/schemas/SnapshotScope" }
        filter: { type: string }
        operationalAttributes: { type: boolean }
        kind:
          $ref: "#/components/schemas/StateKind"
          description: |
            What to read. Omitted, it is the other side's snapshot kind. Added in 1.10.
        schemaTarget:
          type: string
          description: |
            For a schema comparison with the live schema as source: the schema entry
            an added definition would be written to, where the server keeps schema
            in several collections. Without it such additions are
            `schema_target_required`.

    DiffSide:
      type: object
      description: Exactly one of `snapshot` or `live`.
      properties:
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/Snapshot"
            - $ref: "#/components/schemas/SchemaSnapshot"
        live: { $ref: "#/components/schemas/DiffLiveSide" }

    DiffRequest:
      type: object
      required: [source, target]
      properties:
        source: { $ref: "#/components/schemas/DiffSide" }
        target: { $ref: "#/components/schemas/DiffSide" }
        includeUnchanged:
          type: boolean
          description: List unchanged entries as items rather than only counting them.

    DiffSideKind:
      type: string
      enum: [snapshot, live]
      x-enum-varnames: [DiffSideKindSnapshot, DiffSideKindLive]

    DiffSideSummary:
      type: object
      required: [kind, base, scope, filter, operationalAttributes, entryCount]
      properties:
        kind: { $ref: "#/components/schemas/DiffSideKind" }
        vendor: { type: string }
        base: { type: string }
        scope: { $ref: "#/components/schemas/SnapshotScope" }
        filter: { type: string }
        createdAt: { type: string }
        checksum: { type: string }
        integrity: { $ref: "#/components/schemas/SnapshotIntegrity" }
        operationalAttributes: { type: boolean }
        entryCount: { type: integer }
        definitionCount:
          type: integer
          description: For a schema side, how many definitions it holds, parsed or not. Added in 1.10.

    DiffKind:
      type: string
      description: "`metadata_only` (1.10) is a schema definition whose meaning is equal and whose X- extensions differ."
      enum: [added, removed, modified, renamed, unchanged, unknown, metadata_only]
      x-enum-varnames: [DiffKindAdded, DiffKindRemoved, DiffKindModified, DiffKindRenamed, DiffKindUnchanged, DiffKindUnknown, DiffKindMetadataOnly]

    DiffReasonCode:
      type: string
      enum: [search_limit_reached, scope_mismatch, insufficient_access, access_not_verified, schema_unavailable, schema_partial]
      x-enum-varnames: [DiffReasonSearchLimitReached, DiffReasonScopeMismatch, DiffReasonInsufficientAccess,
        DiffReasonAccessNotVerified, DiffReasonSchemaUnavailable, DiffReasonSchemaPartial]

    DiffReason:
      type: object
      required: [code, detail]
      properties:
        code: { $ref: "#/components/schemas/DiffReasonCode" }
        detail: { type: string }

    DiffCounts:
      type: object
      required: [compared, added, removed, modified, renamed, unchanged, unknown]
      properties:
        compared: { type: integer }
        added: { type: integer }
        removed: { type: integer }
        modified: { type: integer }
        renamed: { type: integer }
        unchanged: { type: integer }
        unknown: { type: integer }

    DiffAttributeChange:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/DiffKind" }
        added:
          type: array
          items: { $ref: "#/components/schemas/SnapshotValue" }
        removed:
          type: array
          items: { $ref: "#/components/schemas/SnapshotValue" }
        addedOmitted: { type: integer, description: Values in the target and not the source beyond the 1,000 listed. }
        removedOmitted: { type: integer, description: Values in the source and not the target beyond the 1,000 listed. }
        operational: { type: boolean }
        sensitive: { type: boolean, description: "Compared by withheld count only; no values are ever listed." }
        comparedByBytes: { type: boolean }
        withheldSource: { type: integer }
        withheldTarget: { type: integer }
        unknownReason: { $ref: "#/components/schemas/DiffReasonCode" }

    DiffCandidateBlocked:
      type: string
      enum: [source_not_live, incomplete_comparison, nothing_to_change, unknown_difference,
        only_unchangeable_attributes, unresolvable_rename, metadata_only, schema_not_editable, schema_target_required,
        server_defined, non_numeric_oid, unresolved_reference, dependency_cycle, unbuildable_definition]
      x-enum-varnames: [DiffBlockedSourceNotLive, DiffBlockedIncompleteComparison, DiffBlockedNothingToChange,
        DiffBlockedUnknownDifference, DiffBlockedOnlyUnchangeableAttributes, DiffBlockedUnresolvableRename,
        DiffBlockedMetadataOnly, DiffBlockedSchemaNotEditable, DiffBlockedSchemaTargetRequired, DiffBlockedServerDefined,
        DiffBlockedNonNumericOID, DiffBlockedUnresolvedReference, DiffBlockedDependencyCycle, DiffBlockedUnbuildableDefinition]

    DiffCandidate:
      type: object
      description: |
        Change requests that would move the live source toward the target: input
        for `POST /plan`, never applied from here.
      required: [changes, destructive]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/ChangeRequest" }
        destructive:
          type: boolean
          description: The candidate deletes an entry. Never selected for the caller.
        blocked: { $ref: "#/components/schemas/DiffCandidateBlocked" }

    DiffItem:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/DiffKind" }
        sourceDn: { type: string }
        targetDn: { type: string }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/DiffAttributeChange" }
        reason: { $ref: "#/components/schemas/DiffReasonCode" }
        candidate: { $ref: "#/components/schemas/DiffCandidate" }

    SchemaElementKind:
      type: string
      enum: [attributeType, objectClass]
      x-enum-varnames: [SchemaElementAttributeType, SchemaElementObjectClass]

    SchemaFieldCategory:
      type: string
      description: "`core` changes what a definition does; `description` is DESC; `extension` is an X- extension."
      enum: [core, description, extension]
      x-enum-varnames: [SchemaFieldCore, SchemaFieldDescription, SchemaFieldExtension]

    SchemaFieldChange:
      type: object
      required: [field, category]
      properties:
        field: { type: string }
        category: { $ref: "#/components/schemas/SchemaFieldCategory" }
        source: { type: array, items: { type: string } }
        target: { type: array, items: { type: string } }

    SchemaReference:
      type: object
      required: [element, oid, relation]
      properties:
        element: { $ref: "#/components/schemas/SchemaElementKind" }
        oid: { type: string, description: Empty when the reference resolves to nothing on that side. }
        name: { type: string }
        relation:
          type: string
          enum: [sup, must, may]
          x-enum-varnames: [SchemaRelationSup, SchemaRelationMust, SchemaRelationMay]

    SchemaProblem:
      type: string
      description: |
        A fact about a schema difference. `unparsed_definition`, `ambiguous_name`
