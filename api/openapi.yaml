      x-enum-varnames: [SchemaProblemUnparsed, SchemaProblemAmbiguousName, SchemaProblemUnrecognizedKeyword,
        SchemaProblemNonNumericOID, SchemaProblemUnresolvedReference, SchemaProblemReferencedBySchema,
        SchemaProblemUsedByEntries, SchemaProblemUsageUnknown, SchemaProblemServerDefined, SchemaProblemDependencyCycle]

    SchemaDiffCandidate:
      type: object
      description: |
        Change requests that would move the live schema toward the target: the
        schema editor's own modifications of the schema entry, input for
        `POST /plan`, never applied from here.
      required: [changes, destructive]
      properties:
        changes: { type: array, items: { $ref: "#/components/schemas/ChangeRequest" } }
        destructive: { type: boolean, description: The candidate removes a definition. Never selected for the caller. }
        blocked: { $ref: "#/components/schemas/DiffCandidateBlocked" }
        impact: { type: array, items: { $ref: "#/components/schemas/SchemaProblem" } }
        requires:
          type: array
          items: { type: string }
          description: Keys of other items whose change must be staged before this one.

    SchemaDiffItem:
      type: object
      required: [key, element, oid, kind]
      properties:
        key: { type: string, description: "`element:oid`, stable within a comparison." }
        element: { $ref: "#/components/schemas/SchemaElementKind" }
        oid: { type: string }
        names: { type: array, items: { type: string } }
        kind: { $ref: "#/components/schemas/DiffKind" }
        fields: { type: array, items: { $ref: "#/components/schemas/SchemaFieldChange" } }
        sourceDefinition: { type: string }
        targetDefinition: { type: string }
        sourceCollection: { type: string }
        targetCollection: { type: string }
        requires: { type: array, items: { $ref: "#/components/schemas/SchemaReference" } }
        requiredBy: { type: array, items: { $ref: "#/components/schemas/SchemaReference" } }
        problems: { type: array, items: { $ref: "#/components/schemas/SchemaProblem" } }
        candidate: { $ref: "#/components/schemas/SchemaDiffCandidate" }

    SchemaDiffCounts:
      type: object
      required: [compared, added, removed, modified, metadataOnly, unchanged, unknown]
      properties:
        compared: { type: integer }
        added: { type: integer }
        removed: { type: integer }
        modified: { type: integer }
        metadataOnly: { type: integer }
        unchanged: { type: integer }
        unknown: { type: integer }

    SchemaDiff:
      type: object
      required: [attributeTypes, objectClasses, items, order]
      properties:
        attributeTypes: { $ref: "#/components/schemas/SchemaDiffCounts" }
        objectClasses: { $ref: "#/components/schemas/SchemaDiffCounts" }
        items: { type: array, items: { $ref: "#/components/schemas/SchemaDiffItem" } }
        order:
          type: array
          items: { type: string }
          description: |
            Keys of the items a change could be derived for, in dependency order:
            what a definition needs before it for additions and modifications, what
            names a definition before it for removals. Never lexical.

    Diff:
      type: object
      required: [kind, source, target, complete, counts, crossVendor, operationalIgnored, items]
      properties:
        kind:
          $ref: "#/components/schemas/StateKind"
          description: What was compared. Added in 1.10; earlier releases compare data only.
        schema: { $ref: "#/components/schemas/SchemaDiff" }
        source: { $ref: "#/components/schemas/DiffSideSummary" }
        target: { $ref: "#/components/schemas/DiffSideSummary" }
        complete: { type: boolean }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/DiffReason" }
        counts: { $ref: "#/components/schemas/DiffCounts" }
        crossVendor: { type: boolean }
        comparedByBytes:
          type: array
          items: { type: string }
        ruleDifferences:
          type: array
          items: { type: string }
        operationalIgnored: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/DiffItem" }

    AttributeValue:
      type: object
      description: |
        Exactly one of `text` or `base64` is present. `text` carries a value
        that is valid UTF-8 and belongs to a textual syntax; everything else,
        including anything with a `;binary` option, arrives as `base64`.
      properties:
        text: { type: string }
        base64: { type: string }
        size:
          type: integer
          description: The value's length in bytes.

    AttributeKind:
      type: object
      description: The schema's opinion about one attribute, for the editor.
      required: [name, kind, known]
      properties:
        name: { type: string }
        oid: { type: string }
        desc: { type: string }
        kind:
          type: string
          enum: [string, text, integer, boolean, dn, time, binary, password, certificate, image, oid]
        syntax: { type: string }
        syntaxLabel: { type: string }
        maxLength: { type: integer }
        singleValue: { type: boolean }
        readOnly:
          type: boolean
          description: NO-USER-MODIFICATION; the server owns this value.
        operational: { type: boolean }
        sensitive:
          type: boolean
          description: A secret. Values are withheld and never logged.
        obsolete: { type: boolean }
        known:
          type: boolean
          description: False when the schema does not define this attribute.

    EntryAttribute:
      type: object
      required: [name, kind, values]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/AttributeKind" }
        values:
          type: array
          items: { $ref: "#/components/schemas/AttributeValue" }
        required:
          type: boolean
          description: In the MUST set of this entry's object classes.
        withheld:
          type: boolean
          description: |
            The values were withheld because the attribute is sensitive. The
            count is still reported so the UI can say the attribute is set.
        valueCount: { type: integer }
        valueSchemes:
          type: array
          items: { type: string }
          description: |
            For a withheld attribute, the storage scheme of each value — the
            `{SSHA}` or `{PBKDF2-SHA512}` prefix RFC 2307 puts in front of a
            hash — where the value carries one.

            Only the label crosses the wire. The hash itself is never sent, and
            a value that does not begin with `{` reports nothing rather than
            having its first characters guessed at.

            It is worth reporting because the scheme is the one thing about a
            stored password an administrator needs to see: it is what says
            whether the directory is still handing out crypt(3) hashes.

    Requirements:
      type: object
      properties:
        must: { type: array, items: { type: string } }
        may: { type: array, items: { type: string } }
        settableOperational:
          type: array
          items: { type: string }
          description: |
            Operational attributes this server says a client may set on an
            entry: `USAGE directoryOperation` and no `NO-USER-MODIFICATION`.

            Operational is not the same as read-only, and treating it as such
            is why an account could not be locked from here — 389 DS keeps
            `nsAccountLock` itself and still expects you to set it, as OpenLDAP
            does for a ppolicy `pwdAccountLockedTime`. Only
            `NO-USER-MODIFICATION` means the directory owns an attribute.

            These are not in any object class, so they never appear in `must`
            or `may` and an entry that has never been locked shows no sign that
            it could be. They are listed separately rather than merged in,
            because "what this class permits" and "what the server lets you set
            besides" are different answers to different questions.

            `dSAOperation` attributes are excluded: `namingContexts` and
            `supportedControl` are operational and unflagged too, but they
            belong to the server rather than to an entry.
        structural:
          type: string
          description: The single structural class, or empty when it is ambiguous.
        unknown:
          type: array
          items: { type: string }
          description: Object classes on the entry that the schema does not define.

    EntryView:
      type: object
      required: [dn, attributes]
      properties:
        dn: { type: string }
        rdn: { type: string }
        parentDn: { type: string }
        objectClasses: { type: array, items: { type: string } }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/EntryAttribute" }
        requirements: { $ref: "#/components/schemas/Requirements" }
        referencedByFilter:
          type: string
          description: |
            An RFC 4515 filter matching every entry that names this one — the
            answer to "which groups is this person in", and to "what would
            break if I deleted this".

            Built here rather than in the browser, with the filter builder, so
            the DN is escaped once by the code that owns that rule. It asserts
            only the attributes this server actually defines, and only ones a
            user may modify, so it is the same question phrased in whatever
            vocabulary the connected directory has.

            Absent when the server defines none of them, or when the entry has
            no DN to search for.
        membershipAttributes:
          type: array
          items: { type: string }
          description: |
            The attributes this entry's object classes use to hold members,
            canonically spelled, whether the entry currently has values in them
            or not. Empty for an entry that is not a group.

            Present so adding a member can be one action rather than an edit of
            a list: replacing a fifty-member list to add one person removes
            anybody another administrator added since the entry was read.
        candidateKinds:
          type: array
          items: { $ref: "#/components/schemas/AttributeKind" }
          description: |
            The schema's opinion about the attributes this entry's classes
            permit but which it does not currently carry.

            Without it the editor knows nothing about an attribute until the
            entry already has one, so adding an attribute produced a bare text
            box labelled "not in the schema" — no description, no syntax, and a
            text box for something the schema calls a Boolean.
        ldif:
          type: string
          description: The entry as an LDIF content record, ready to copy.
        hasChildren: { type: boolean }

    TreeNode:
      type: object
      required: [dn, rdn, hasChildren]
      properties:
        dn: { type: string }
        rdn:
          type: string
          description: The leftmost RDN, which is what the tree shows as a label.
        hasChildren: { type: boolean }
        objectClasses: { type: array, items: { type: string } }
        structural:
          type: string
          description: The structural class, used to pick an icon.
        isNamingContext: { type: boolean }

    TreePage:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TreeNode" }
        cookie: { type: string }
        truncated: { type: boolean }
        hiddenChildren:
          type: integer
          description: |
            Children this parent has that the session could not see.

            Some servers publish `numSubordinates`, computed by the server and
            not filtered by the access rules, and where they do the gap between
            it and the children returned is exactly what this bind may not see.
            Absent where the server does not publish it, which is a capability
            and not a vendor trait — it is read from the entry, never inferred
            from who the server is. Absent too when the listing was truncated,
            since then the gap is paging rather than access.

    CountResult:
      type: object
      required: [count, truncated]
      properties:
        count: { type: integer }
        truncated:
          type: boolean
          description: |
            True when the limit was reached, so the real total is higher and the
            count must be reported as "at least".
        took: { type: string }

    SearchRequest:
      type: object
      required: [baseDn, scope, filter]
      properties:
        baseDn: { type: string }
        scope:
          type: string
          enum: [base, one, sub]
        filter:
          type: string
          description: A raw RFC 4515 filter. It is parsed, never interpolated.
        attributes:
          type: array
          items: { type: string }
        limit: { type: integer, minimum: 1, maximum: 10000, default: 100 }
        pageSize: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        cookie: { type: string }

    SearchResultEntry:
      type: object
      required: [dn]
      properties:
        dn: { type: string }
        rdn: { type: string }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/EntryAttribute" }

    SearchResponse:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/SearchResultEntry" }
        truncated:
          type: boolean
          description: |
            True when results were cut short. A silently truncated search is
            worse than no search, so this is always surfaced.
        cookie: { type: string }
        referrals: { type: array, items: { type: string } }
        took:
          type: string
          description: How long the search took, as a duration string.
        command:
          type: string
          description: |
            The `ldapsearch` that would run this same search, for a runbook, a
            ticket or a script.

            Rendered here rather than in the browser for the reason the LDIF
            preview is: the browser holds the filter as it was typed, the
            server holds the filter it parsed and would send, and normalising
            it is the point of parsing it. A command built from the typed text
            would describe a different search from the results beside it.

            Never contains the bind password. `-W` makes ldapsearch prompt.

    ObjectViewList:
      type: object
      required: [views]
      properties:
        views:
          type: array
          items: { $ref: "#/components/schemas/ObjectView" }

    ObjectView:
      type: object
      required: [id, label, filter, anchors, columns]
      properties:
        id:
          type: string
          enum: [users, groups, organizationalUnits]
          # Named explicitly: the bare generated constants would be Users and
          # Groups, which are far too general to sit in the package namespace.
          x-enum-varnames: [ViewUsers, ViewGroups, ViewOrganizationalUnits]
        label: { type: string }
        description:
          type: string
          description: One line on what this view is showing, in the UI's words.
        filter:
          type: string
          description: |
            An RFC 4515 filter over the anchor classes this server defines,
            rendered by the filter builder. It is posted to /search as-is.
        anchors:
          type: array
          items: { type: string }
          description: |
            The object classes the filter matches on. Shown to the user, so the
            view can say what it means by "user" rather than ask to be trusted.
        createClasses:
          type: array
          items: { type: string }
          description: |
            The structural classes this view matches, which are the classes a
            new one could be created as. A server publishes hundreds of
            structural classes and a list of all of them is not a choice anybody
            can make; this is the handful that would produce an entry this view
            would then show.
        columns:
          type: array
          items: { $ref: "#/components/schemas/ObjectViewColumn" }
        permittedColumns:
          type: array
          items: { $ref: "#/components/schemas/ObjectViewColumn" }
          description: |
            Every attribute an entry this view matches could hold, as candidates
            for the columns. `columns` is the default subset of this.

            Computed over every class the view's filter matches, not just the
            classes it anchors on — walking the superior chain alone would drop
            `mail` from Users, because `person` does not permit it and
            `inetOrgPerson` does. That is the bug the object views were fixed
            for once already, and repeating the walk in the browser is how the
            two copies would drift apart again.

    ObjectViewColumn:
      type: object
      required: [attribute, label]
      properties:
        attribute:
          type: string
          description: The attribute type, canonically spelled by the schema.
        label:
          type: string
          description: |
            A readable heading. Falls back to the attribute name itself, which
            is always shown alongside it: a friendly label that hides the real
            name is how somebody learns the wrong thing about their directory.
        desc:
          type: string
          description: The schema's own DESC, where the server published one.

    EntryComparison:
      type: object
      required: [left, right, attributes, counts, truncated]
      properties:
        left: { $ref: "#/components/schemas/ComparedEntry" }
        right: { $ref: "#/components/schemas/ComparedEntry" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/AttributeComparison" }
        counts: { $ref: "#/components/schemas/ComparisonCounts" }
        truncated:
          type: boolean
          description: Some attribute held more values than the limit reports.

    ComparedEntry:
      type: object
      required: [dn]
      properties:
        dn: { type: string }
        rdn: { type: string }
        objectClasses: { type: array, items: { type: string } }
        structural:
          type: string
          description: |
            The single structural class. A difference here explains most of the
            rows below it and should be read first.

    ComparisonCounts:
      type: object
      required: [same, differs, leftOnly, rightOnly, withheld, undetermined]
      description: |
        One bucket per status, and every attribute lands in exactly one, so the
        six sum to the length of `attributes`.
      properties:
        same: { type: integer }
        differs: { type: integer }
        leftOnly: { type: integer }
        rightOnly: { type: integer }
        undetermined:
          type: integer
          description: |
            One-sided, and the missing side could not be read. Counted apart
            from `leftOnly` and `rightOnly` because those name a difference
            between two entries and this names a limit on what the session may
            see.
        withheld:
          type: integer
          description: |
            Held by both and not compared. Counted separately rather than folded
            into `same`, which would be a claim about password material.

    AttributeComparison:
      type: object
      required: [name, status, left, right]
      properties:
        name:
          type: string
          description: |
            The attribute description, options included. `userCertificate;binary`
            and `userCertificate` are two rows, not one.
        status:
          type: string
          enum: [same, differs, leftOnly, rightOnly, withheld, undetermined]
          description: |
            `withheld` means both entries hold the attribute and it was not
            compared, because it is sensitive. It is a status of its own rather
            than `same` with a flag beside it: a client reading only this field
            must not be able to conclude that two passwords match.

            `undetermined` means the access rules stopped the comparison. The
            attribute is on one side and was not returned for the other, and
            asking the server directly said the bind may not look rather than
            that the entry lacks it. Reporting that as `leftOnly` would be a
            statement about the directory that this session has no basis for.
            The side that could not be read carries `denied`.
        left: { $ref: "#/components/schemas/ComparedSide" }
        right: { $ref: "#/components/schemas/ComparedSide" }
        values:
          type: array
          items: { $ref: "#/components/schemas/ValueComparison" }
          description: Absent for a withheld attribute.
        withheld:
          type: boolean
          description: |
            Sensitive, so no value crosses the wire from either side. Presence
            is still reported on each side, because `/entry` already says whether
            a password is set. Equality is not: reporting whether two entries
            hold the same password hash would be an oracle about password
            material the product offers nowhere else.
        truncated: { type: boolean }

    ComparedSide:
      type: object
      required: [present, valueCount, required, permitted]
      properties:
        present: { type: boolean }
        valueCount: { type: integer }
        required:
          type: boolean
          description: |
            Required by *this* entry's own classes. Required and absent is
            sometimes the whole answer, and is invisible to a diff of what is
            present.
        permitted:
          type: boolean
          description: |
            Permitted by this entry's own classes. Present but not permitted is
            reachable through an extensibleObject or a DIT content rule, and is
            a finding rather than a curiosity.
        denied:
          type: boolean
          description: |
            The access rules forbid this bind from reading the attribute on this
            side, so its absence here says nothing about the entry. Set only
            after the server was asked directly; a plain read cannot tell this
            from an attribute the entry does not hold.
        valueSchemes:
          type: array
          items: { type: string }
          description: The storage scheme of each withheld value, never the value.

    ValueComparison:
      type: object
      required: [side, value]
      properties:
        side:
          type: string
          enum: [both, left, right]
        value: { $ref: "#/components/schemas/AttributeValue" }

    InventoryRequest:
      type: object
      required: [baseDn, scope, attribute]
      properties:
        baseDn: { type: string }
        scope:
          type: string
          enum: [base, one, sub]
        filter:
          type: string
          description: An RFC 4515 filter narrowing what is examined. Parsed, never pasted.
        attribute:
          type: string
          description: |
            The attribute to tally. Attribute options are folded together:
            `alderTeam` and `alderTeam;lang-fr` are one attribute.
        limit:
          type: integer
          minimum: 1
          maximum: 250000
          default: 1000
          description: |
            Entries examined. The tally is folded a page at a time, so this
            bounds how long it takes rather than how much it holds — which is
            why it can be far larger than the other limits here.
        maxValues:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
          description: |
            Rows returned. The counts behind them stay exact — the tail is
            reported as a remainder rather than dropped.

    InventoryResponse:
      type: object
      required: [attribute, examined, limit, truncated, withValue, withoutValue, distinctValues, singletonValues, otherValues, otherEntries, values]
      properties:
        attribute: { type: string }
        examined:
          type: integer
          description: |
            Entries the search returned. Every other number here is about these
            entries, not about the directory.
        limit: { type: integer }
        truncated:
          type: boolean
          description: |
            The search reached its limit, so entries exist that were not
            examined and the tally is partial.
        withValue: { type: integer }
        withoutValue: { type: integer }
        distinctValues:
          type: integer
          description: Exact across the examined entries, even when fewer rows are returned.
        singletonValues:
          type: integer
          description: |
            Distinct values held by exactly one entry. The typo signal: a value
            one entry holds among three hundred is usually a misspelling of one
            that ninety hold.
        otherValues:
          type: integer
          description: Distinct values beyond `maxValues`, counted but not listed.
        otherEntries:
          type: integer
          description: Entries carrying one of those values.
        values:
          type: array
          items: { $ref: "#/components/schemas/InventoryRow" }

    InventoryRow:
      type: object
      required: [value, entries]
      properties:
        value: { $ref: "#/components/schemas/AttributeValue" }
        entries:
          type: integer
          description: Entries carrying this value, not occurrences of it.

    ResolveResult:
      type: object
      required: [query, destinations]
      properties:
        query: { type: string }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
          description: |
            Empty when the input is not usable — a half-typed filter, say.
            More than one when the input is genuinely ambiguous.

    Destination:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [entry, search]
        label: { type: string }
        dn:
          type: string
          description: Set for an entry destination; the DN, canonically rendered.
        filter:
          type: string
          description: |
            Set for a search destination, built by the filter package and
            escaped — the text came from a box somebody typed in.
        base: { type: string }

    MemberList:
      type: object
      required: [members, truncated]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/ExpandedMember" }
        truncated:
          type: boolean
          description: |
            True when the walk stopped at its bound. A membership list that
            quietly omits people is worse than none, since the question being
            asked is usually "who can get in".
        cycles:
          type: array
          items: { type: string }
          description: |
            Groups that contain themselves, directly or through others. A
            configuration error somebody should hear about, not a condition to
            survive silently.
        dangling:
          type: array
          items: { type: string }
          description: |
            Member values whose entry could not be read. Two things produce
            this and nothing distinguishes them: the entry was deleted while the
            group went on naming it, or it exists and this bind may not see it.
            A server answers "no such object" either way, deliberately, so that
            refusing access does not disclose what is there.

            So this is a list of members whose status is unknown, not a list of
            broken references. Reporting it as the latter tells an operator
            auditing who can reach something that a member is gone when they may
            still be in the group.
        unresolvable:
          type: array
          items: { type: string }
          description: |
            Membership values that are not DNs, and so cannot be followed to an
            entry: `memberUid` holds a login name, `memberURL` a search.

    ExpandedMember:
      type: object
      required: [dn, group, direct]
      properties:
        dn: { type: string }
        rdn: { type: string }
        group:
          type: boolean
          description: Whether this member is itself a group that was expanded.
        direct:
          type: boolean
          description: Whether the group names this member itself.
        via:
          type: array
          items: { type: string }
          description: |
            The chain of groups that brought this member in, outermost first.
            Empty for a direct member. This is the part a flat list cannot say,
            and the part somebody needs in order to remove an unwanted member
            from the right group.
        through:
          type: string
          description: The membership attribute that names this member.

    ReferenceList:
      type: object
      required: [references, truncated]
      properties:
        references:
          type: array
          items: { $ref: "#/components/schemas/Reference" }
        truncated:
          type: boolean
          description: |
            True when the search stopped early, so there are references this
            does not list. A list that quietly omits some is worse than none
            when the question is "what would break if I deleted this".

            Note that `false` does not make the list complete. It is the result
            of a search, so it holds the referring entries *this session can
            see*; one hidden by the access rules is absent exactly as one that
            does not exist is, and nothing in the protocol distinguishes them.
            The answer is "nothing I can see points at this", which is not the
            same claim as "nothing points at this".

            That applies to a list with entries in it as much as to an empty
            one: acting on three references you can see is no safer when there
            is a fourth you cannot. Unlike the comparison, there is nothing to
            detect here -- a Compare recovers absent-from-denied for an
            attribute on an entry you can already read, and no operation says
            "your search would have matched something you may not see".
        searchedBase:
          type: string
          description: The naming context this looked in.

    Reference:
      type: object
      required: [dn, attribute, value]
      properties:
        dn:
          type: string
          description: The entry doing the naming.
        rdn: { type: string }
        attribute:
          type: string
          description: |
            The attribute it names this entry by, canonically spelled. Removing
            the reference is a delete of one value of this attribute on that
            entry — which is why it is reported rather than inferred.
        value:
          type: string
          description: |
            The value as the directory stores it, which is not always the
            subject's own DN: `uniqueMember` may carry a `#uid` suffix, and a
            server may return a different but equivalent spelling. A delete has
            to name the stored value — `uniqueMemberMatch` compares the UID
            part too, so a delete of the bare DN would match nothing and the
            reference would survive a change that reported success.

    SchemaCounts:
      type: object
      properties:
        objectClasses: { type: integer }
        attributeTypes: { type: integer }
        syntaxes: { type: integer }
        matchingRules: { type: integer }
        matchingRuleUses: { type: integer }
        ditContentRules: { type: integer }
        nameForms: { type: integer }
        errors: { type: integer }

    ObjectClassSummary:
      type: object
      required: [name, oid, kind]
      properties:
        origin:
          type: string
          description: |
            Where this definition came from, in the server's own words. The
            X-ORIGIN extension where the server keeps one, and otherwise the
            schema collection holding it on a server that stores its schema in
            configuration entries.

            Deliberately not a "shipped or custom" flag. One of the two servers
            Alder targets discards X-ORIGIN when it loads a schema file, so on
            that server such a flag would be a guess. This reports what was
            actually published, and is absent where nothing was.
        name: { type: string }
        names: { type: array, items: { type: string } }
        oid: { type: string }
        desc: { type: string }
        kind: { type: string, enum: [STRUCTURAL, ABSTRACT, AUXILIARY] }
        obsolete: { type: boolean }
        superiors: { type: array, items: { type: string } }

    AttributeTypeSummary:
      type: object
      required: [name, oid]
      properties:
        origin:
          type: string
          description: |
            Where this definition came from, in the server's own words. The
            X-ORIGIN extension where the server keeps one, and otherwise the
            schema collection holding it on a server that stores its schema in
            configuration entries.

            Deliberately not a "shipped or custom" flag. One of the two servers
            Alder targets discards X-ORIGIN when it loads a schema file, so on
            that server such a flag would be a guess. This reports what was
            actually published, and is absent where nothing was.
        name: { type: string }
        names: { type: array, items: { type: string } }
        oid: { type: string }
        desc: { type: string }
        obsolete: { type: boolean }
        superior: { type: string }
        syntax: { type: string }
        syntaxLabel: { type: string }
        equality: { type: string }
        singleValue: { type: boolean }
        operational: { type: boolean }

    SyntaxSummary:
      type: object
      required: [oid]
      properties:
        oid: { type: string }
        desc: { type: string }
        kind: { type: string }
        usedByCount: { type: integer }

    MatchingRuleSummary:
      type: object
      required: [name, oid]
      properties:
        name: { type: string }
        oid: { type: string }
        desc: { type: string }
        syntax: { type: string }
        obsolete: { type: boolean }

    SchemaParseError:
      type: object
      properties:
        attribute: { type: string }
        definition: { type: string }
        message: { type: string }

    SchemaView:
      type: object
      required: [subschemaDn, counts]
      properties:
        subschemaDn: { type: string }
        counts: { $ref: "#/components/schemas/SchemaCounts" }
        objectClasses:
          type: array
          items: { $ref: "#/components/schemas/ObjectClassSummary" }
        attributeTypes:
          type: array
          items: { $ref: "#/components/schemas/AttributeTypeSummary" }
        syntaxes:
          type: array
          items: { $ref: "#/components/schemas/SyntaxSummary" }
        matchingRules:
          type: array
          items: { $ref: "#/components/schemas/MatchingRuleSummary" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/SchemaParseError" }
          description: |
            Definitions the server published that this parser could not read.
            A non-empty list is a partial load, not a failed one, and the UI
            says so rather than pretending the schema is complete.

    RequirementsView:
      type: object
      required: [requirements, kinds]
      properties:
        requirements: { $ref: "#/components/schemas/Requirements" }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/AttributeKind" }
          description: One per attribute in the MUST and MAY sets.

    ObjectClassDetail:
      type: object
      required: [summary]
      properties:
        summary: { $ref: "#/components/schemas/ObjectClassSummary" }
        must: { type: array, items: { type: string } }
        may: { type: array, items: { type: string } }
        inheritedMust: { type: array, items: { type: string } }
        inheritedMay: { type: array, items: { type: string } }
        superiorChain:
          type: array
          items: { type: string }
          description: Transitive superiors, nearest first.
        subclasses: { type: array, items: { type: string } }
        raw:
          type: string
          description: The definition exactly as the server published it.
        edit:
          $ref: "#/components/schemas/ObjectClassInput"

    AttributeTypeDetail:
      type: object
      required: [summary]
      properties:
        summary: { $ref: "#/components/schemas/AttributeTypeSummary" }
        kind: { $ref: "#/components/schemas/AttributeKind" }
        superiorChain: { type: array, items: { type: string } }
        requiredBy:
          type: array
          items: { type: string }
          description: Object classes that name this attribute in MUST.
        optionalIn:
          type: array
          items: { type: string }
          description: Object classes that name this attribute in MAY.
        raw: { type: string }
        edit:
          $ref: "#/components/schemas/AttributeTypeInput"

    ChangeMod:
      type: object
      required: [op, name]
      properties:
        op:
          type: string
          enum: [add, delete, replace]
        name: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/AttributeValue" }
          description: |
            A delete with no values removes the whole attribute; a delete with
            values removes exactly those.

    ChangeAttribute:
      type: object
      required: [name, values]
      properties:
        name: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/AttributeValue" }

    ChangeRequest:
      type: object
      required: [dn, type]
      properties:
        dn: { type: string }
        type:
          type: string
          enum: [add, modify, delete, modrdn, setpassword]
        newPassword:
          type: string
          format: password
          writeOnly: true
          description: |
            The new password, for `setpassword`. Write-only: it is never echoed
            by the preview, never rendered into the LDIF or the Ansible task,
            and never logged. A `setpassword` change is an RFC 3062 extended
            operation rather than a modification, so it has no LDIF form; the
            preview says so and shows the equivalent `ldappasswd` invocation.
        mods:
          type: array
          items: { $ref: "#/components/schemas/ChangeMod" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ChangeAttribute" }
        newRdn: { type: string }
        deleteOldRdn: { type: boolean }
        newSuperior: { type: string }
        baseline:
          type: string
          description: |
            The `baseline` this change was planned against, from
            `POST /plan`. Optional: a change without one is applied exactly as
            it was before this field existed.

            When present, the server re-reads the entry before applying and
            refuses with `409` if what the plan depended on has changed since.
            It is checked against a fingerprint the server recomputes; the value
            a client sends is never trusted as a description of anything.
        expect:
          $ref: "#/components/schemas/ChangeExpectation"
          description: |
            State the entry must be in for this change to be planned or
            applied. Added in 1.9 for compensating changes from a recovery
            bundle, which are correct only while the entry is still as the
            original change left it.

            A plan whose entry does not hold it classifies the change as a
            `conflict` with `expected_state_differs`. The attributes it names
            are bound into the plan's `baseline`, and the expectation is
            checked again at apply, so a change after planning is refused as
            `plan_stale`. A change carrying `expect` without a `baseline` is
            refused at apply: an expectation is a plan-time contract.

    ChangeExpectation:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ChangeAttribute" }
          description: |
            Each attribute must hold exactly these values, compared by its
            equality rule where Alder models it and byte for byte otherwise.
            No values means the attribute must be absent. Sensitive attributes
            are refused.
        exhaustive:
          type: boolean
          description: |
            Absent means false. The entry must hold no other user attribute. `objectClass`,
            operational and identity attributes, and sensitive attributes are
            not counted.

    PlanRequest:
      type: object
      description: |
        Exactly one of `changes` and `ldif`. `changes` was required in 1.4; it
        is now one of two inputs, which loosens the request and breaks no client
        that sends it.
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/ChangeRequest" }
          description: |
            The changes to plan, in the order they would be applied. Bounded
            like a changeset, and for the same reason: the whole set is read
            and classified in one request.
        reconcile:
          type: boolean
          default: false
          description: |
            Turn an `add` of an entry that already exists into the modification
            that makes the attributes it names match, leaving every attribute
            it does not name alone. This is what closes the export, edit,
            import loop. Without it such a change is a conflict, because a
            directory refuses an add for an entry that exists.

            Applies to `changes` only. For LDIF the same choice is `mode`, made
            per document from its records rather than by a switch that
            reinterprets them.
        ldif:
          type: string
          description: |
            An LDIF document to plan, bounded like an import. Parsed with the
            same reader as `/import/ldif`; `attr:< url` references and LDAP
            controls are refused, as they are there.
        mode:
          $ref: "#/components/schemas/PlanLdifMode"

    PlanLdifMode:
      type: string
      default: changes
      description: |
        How an LDIF document is read. `changes`: every record is the exact
        operation it states, and a content record is an add. `desired`: the
        document is the state entries should be in; only content records are
        accepted, each is reconciled, and absence never means deletion.
      enum: [changes, desired]
      x-enum-varnames: [PlanLdifModeChanges, PlanLdifModeDesired]

    PlanIntent:
      type: string
      description: |
        How a proposal was read. `exact` is planned as written and never
        rewritten. `desired` is reconciled against the entry that is there.
      enum: [exact, desired]
      x-enum-varnames: [PlanIntentExact, PlanIntentDesired]

    PlanProblemCode:
      type: string
      description: |
        Why a change would not apply. Stable identifiers.

        State conflicts (`action: conflict`), which may resolve when the
        directory changes: `entry_missing`, `entry_exists`, `has_children`,
        `rename_target_exists`, and `expected_state_differs` (1.9): the entry
        no longer holds the state a change's `expect` requires -- for a change
        from a recovery bundle, the directory has drifted since the original
        apply. `dependency_required` and `referenced_by_schema` (1.10): a schema
        change names a definition the schema would not define when it runs, or
        removes one the schema still names, reading the set in order.

        Schema violations (`action: invalid`), which will not resolve by
        waiting: `object_class_undefined`, `attribute_undefined`,
        `attribute_not_permitted`, `single_value_violation`,
        `missing_required_attribute`. Only rules the schema states outright are
        checked; anything that depends on server behaviour is left for the
        directory to refuse.
      enum:
        - entry_missing
        - entry_exists
        - has_children
        - rename_target_exists
        - expected_state_differs
        - dependency_required
        - referenced_by_schema
        - object_class_undefined
        - attribute_undefined
        - attribute_not_permitted
        - single_value_violation
        - missing_required_attribute
      x-enum-varnames:
        - PlanProblemEntryMissing
        - PlanProblemEntryExists
        - PlanProblemHasChildren
        - PlanProblemRenameTargetExists
        - PlanProblemExpectedStateDiffers
        - PlanProblemDependencyRequired
        - PlanProblemReferencedBySchema
        - PlanProblemObjectClassUndefined
        - PlanProblemAttributeUndefined
        - PlanProblemAttributeNotPermitted
        - PlanProblemSingleValueViolation
        - PlanProblemMissingRequiredAttribute

    PlanProblem:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/PlanProblemCode" }
        attribute:
          type: string
          description: The attribute or object class concerned, where there is one.

    PlanTargetKind:
      type: string
      description: |
        Which area of the server a change lands in. `schema`: the server's
        schema entry, where a write changes what every entry may hold.
        `config`: the server's own configuration tree. `data`: everything else.
        Decided from the locations the server announces, not from a DN pattern.
      enum: [data, schema, config]
      x-enum-varnames: [PlanTargetData, PlanTargetSchema, PlanTargetConfig]

    PlanMembershipChange:
      type: object
      required: [attribute, gained, removed]
      description: |
        One membership attribute's net effect on the entry a change touches:
        the change's modifications replayed in order over the values the entry
        holds, so an add and a delete of the same member is no change. Member
        DNs are compared as DNs.
      properties:
        attribute: { type: string }
        gained:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }

    PlanReferenceImpact:
      type: object
      required: [count, dangling, byAttribute]
      description: Entries naming a DN this change deletes or renames away.
      properties:
        count:
          type: integer
          description: How many references were found.
        dangling:
          type: integer
          description: |
            How many of them the plan leaves pointing at nothing: not removed
            by another change in the same plan, and not held by an entry the
            plan also deletes.
        byAttribute:
          type: array
          items: { $ref: "#/components/schemas/PlanReferenceCount" }
        referrers:
          type: array
          items: { type: string }
          description: The referring entries, at most fifty.

    PlanSubtree:
      type: object
      required: [root, entries]
      description: |
        Planned deletions that together remove a branch. Reported only for more
        than one entry, so a subtree deletion never reads as a one-entry change.
      properties:
        root: { type: string }
        entries: { type: integer }

    PlanReferenceCount:
      type: object
      required: [attribute, count]
      properties:
        attribute: { type: string }
        count: { type: integer }

    PlanImpactKinds:
      type: object
      required: [data, schema, config]
      description: How many applicable changes land in each target area.
      properties:
        data: { type: integer }
        schema: { type: integer }
        config: { type: integer }

    PlanImpactMembership:
      type: object
      required: [gained, removed, groups]
      properties:
        gained: { type: integer }
        removed: { type: integer }
        groups:
          type: integer
          description: How many distinct entries have membership changes.

    PlanImpactReferences:
      type: object
      required: [analysed, found, dangling, truncated]
      properties:
        analysed:
          type: boolean
          description: |
            Whether references were searched for. False when the plan deletes
            or renames nothing, or when it affects more DNs than a single
            request will search for; `reason` then says which, and no count is
            offered in place of one.
        reason: { type: string }
        found: { type: integer }
        dangling: { type: integer }
        truncated:
          type: boolean
          description: |
            The reference search reached its bound, so there may be more
            references than counted. Independently of this, the search runs as
            the session's own bind: an entry the access rules hide is absent
            from the answer exactly as one that does not exist is.

    PlanImpact:
      type: object
      required: [kinds, membership, references]
      properties:
        kinds: { $ref: "#/components/schemas/PlanImpactKinds" }
        membership: { $ref: "#/components/schemas/PlanImpactMembership" }
        references: { $ref: "#/components/schemas/PlanImpactReferences" }

    PlanAction:
      type: string
      description: |
        What a change would do. A stable identifier: switch on this rather than
        reading `reason`.

        `unchanged`, `conflict` and `invalid` apply nothing. `conflict` is a
        change the directory would refuse as things stand; `invalid` is one the
        schema forbids whatever the state. `invalid` was added in 1.5, and a
        client that does not recognise it should treat it as it treats
        `conflict`. `set_password` is separate from `modify` because it is an
        extended operation with no LDIF form, and because a directory cannot be
        asked whether a password is already the one being set, so it is never
        reported as unchanged.
      enum:
        - add
        - modify
        - delete
        - rename
        - set_password
        - unchanged
        - conflict
        - invalid

    PlanCounts:
      type: object
      required: [examined, add, modify, delete, rename, setPassword, unchanged, conflict]
      properties:
        examined: { type: integer }
        add: { type: integer }
        modify: { type: integer }
        delete: { type: integer }
        rename: { type: integer }
        setPassword: { type: integer }
        unchanged: { type: integer }
        conflict: { type: integer }
        invalid:
          type: integer
          description: Added in 1.5.

    PlanItem:
      type: object
      required: [index, dn, action, exists]
      properties:
        index:
          type: integer
          description: The change's position in the set that was sent, so a client can line the plan up against its own list.
        dn: { type: string }
        action: { $ref: "#/components/schemas/PlanAction" }
        exists:
          type: boolean
          description: Whether the entry was there when the plan was made.
        intent: { $ref: "#/components/schemas/PlanIntent" }
        kind: { $ref: "#/components/schemas/PlanTargetKind" }
        problem:
          $ref: "#/components/schemas/PlanProblem"
          description: Set for `conflict` and `invalid`.
        membership:
          type: array
          items: { $ref: "#/components/schemas/PlanMembershipChange" }
        references:
          $ref: "#/components/schemas/PlanReferenceImpact"
          description: Set for a deletion or a rename when references were analysed.
        reason:
          type: string
          description: |
            Why this is unchanged, why it conflicts, or what the planner
            rewrote. Prose, for a person to read. Not stable across releases.
        record:
          $ref: "#/components/schemas/ChangeRequest"
          description: |
            Exactly what would be applied, which for a reconciled change is not
            what was sent. Absent for `unchanged` and `conflict`, which apply
            nothing.
        preview:
          $ref: "#/components/schemas/ChangePreview"
          description: The same exact LDIF and Ansible a confirmation dialog shows, for the record above.
        baseline:
          type: string
          description: |
            An opaque token binding the operation in `record` and the state it
            was planned against. Send it back on the matching change when
            applying. Absent for items that apply nothing.
        skippedAttributes:
          type: array
          items: { type: string }
          description: |
            Attributes left out of a reconciled record because the directory
            owns them and would refuse to be told otherwise. Reported rather
            than dropped silently: a document carrying `entryUUID` was exported
            with operational attributes, and the reader should know they are not
            being enforced.
        recovery:
          $ref: "#/components/schemas/RecoveryAssessment"
          description: |
            How far this change could be compensated if it is applied with a
            recovery bundle requested. Set for items that apply something.
            Added in 1.9.

    Plan:
      type: object
      required: [counts, items]
      properties:
        counts: { $ref: "#/components/schemas/PlanCounts" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanItem" }
        warnings:
          type: array
          items: { type: string }
          description: |
            Findings about the set as a whole rather than any one change:
            an entry created before its parent, an entry acted on after it is
            deleted, the same entry changed twice. None of them block.
        impact: { $ref: "#/components/schemas/PlanImpact" }
        subtrees:
          type: array
          items: { $ref: "#/components/schemas/PlanSubtree" }

    ChangePreview:
      type: object
      required: [ldif, ansible, summary]
      properties:
        ldif:
          type: string
          description: |
            Unfolded, because the point of the preview is that a person reads
            it and a value broken at column 76 is harder to check.
        ldifFolded:
          type: string
          description: Folded at 76 columns, for download.
        ansible: { type: string }
        ansiblePlaybook: { type: string }
        summary: { type: string }
        affectedAttributes: { type: array, items: { type: string } }
        warnings:
          type: array
          items: { type: string }
          description: |
            Schema findings that do not block the change, such as setting an
            attribute no object class on the entry permits.

    ApplyResult:
      type: object
      required: [applied, dn]
      properties:
        applied: { type: boolean }
        dn:
          type: string
          description: The entry's DN after the change, which differs for a rename.
        storedDn:
          type: string
          description: |
            Where the entry actually came to rest, when that is not the DN the
            change was addressed to.

            A directory may store an added entry under a different name: where
            an entry's position among its siblings forms part of that name, the
            server assigns the position and rewrites the RDN. Reporting the
            requested DN in that case sends the caller to an entry that is not
            there.
        note:
          type: string
          description: |
            Present when the change was accepted but Alder could not confirm
            where the entry ended up.
        summary: { type: string }
        ldif: { type: string }
        recovery:
          allOf:
            - $ref: "#/components/schemas/RecoveryBundle"
          x-go-type: json.RawMessage
          description: The recovery bundle, when one was asked for. Added in 1.9.

    SchemaChangeRequest:
      type: object
      required: [targetDn, kind, op]
      properties:
        targetDn:
          type: string
          description: |
            The schema entry to change. It must be one the capabilities listed;
            any other DN is refused, because accepting one would turn this into
            a way to aim an arbitrary modification at an arbitrary entry.
        kind:
          type: string
          enum: [objectClass, attributeType]
        op:
          type: string
          enum: [add, replace, delete]
        oid:
          type: string
          description: Which definition to replace or remove. Ignored for an add.
        objectClass:
          $ref: "#/components/schemas/ObjectClassInput"
        attributeType:
          $ref: "#/components/schemas/AttributeTypeInput"
        definition:
          type: string
          description: |
            A complete RFC 4512 definition, for someone who would rather write
            one than fill in a form. Takes precedence over the structured input
            when both are given, and is parsed and checked either way.

    ObjectClassInput:
      type: object
      description: |
        An object class as it declares itself, in the shape a change posts back.
        Returned by the detail response so an edit starts from the definition
        rather than from the summary, which resolves inherited attributes.
      required: [oid, names]
      properties:
        oid: { type: string }
        names: { type: array, items: { type: string } }
        desc: { type: string }
        obsolete: { type: boolean }
        superNames: { type: array, items: { type: string } }
        kind:
          type: string
          enum: [STRUCTURAL, ABSTRACT, AUXILIARY]
          x-enum-varnames: [KindStructural, KindAbstract, KindAuxiliary]
        must: { type: array, items: { type: string } }
        may: { type: array, items: { type: string } }
        extensions:
          type: object
          additionalProperties: { type: array, items: { type: string } }

    AttributeTypeInput:
      type: object
      description: |
        An attribute type as it declares itself, in the shape a change posts
        back.

        The detail responses return one of these so an edit starts from what the
        definition actually says. The summary alongside it is for reading: it
        reports effective values, resolved through SUP, which is what somebody
        looking at an attribute wants to know and exactly what an editor must not
        write back — a value inherited from a superior would become one declared
        here.
      required: [oid, names]
      properties:
        oid: { type: string }
        names: { type: array, items: { type: string } }
        desc: { type: string }
        obsolete: { type: boolean }
        superName: { type: string }
        equality: { type: string }
        ordering: { type: string }
        substr: { type: string }
        syntax: { type: string }
        syntaxLen: { type: integer }
        singleValue: { type: boolean }
        collective: { type: boolean }
        noUserModification: { type: boolean }
        usage:
          type: string
          enum: [userApplications, directoryOperation, distributedOperation, dSAOperation]
          # Named explicitly. The generator only prefixes enum constants when
          # they collide, so leaving these bare means a later enum sharing a
          # value silently renames them.
          x-enum-varnames:
            [UsageUserApplications, UsageDirectoryOperation, UsageDistributedOperation, UsageDSAOperation]
        extensions:
          type: object
          additionalProperties: { type: array, items: { type: string } }

    SchemaChangeBuild:
      type: object
      required: [change]
      properties:
        change:
          $ref: "#/components/schemas/ChangeRequest"
        definition:
          type: string
          description: The RFC 4512 text this change installs. Absent for a delete.
        removes:
          type: string
          description: |
            The definition this change removes, exactly as the server stores it.
            Shown so a replace can be read as the substitution it is.

    ChangesetRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/ChangeRequest" }
          description: |
            The changes, in the order they should be applied. A cap exists
            because the whole set is rendered and applied in one request.
        recovery:
          type: boolean
          description: |
            Return a recovery bundle for the changes that were applied. Absent
            means false. Read
            by `POST /changeset/apply` only. Added in 1.9.

    ChangesetPreview:
      type: object
      required: [ldif, changes]
      properties:
        ldif:
          type: string
          description: |
            Every change as one RFC 2849 document, in order. A password change
            appears as the notice explaining it has no LDIF form, so the
            document describes the run rather than silently omitting a step.
        ansiblePlaybook:
          type: string
          description: One playbook containing every task, in the same order.
        changes:
          type: array
          items: { $ref: "#/components/schemas/ChangePreview" }
        warnings:
          type: array
          items: { type: string }
          description: |
            Findings about the set as a whole, such as an entry created before
            its parent, or the same DN changed twice.

    ChangesetOutcome:
      type: object
      required: [index, dn, applied]
      properties:
        index:
          type: integer
          description: Position in the submitted list.
        dn: { type: string }
        applied: { type: boolean }
        summary: { type: string }
        error:
          $ref: "#/components/schemas/Error"

    ChangesetResult:
      type: object
      required: [outcomes, appliedCount]
      properties:
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/ChangesetOutcome" }
          description: |
            One per submitted change, in order. Entries after a failure are
            reported as not applied rather than omitted, so the caller can see
            what remains.
        appliedCount: { type: integer }
        failedIndex:
          type: integer
          description: The index that failed, absent when every change succeeded.
        recovery:
          allOf:
            - $ref: "#/components/schemas/RecoveryBundle"
          x-go-type: json.RawMessage
          description: |
            The recovery bundle, when one was asked for and at least one change
            was applied. It covers the applied changes only. Added in 1.9.

    RecoveryRecoverability:
      type: string
      description: |
        How far a change can be compensated. `exact`: Alder can derive
        compensating changes that restore the ordinary directory state it
        captured before the change -- the user attributes the change touched,
        an entry's absence, or its former name -- subject to the plan's drift
        checks. It does not cover operational attributes such as
        `modifyTimestamp`, server-generated identifiers such as `entryUUID`,
        replication metadata, or attributes the bind could not read.
        `partial`: some of it; `reasons` say what is not. `unavailable`: none of
        it. Recovery is compensation through a reviewed plan, never a
        transaction or a guaranteed rollback.
      enum: [exact, partial, unavailable]
      x-enum-varnames: [RecoverabilityExact, RecoverabilityPartial, RecoverabilityUnavailable]

    RecoveryReasonCode:
      type: string
      description: Why a change is not exactly recoverable. Stable identifiers; see `docs/RECOVERY.md`.
      enum:
        - password_not_captured
        - sensitive_value_not_captured
        - server_owned_attribute
        - identity_regenerated
        - hidden_attributes_unknown
        - sensitive_values_not_restored
        - schema_or_config_not_supported
        - pre_state_unavailable
      x-enum-varnames:
        - RecoveryReasonPasswordNotCaptured
        - RecoveryReasonSensitiveValueNotCaptured
        - RecoveryReasonServerOwnedAttribute
        - RecoveryReasonIdentityRegenerated
        - RecoveryReasonHiddenAttributesUnknown
        - RecoveryReasonSensitiveValuesNotRestored
        - RecoveryReasonSchemaOrConfigNotSupported
        - RecoveryReasonPreStateUnavailable

    RecoveryReason:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/RecoveryReasonCode" }
        attribute: { type: string }

    RecoveryAssessment:
      type: object
      required: [recoverability]
      properties:
        recoverability: { $ref: "#/components/schemas/RecoveryRecoverability" }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/RecoveryReason" }

    RecoveryAttribute:
      type: object
      required: [name, values]
      properties:
        name: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/SnapshotValue" }

    RecoveryMod:
      type: object
      required: [op, name]
      properties:
        op:
          type: string
          enum: [add, delete, replace]
          x-enum-varnames: [RecoveryModOpAdd, RecoveryModOpDelete, RecoveryModOpReplace]
        name: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/SnapshotValue" }

    RecoveryExpect:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: array
          items: { $ref: "#/components/schemas/RecoveryAttribute" }
        exhaustive: { type: boolean }

    RecoveryChange:
      type: object
      required: [dn, type]
      description: One compensating change. Never a password change.
      properties:
        dn: { type: string }
        type:
          type: string
          enum: [add, modify, delete, modrdn]
          x-enum-varnames: [RecoveryChangeTypeAdd, RecoveryChangeTypeModify, RecoveryChangeTypeDelete, RecoveryChangeTypeModrdn]
        mods:
          type: array
          items: { $ref: "#/components/schemas/RecoveryMod" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/RecoveryAttribute" }
        newRdn: { type: string }
        deleteOldRdn: { type: boolean }
        newSuperior: { type: string }
        expect: { $ref: "#/components/schemas/RecoveryExpect" }

    RecoveryOriginal:
      type: object
      required: [type, dn]
      description: The change that was applied, by kind, entry and attribute names. Never its values.
      properties:
        type: { type: string }
        dn: { type: string }
        targetDn: { type: string }
        attributes:
          type: array
          items: { type: string }

    RecoveryStep:
      type: object
      required: [index, original, kind, recoverability, compensation]
      properties:
        index:
          type: integer
          description: The change's position in the set that was applied.
        original: { $ref: "#/components/schemas/RecoveryOriginal" }
        kind: { $ref: "#/components/schemas/PlanTargetKind" }
        recoverability: { $ref: "#/components/schemas/RecoveryRecoverability" }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/RecoveryReason" }
        compensation:
          type: array
          items: { $ref: "#/components/schemas/RecoveryChange" }
          description: Runs in this order, after the compensation of every later step.

    RecoveryOrigin:
      type: object
      required: [namingContexts]
      description: |
        What the directory announced about itself. Display, not proof of
        identity. No host, port, bind DN or credential is recorded.
      properties:
        vendor: { type: string }
        vendorVersion: { type: string }
        namingContexts:
          type: array
          items: { type: string }

    RecoveryBundle:
      type: object
      description: |
        An Alder recovery bundle, format version 1: a client-held description
        of the compensating changes Alder could derive from the state that
        existed immediately before an apply. Not a transaction, not a rollback,
        not a backup. It holds no credential, password, token or baseline. See
        `docs/RECOVERY.md`.
      required: [format, version, createdAt, origin, recoverability, steps]
      properties:
        format:
          type: string
          enum: [alder-recovery]
          x-enum-varnames: [RecoveryFormatAlderRecovery]
        version: { type: integer, description: "The recovery format version. This Alder reads 1." }
        createdAt: { type: string, format: date-time }
        origin: { $ref: "#/components/schemas/RecoveryOrigin" }
        recoverability: { $ref: "#/components/schemas/RecoveryRecoverability" }
        steps:
          type: array
          maxItems: 2000
          items: { $ref: "#/components/schemas/RecoveryStep" }
          description: In the order the changes were applied.
        checksum:
          type: string
          description: "`sha256:<hex>` over every field except `createdAt` and `checksum`. An integrity check against corruption, not authentication or a signature."

    RecoveryDriftState:
      type: string
      description: |
        A compensating change against the directory as it is now. `ready`: it
        would apply. `drifted`: the entry is not as the original change left it
        (`problem` says how), so it would not. `already_recovered`: it would do
        nothing. `blocked`: it is not valid against the schema.
      enum: [ready, drifted, already_recovered, blocked]
      x-enum-varnames: [RecoveryDriftReady, RecoveryDriftDrifted, RecoveryDriftAlreadyRecovered, RecoveryDriftBlocked]

    RecoveryDrift:
      type: object
      required: [index, dn, state]
      properties:
        index:
          type: integer
          description: Position in `changes`.
        dn: { type: string }
        state: { $ref: "#/components/schemas/RecoveryDriftState" }
        problem: { $ref: "#/components/schemas/PlanProblem" }

    RecoveryInspection:
      type: object
      required: [version, createdAt, origin, originMatches, recoverability, integrity, checksum, steps, changes, drift]
      properties:
        version: { type: integer }
        createdAt: { type: string }
        origin: { $ref: "#/components/schemas/RecoveryOrigin" }
        originMatches:
          type: boolean
          description: Whether the vendor and naming contexts match this session's directory. Not proof either way.
        originDifferences:
          type: array
          items: { type: string }
        recoverability: { $ref: "#/components/schemas/RecoveryRecoverability" }
        integrity: { $ref: "#/components/schemas/SnapshotIntegrity" }
        checksum: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RecoveryStep" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/ChangeRequest" }
          description: The compensating changes in execution order, each with its `expect`. Input for `POST /plan`.
        drift:
          type: array
          items: { $ref: "#/components/schemas/RecoveryDrift" }

    ImportRequest:
      type: object
      required: [ldif]
      properties:
        ldif: { type: string }
        reconcile:
          type: boolean
          default: false
          description: |
            Turn a content record whose entry already exists into a modify that
            brings that entry to what the record describes.

            Without it such a record is an add, and a directory refuses an add
            for an entry that exists — which is correct, and makes the second
            half of an export/edit/import loop fail on every record.

            It replaces the attributes the record names and leaves every other
            attribute exactly as it is. The document is not treated as the whole
            truth about the entry: an export omits `userPassword` always and
            operational attributes by default, and a file that does not mention
            an attribute is not a file asking for it to be removed.

    ImportResult:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/ChangePreview" }
        requests:
          type: array
          items: { $ref: "#/components/schemas/ChangeRequest" }
          description: The parsed changes, ready to post back to /changes/apply.
        reconciled:
          type: integer
          description: |
            How many records were turned into a modify because their entry
            already exists. Only set when `reconcile` was asked for.
        unchanged:
          type: array
          items: { type: string }
          description: |
            The DNs whose entry already matches the document, and which are
            therefore absent from `changes`. Reported rather than shown as
            no-op modifications: a change that does nothing still has to be
            read and confirmed, and there is nothing there to confirm.
        skippedAttributes:
          type: array
          items: { type: string }
          description: |
            Attributes left out of a reconciliation because the directory owns
            them — operational or `NO-USER-MODIFICATION`. Enforcing one fails
            the whole record, and dropping it silently would let the file mean
            something other than it says.

    SourceOffer:
      type: object
      required: [license, sourceUrl, version, notice]
      properties:
        license:
          type: string
          description: The SPDX identifier Alder is licensed under.
        sourceUrl:
          type: string
          description: |
            Where the Corresponding Source of *this* build lives. An operator
            running a fork sets `--source-url` to their own; leaving it at the
            default while running a modified build does not comply.
        version: { type: string }
        revision:
          type: string
          description: The commit this binary was built from, when the build recorded one.
        modified:
          type: boolean
          description: |
            True when the build came from a tree with uncommitted changes, so
            `revision` alone does not identify the source. Absent means false.
        notice:
          type: string
          description: The offer in prose, for a person rather than a client.
