openapi: 3.0.3

info:
  title: Alder
  version: "1.0.0"
  description: |
    The HTTP API of Alder, a directory engineering tool for OpenLDAP and 389
    Directory Server.

    This document is the source of truth. The Go server interface and the
    TypeScript client are both generated from it, so the two cannot drift.

    **`info.version` above is the version of this contract, not of the binary
    serving it.** They are both 1.x and are meant to stay that way: Alder 1.x
    serves contract 1.x, and the contract only changes within a major by adding
    -- a new endpoint, a new optional field, a new enum value a client may
    ignore. Anything a client could break on waits for the next major of both.
    `docs/COMPATIBILITY.md` says what that covers and what it does not. The
    running binary reports its own version in `GET /api/v1/source`, which is
    served outside this document because the AGPL section 13 offer it carries
    must not require a session.

    Two conventions run through the whole API.

    A **distinguished name is always a query or body parameter, never a path
    segment.** DNs contain commas, equals signs, escaped characters and
    non-ASCII text; putting one in a path means every client and every proxy in
    the chain has to agree about double-encoding, and they do not.

    An **attribute value is an octet string, not a string.** Every value is
    carried as an object that is either `{ "text": ... }` for a value that is
    valid UTF-8 and belongs to a textual syntax, or `{ "base64": ... }` for
    anything else. There is no path by which a JPEG becomes mangled text.

servers:
  - url: /api/v1

tags:
  - name: session
    description: Connecting to a directory. Credentials live in memory only.
  - name: browse
    description: Reading the tree and its entries.
  - name: schema
    description: Browsing the schema the server published.
  - name: changes
    description: Previewing and applying modifications.
  - name: transfer
    description: LDIF import and export, and Ansible generation.
  - name: licence
    description: |
      The AGPL section 13 offer. The only endpoint here that answers without a
      session, because the obligation runs to anyone who can reach the service.

paths:
  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: Describe the current session
      responses:
        "200":
          description: The session and what the server it is bound to can do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [session]
      operationId: createSession
      summary: Connect and bind to a directory
      description: |
        Opens a connection, binds, and reads the RootDSE. On success the
        response sets an httpOnly, Secure, SameSite=Strict cookie naming an
        in-memory session. The bind password is held in that in-memory session
        and is never written to disk, never placed in a token, and never
        returned by any endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectRequest" }
      responses:
        "201":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502":
          description: The directory refused the connection or the bind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      tags: [session]
      operationId: deleteSession
      summary: Disconnect
      description: Closes the connection and discards the credentials.
      responses:
        "204": { description: Disconnected. }

  /tree:
    get:
      tags: [browse]
      operationId: listChildren
      summary: List the children of an entry
      description: |
        With no `dn`, returns the naming contexts the server holds, which are
        the roots of the tree. With a `dn`, returns that entry's immediate
        children. This is the lazy-loading tree browser's only endpoint.
      parameters:
        - name: dn
          in: query
          schema: { type: string }
          description: The parent. Omit for the roots.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cookie
          in: query
          schema: { type: string }
          description: Continuation cookie from a previous page.
      responses:
        "200":
          description: One page of children.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /count:
    get:
      tags: [browse]
      operationId: countEntries
      summary: Count the entries under a base, up to a limit
      description: |
        A subtree count, bounded like every other search. It asks the server for
        no attributes at all, so the cost is the search rather than the values.

        `truncated` is the important half of the answer: it means the count
        reached the limit and the real number is higher. The UI reports "at
        least N" in that case rather than a number that is simply wrong, which
        is why this is an action somebody asks for rather than something a
        landing page does to every naming context on load.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 10000 }
      responses:
        "200":
          description: How many entries were counted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /compare:
    get:
      tags: [browse]
      operationId: compareEntries
      summary: What differs between two entries
      description: |
        Answers "why does this account work and that one not".

        A naive diff answers it badly in three ways, and avoiding those is most
        of what this endpoint is. It compares what is *present*, so an attribute
        one entry's classes require and it does not hold is invisible — and that
        absence is frequently the whole answer. It compares bytes, so two DNs
        naming the same entry in different case read as a difference the
        directory does not agree with. And its instinct is to show both sides of
        everything, which for `userPassword` is what rule 6 forbids.

        So each side is annotated from its *own* object classes, which the two
        entries need not share; DN-valued attributes are compared as DNs; and a
        sensitive attribute is compared on presence alone.
      parameters:
        - name: left
          in: query
          required: true
          schema: { type: string }
          description: Usually the entry that works.
        - name: right
          in: query
          required: true
          schema: { type: string }
        - name: includeOperational
          in: query
          schema: { type: boolean, default: true }
          description: |
            On by default, unlike the LDIF export. `nsAccountLock` and
            `pwdAccountLockedTime` are operational on the target servers and are
            frequently the entire answer.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Values reported per attribute.
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryComparison" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /entry:
    get:
      tags: [browse]
      operationId: getEntry
      summary: Read one entry
      description: |
        Returns the entry with every attribute annotated from the schema: its
        syntax, whether it is single-valued, whether the server owns it, and
        which input control the editor should offer. Also returns the MUST and
        MAY sets computed from the entry's object classes.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: includeOperational
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    post:
      tags: [browse]
      operationId: search
      summary: Search the directory
      description: |
        Every search is paged and bounded. `filter` is a raw RFC 4515 string
        which is parsed, not interpolated: a value containing filter
        metacharacters cannot escape into the filter structure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: One page of results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /views:
    get:
      tags: [browse]
      operationId: listObjectViews
      summary: The object-aware views this directory supports
      description: |
        Users, groups and organizational units, expressed as saved searches
        derived from the schema the connected server published.

        A view is offered only where the server defines a class to anchor it
        on, so a directory holding no person class has no Users view rather
        than an empty one. The anchors are standards-track classes — RFC 4519,
        RFC 4524, RFC 2307 — never vendor names, and a site class inheriting
        from one of them is matched without being named, because an entry
        carries its superclasses in its own `objectClass` attribute.

        The filter is built here and goes back to `/search` unmodified. The
        columns are the attributes the anchor classes actually permit, so a
        directory without `inetOrgPerson` gets no mail column instead of an
        empty one.
      responses:
        "200":
          description: The views this connection supports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectViewList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /inventory:
    post:
      tags: [browse]
      operationId: inventoryValues
      summary: What values one attribute holds, and how many entries carry each
      description: |
        The question that finds a team name spelled "platfrm" with four people
        on it, a cost centre nobody has used since a reorganisation, or the
        accounts still pointing at a decommissioned site.

        It is a tally over a **bounded** search, so it never claims to describe
        the directory — only the entries it examined. Every number is scoped
        that way and `truncated` says the bound was reached. A tally that
        quietly summarises a truncated result set is not a weaker answer than
        the truth; it is a confident wrong one.

        Sensitive attributes are refused before the search runs rather than
        filtered out of the result, which is the difference between never
        reading a password and reading every password and choosing not to say.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryRequest" }
      responses:
        "200":
          description: The tally.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /members:
    get:
      tags: [browse]
      operationId: expandMembers
      summary: Who is in this group, following nested groups
      description: |
        The entry view lists a group's `member` values, which is the whole
        answer for a flat group and no answer at all for a nested one:
        `cn=everyone` in the test harness lists five members and contains no
        people, because all five are themselves groups.

        This walks that structure and says, for each person reached, which
        chain of groups brought them in.

        What it finds on the way is reported rather than dropped: a group that
        contains itself, a member DN whose entry cannot be read — the dangling
        reference the referenced-by panel exists to prevent, seen from the
        other side — and membership values that are not DNs at all, since
        `memberUid` holds a login name and `memberURL` a search.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
          description: The group to expand.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /references:
    get:
      tags: [browse]
      operationId: listReferences
      summary: The entries that name this one, and the attribute each names it by
      description: |
        Answers "which groups is this in, and what else points at it" — and,
        unlike the filter on the entry itself, says *how* each one points.

        That is the part a link cannot give you. A search returns the entries
        matching the filter but not which term matched, and removing a
        reference means modifying a named attribute on the referencing entry:
        without knowing whether a group holds this DN in `member` or in `owner`,
        there is nothing safe to offer.

        It is one bounded search. The reference attributes are requested and
        matched here rather than in the browser, so a group's five hundred
        members are compared where they already are instead of being sent
        across to be compared and discarded.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
          description: The entry being referred to.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: What names this entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /resolve:
    get:
      tags: [browse]
      operationId: resolve
      summary: What could this input be — an entry, or a search
      description: |
        Backs one box that takes a DN, an RFC 4515 filter, or a name.

        It parses and never searches. `internal/dn` and `internal/filter` are
        the authorities on what these strings are, and a regex in the browser
        would drift from them the first time either grew a case — but probing
        the directory to see whether an entry exists would turn every keystroke
        into a read, to answer a question the operator is about to answer by
        pressing enter.

        The three kinds overlap. `cn=platform` is a valid one-component DN
        *and* almost certainly a request to find something called platform, so
        an ambiguous input returns both destinations and the operator picks.
        Guessing would be wrong about half the time.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Where this input could go.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schema:
    get:
      tags: [schema]
      operationId: getSchema
      summary: The whole schema, indexed for browsing
      responses:
        "200":
          description: The schema.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schema/objectclasses/{name}:
    get:
      tags: [schema]
      operationId: getObjectClass
      summary: One object class, with its cross-links resolved
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: A name or an OID.
      responses:
        "200":
          description: The object class.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectClassDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schema/attributetypes/{name}:
    get:
      tags: [schema]
      operationId: getAttributeType
      summary: One attribute type, with its cross-links resolved
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The attribute type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttributeTypeDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /schema/requirements:
    get:
      tags: [schema]
      operationId: getRequirements
      summary: What an entry of these object classes must and may hold
      description: |
        The MUST and MAY sets for a set of object classes, with the schema's
        opinion about each attribute — syntax, single-valuedness, description,
        which control to offer.

        It exists so a creation form is generated from the schema rather than
        from a template. Without it the form has attribute names and nothing
        else, which is how creating an entry ended up with a plain text box for
        every field while editing the same entry a moment later offered a
        Boolean control, an entry picker and the attribute's description.
      parameters:
        - name: class
          in: query
          required: true
          explode: true
          schema:
            type: array
            items: { type: string }
          description: |
            The object classes, repeated. Superiors are followed, so naming the
            most specific one is enough.
      responses:
        "200":
          description: What such an entry would require and permit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementsView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schema/change:
    post:
      operationId: buildSchemaChange
      summary: Build the modification that installs, replaces or removes a definition
      description: |
        Renders a definition and returns the change that would apply it, without
        applying anything.

        A schema definition is a value of an attribute on an ordinary entry, so
        the change this returns is an ordinary modify, and it goes on to the
        same preview, the same confirmation and the same changeset as every
        other write. There is still exactly one path that writes.

        The definition text is built here rather than in the browser, for the
        same reason the LDIF preview is: what the person confirms and what the
        directory receives have to be the same bytes.

        A replace or a delete needs the value the server actually stores, which
        is not always the value the schema browser displays — a server keeping
        its schema in configuration prefixes each stored definition with its
        load order and strips that prefix from what it publishes. This reads the
        target to find it, which is why the request names an OID rather than
        carrying a definition to remove.
      tags: [schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchemaChangeRequest" }
      responses:
        "200":
          description: The change that would perform this, and the definition it carries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchemaChangeBuild" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /changes/preview:
    post:
      tags: [changes]
      operationId: previewChange
      summary: Render a change as LDIF and as an Ansible task
      description: |
        Renders without applying. This is what the confirmation modal shows,
        and the same ChangeRecord that produced it is what `/changes/apply`
        sends to the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRequest" }
      responses:
        "200":
          description: The rendered change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /changes/apply:
    post:
      tags: [changes]
      operationId: applyChange
      summary: Apply a change
      description: |
        The only endpoint that modifies the directory. It takes the same
        ChangeRequest that `/changes/preview` rendered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRequest" }
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The server rejected the change on schema or policy grounds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /changeset/preview:
    post:
      tags: [changes]
      operationId: previewChangeset
      summary: Render several changes as one LDIF document and one playbook
      description: |
        A changeset is an ordered list of changes reviewed and applied together.
        It is held by the client, not the server: Alder keeps no per-session
        state beyond the connection itself, so this endpoint is a pure
        rendering of whatever it is given.

        The order is the caller's and is preserved exactly. Alder does not sort
        the changes to make them work -- an entry created before its parent is
        reported as a warning so it can be reordered, because guessing the
        intended order silently is worse than saying what is wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesetRequest" }
      responses:
        "200":
          description: The rendered changeset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesetPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /changeset/apply:
    post:
      tags: [changes]
      operationId: applyChangeset
      summary: Apply several changes in order
      description: |
        Applies each change in the order given and stops at the first failure.

        A directory has no transaction spanning entries, so a changeset is not
        atomic and does not pretend to be. The response says exactly which
        changes were applied and which was not, so the caller can fix the one
        that failed and resume from there rather than starting again and
        re-applying what already succeeded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangesetRequest" }
      responses:
        "200":
          description: |
            The run finished. This is returned whether or not every change
            succeeded: a partial run is an outcome to report, not an error to
            raise, and the body says where it stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesetResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /export/ldif:
    get:
      tags: [transfer]
      operationId: exportLdif
      summary: Export an entry or a subtree as LDIF
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema:
            type: string
            enum: [base, one, sub]
            default: base
        - name: includeOperational
          in: query
          schema: { type: boolean, default: false }
          description: Operational attributes cannot be written back, so they are off by default.
        - name: includeSensitive
          in: query
          schema: { type: boolean, default: false }
          description: |
            Password hashes and similar are omitted unless this is set. An LDIF
            export ends up in tickets and repositories.
        - name: filter
          in: query
          schema: { type: string }
          description: |
            An RFC 4515 filter, defaulting to `(objectClass=*)`. It is parsed
            here, never pasted, exactly as the search filter is.

            It exists so a table can export what it is showing. Without it the
            only exports available are one entry, or a whole subtree, and
            "the thirty people I just searched for" — which is what somebody
            actually wants to put in a ticket or a repository — could only be
            assembled by hand.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 250000, default: 1000 }
          description: |
            The document is streamed and rendered a page at a time, so this
            bounds how long the export runs rather than how much it holds.
      responses:
        "200":
          description: The LDIF document.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export/ansible:
    get:
      tags: [transfer]
      operationId: exportAnsible
      summary: Export an entry or a subtree as a playbook that enforces it
      description: |
        A playbook that makes a directory match what is here, rather than one
        that merely reports on it.

        This is a separate path from `/export/ldif` on purpose. The obvious
        alternative was `format=ansible` on that operation, which would leave
        the URL saying "ldif" while returning YAML — and the two differ in more
        than serialisation. An LDIF export is a transcription of entries; this
        is an assertion about what they should be, and it is ordered parent
        first because `ldap_entry` cannot create a child under a parent that
        does not exist yet.

        Each entry becomes two tasks: `community.general.ldap_entry` to create
        it if it is missing, and `community.general.ldap_attrs` with
        `state: exact` to bring the listed attributes to exactly these values.
        `ldap_entry` with `state: present` alone would report success against
        an entry that exists with entirely different attributes, which is the
        failure this endpoint exists to avoid.

        Attributes the directory owns — operational, `NO-USER-MODIFICATION` —
        are omitted, because enforcing them would produce a task that fails on
        every run against a server doing its job. Sensitive attributes are
        omitted with no option to include them: a playbook is a file destined
        for a repository.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema:
            type: string
            enum: [base, one, sub]
            default: base
        - name: filter
          in: query
          schema: { type: string }
          description: |
            An RFC 4515 filter, defaulting to `(objectClass=*)`, parsed here
            and never pasted — so a table can export what it is showing.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        "200":
          description: The playbook.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export/outline:
    get:
      tags: [transfer]
      operationId: exportOutline
      summary: The shape of a subtree, as a tree
      description: |
        The same entries an LDIF export would give, drawn as the hierarchy they
        form rather than listed one after another.

        Asked for by an operator testing Alder: an LDIF export is flat, and a
        flat list of three hundred records does not tell you the shape of what
        you exported.

        **This is not LDIF and cannot be applied.** It could not be: RFC 2849
        gives a leading space its own meaning -- it continues the line above --
        so a tree drawn with indentation would stop being a document you can
        import. Rather than a format that is almost LDIF and quietly broken,
        this is plainly something else, and says so on its first line.

        Bounded rather than streamed, unlike the LDIF export: a tree cannot be
        drawn until its last entry has arrived, because the entry that decides
        whether a node is a leaf may be the final one to come back.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [base, one, sub], default: sub }
        - name: filter
          in: query
          schema: { type: string }
          description: An RFC 4515 filter, parsed and never pasted.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        "200":
          description: The outline.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /export/yaml:
    get:
      tags: [transfer]
      operationId: exportYaml
      summary: The subtree as nested YAML
      description: |
        The entries and what they hold, nested as the tree they form, in a
        format an editor folds and colours. Asked for so that a subtree can be
        opened in an editor and read: LDIF is flat and YAML is not.

        Every attribute is a list, even where the schema says one value. An LDAP
        attribute holds a set, and a document whose shape changed with the data
        would make a second value look like a type change in the diff.

        A value that is not valid printable UTF-8 is written with YAML's own
        `!!binary` tag rather than passed off as a string.

        **Nothing reads this back.** Alder imports LDIF, which is the format with
        a specification and a changetype; this is for looking at. It is bounded
        rather than streamed for the same reason the outline is: a tree cannot be
        nested until its last entry has arrived.
      parameters:
        - name: dn
          in: query
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [base, one, sub], default: sub }
        - name: filter
          in: query
          schema: { type: string }
          description: An RFC 4515 filter, parsed and never pasted.
        - name: includeOperational
          in: query
          schema: { type: boolean, default: false }
        - name: includeSensitive
          in: query
          schema: { type: boolean, default: false }
          description: |
            Off by default, as for LDIF. A file destined for an editor is a file
            destined for a repository soon after.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        "200":
          description: The YAML document.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /import/ldif:
    post:
      tags: [transfer]
      operationId: parseLdif
      summary: Parse an LDIF document into change records
      description: |
        Parses and validates without applying anything. The response is the
        list of changes the document describes, each rendered back as LDIF, for
        the user to review and confirm one at a time or all at once.

        URL-valued attributes (`attr:< url`) are refused: following one from a
        process holding a privileged bind would be file disclosure and request
        forgery. So are LDAP controls, which would change what the server does
        with a record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: The parsed changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /source:
    get:
      tags: [licence]
      operationId: getSourceOffer
      summary: Where to get the source of this running instance
      description: |
        AGPL-3.0 section 13: someone using a modified Alder over a network is
        entitled to its Corresponding Source. The offer is served rather than
        written in a README because the obligation runs to the person using the
        running instance, and the user of a modified instance has no reason to
        know where its source went.

        **This is the one endpoint that answers without a session,** and it has
        no 401 for that reason: an offer only the already-connected can read
        would not discharge the obligation. It is described here so that the
        contract in this document is the whole contract -- it was served outside
        it until 1.0, which made `openapi.yaml` quietly incomplete about the one
        endpoint a licence requires.
      responses:
        "200":
          description: The offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceOffer" }

components:
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: There is no session, or it has expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The directory refused the operation for this bind.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such entry or definition.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: A stable machine-readable code.
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - constraint_violation
            - upstream
            - internal
        message:
          type: string
          description: A human-readable explanation. Never contains a credential.
        detail:
          type: string
          description: Extra context, such as the LDIF line a parse failed on.
        ldapCode:
          type: integer
          description: The LDAP result code, where the failure came from the directory.
        hint:
          type: string
          description: |
            What that result code usually means for the operation that was
            attempted, and what to do about it.

            Written by Alder from the standard result code and the change being
            made. It never repeats the server's own diagnostic text, which is
            withheld on purpose: some servers name entries the caller may not be
            allowed to know exist, and some echo part of the request back. A
            result code alone is rarely enough to act on, which is what this is
            for.

    ConnectRequest:
      type: object
      required: [host, port, tls]
      properties:
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls:
          type: string
          enum: [ldaps, starttls, plaintext]
          description: |
            `plaintext` is refused unless the server was started with
            `--i-know-this-is-insecure`.
        insecureSkipVerify:
          type: boolean
          default: false
          description: |
            Skip certificate verification for this connection. Per-connection
            and never a default; a session using it is marked unverified.
        caCertificate:
          type: string
          description: A PEM bundle to verify against instead of the system roots.
        serverName:
          type: string
          description: Override the name checked against the certificate.
        bindDn:
          type: string
          description: Omit for an anonymous bind.
        configBindDn:
          type: string
          description: |
            An optional second identity, used only for the server's own
            configuration tree.

            A directory keeps its configuration beside its data, and the account
            that administers a suffix normally has no rights there; they are
            separate administrative domains on purpose. Without this, reaching
            the configuration means connecting as the configuration
            administrator and losing access to the data — which on a server that
            stores its schema in its configuration makes schema editing and
            entry browsing mutually exclusive. Operations are routed by DN, so
            one session does both.
        configBindPassword:
          type: string
          format: password
          writeOnly: true
          description: |
            Held in the server's memory for the life of the session, exactly
            like the bind password. Never written to disk, never returned.
        bindPassword:
          type: string
          format: password
          description: Held in memory for the life of the session and nowhere else.

    Capabilities:
      type: object
      required: [namingContexts, subschemaSubentry, paging]
      properties:
        namingContexts: { type: array, items: { type: string } }
        subschemaSubentry: { type: string }
        supportedControls: { type: array, items: { type: string } }
        supportedExtensions: { type: array, items: { type: string } }
        supportedSaslMechanisms: { type: array, items: { type: string } }
        paging: { type: boolean }
        serverSort: { type: boolean }
        whoAmI: { type: boolean }
        passwordModify:
          type: boolean
          description: |
            RFC 3062 Password Modify. Where a server offers it, Alder sets
            passwords with it rather than writing a hash, so the server chooses
            the scheme and applies its own policy.
        configContext:
          type: string
          description: |
            The DN of the server's own configuration tree, when it publishes
            one. Its presence is how Alder knows the subschema subentry is a
            generated view rather than the schema itself.
        schemaWrite:
          $ref: "#/components/schemas/SchemaWrite"
        config:
          $ref: "#/components/schemas/ConfigAccess"
        monitor:
          $ref: "#/components/schemas/MonitorAccess"

    MonitorAccess:
      type: object
      description: |
        A server's monitoring entry, where it publishes one this session can
        read. Found by reading the conventional location and believing only what
        the server answers, exactly as the configuration tree is.

        Absent is an ordinary answer. One of the two servers Alder targets
        publishes such an entry and the other does not, and a directory with
        none gets no monitoring section rather than an empty one.
      required: [readable]
      properties:
        dn: { type: string }
        readable: { type: boolean }

    ConfigAccess:
      type: object
      description: |
        This session's reach into the server's own configuration tree. The DN
        is preferred from what the server announces and otherwise found by
        trying the conventional location and believing only what the server
        answers.
      required: [readable, separateBind]
      properties:
        dn:
          type: string
          description: The configuration tree's root. Absent where there is none.
        readable:
          type: boolean
          description: |
            Whether this session can actually read it. A server may announce a
            tree the bound identity has no rights in.
        separateBind:
          type: boolean
          description: Whether a second identity is being used for it.
        boundAs:
          type: string
          description: The identity the configuration tree is read as.
        reason:
          type: string
          description: Why it is unreachable, in a sentence meant to be read.

    SchemaWrite:
      type: object
      description: |
        Where, and whether, this session can write schema definitions. Style is
        derived from what the server announced, never from its name: a server
        that publishes a configContext keeps its schema in configuration
        entries, and one that does not lets its subschema subentry be modified.
      required: [style]
      properties:
        style:
          type: string
          enum: [none, subschema, config]
          # Named explicitly: the generated constant for "config" would
          # otherwise be Config, which the server package already uses.
          x-enum-varnames: [SchemaStyleNone, SchemaStyleSubschema, SchemaStyleConfig]
        targets:
          type: array
          items: { $ref: "#/components/schemas/SchemaTarget" }
          description: |
            The entries a definition may be written to. Exactly one under the
            subschema style. Under the config style a server holds several, and
            which one a new definition joins is a choice with consequences,
            because they load in order.
        objectClassAttr: { type: string }
        attributeTypeAttr: { type: string }
        unavailable:
          type: string
          description: |
            Why there is nowhere to write, in a sentence meant to be read.
            Present only when style is none.

    SchemaTarget:
      type: object
      required: [dn, name, objectClasses, attributeTypes]
      properties:
        dn: { type: string }
        name: { type: string }
        objectClasses: { type: integer }
        attributeTypes: { type: integer }

    SessionInfo:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        host: { type: string }
        port: { type: integer }
        tls: { type: string }
        verified:
          type: boolean
          description: False when the session skipped certificate verification.
        bindDn:
          type: string
          description: Empty for an anonymous bind.
        vendorName:
          type: string
          description: Display only. Nothing branches on it.
        vendorVersion: { type: string }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        readOnly:
          type: boolean
          description: True when the server was started with --read-only.

    AttributeValue:
      type: object
      description: |
        Exactly one of `text` or `base64` is present. `text` carries a value
        that is valid UTF-8 and belongs to a textual syntax; everything else,
        including anything with a `;binary` option, arrives as `base64`.
      properties:
        text: { type: string }
        base64: { type: string }
        size:
          type: integer
          description: The value's length in bytes.

    AttributeKind:
      type: object
      description: The schema's opinion about one attribute, for the editor.
      required: [name, kind, known]
      properties:
        name: { type: string }
        oid: { type: string }
        desc: { type: string }
        kind:
          type: string
          enum: [string, text, integer, boolean, dn, time, binary, password, certificate, image, oid]
        syntax: { type: string }
        syntaxLabel: { type: string }
        maxLength: { type: integer }
        singleValue: { type: boolean }
        readOnly:
          type: boolean
          description: NO-USER-MODIFICATION; the server owns this value.
        operational: { type: boolean }
        sensitive:
          type: boolean
          description: A secret. Values are withheld and never logged.
        obsolete: { type: boolean }
        known:
          type: boolean
          description: False when the schema does not define this attribute.

    EntryAttribute:
      type: object
      required: [name, kind, values]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/AttributeKind" }
        values:
          type: array
          items: { $ref: "#/components/schemas/AttributeValue" }
        required:
          type: boolean
          description: In the MUST set of this entry's object classes.
        withheld:
          type: boolean
          description: |
            The values were withheld because the attribute is sensitive. The
            count is still reported so the UI can say the attribute is set.
        valueCount: { type: integer }
        valueSchemes:
          type: array
          items: { type: string }
          description: |
            For a withheld attribute, the storage scheme of each value — the
            `{SSHA}` or `{PBKDF2-SHA512}` prefix RFC 2307 puts in front of a
            hash — where the value carries one.

            Only the label crosses the wire. The hash itself is never sent, and
            a value that does not begin with `{` reports nothing rather than
            having its first characters guessed at.

            It is worth reporting because the scheme is the one thing about a
            stored password an administrator needs to see: it is what says
            whether the directory is still handing out crypt(3) hashes.

    Requirements:
      type: object
      properties:
        must: { type: array, items: { type: string } }
        may: { type: array, items: { type: string } }
        settableOperational:
          type: array
          items: { type: string }
          description: |
            Operational attributes this server says a client may set on an
            entry: `USAGE directoryOperation` and no `NO-USER-MODIFICATION`.

            Operational is not the same as read-only, and treating it as such
            is why an account could not be locked from here — 389 DS keeps
            `nsAccountLock` itself and still expects you to set it, as OpenLDAP
            does for a ppolicy `pwdAccountLockedTime`. Only
            `NO-USER-MODIFICATION` means the directory owns an attribute.

            These are not in any object class, so they never appear in `must`
            or `may` and an entry that has never been locked shows no sign that
            it could be. They are listed separately rather than merged in,
            because "what this class permits" and "what the server lets you set
            besides" are different answers to different questions.

            `dSAOperation` attributes are excluded: `namingContexts` and
            `supportedControl` are operational and unflagged too, but they
            belong to the server rather than to an entry.
        structural:
          type: string
          description: The single structural class, or empty when it is ambiguous.
        unknown:
          type: array
          items: { type: string }
          description: Object classes on the entry that the schema does not define.

    EntryView:
      type: object
      required: [dn, attributes]
      properties:
        dn: { type: string }
        rdn: { type: string }
        parentDn: { type: string }
        objectClasses: { type: array, items: { type: string } }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/EntryAttribute" }
        requirements: { $ref: "#/components/schemas/Requirements" }
        referencedByFilter:
          type: string
          description: |
            An RFC 4515 filter matching every entry that names this one — the
            answer to "which groups is this person in", and to "what would
            break if I deleted this".

            Built here rather than in the browser, with the filter builder, so
            the DN is escaped once by the code that owns that rule. It asserts
            only the attributes this server actually defines, and only ones a
            user may modify, so it is the same question phrased in whatever
            vocabulary the connected directory has.

            Absent when the server defines none of them, or when the entry has
            no DN to search for.
        membershipAttributes:
          type: array
          items: { type: string }
          description: |
            The attributes this entry's object classes use to hold members,
            canonically spelled, whether the entry currently has values in them
            or not. Empty for an entry that is not a group.

            Present so adding a member can be one action rather than an edit of
            a list: replacing a fifty-member list to add one person removes
            anybody another administrator added since the entry was read.
        candidateKinds:
          type: array
          items: { $ref: "#/components/schemas/AttributeKind" }
          description: |
            The schema's opinion about the attributes this entry's classes
            permit but which it does not currently carry.

            Without it the editor knows nothing about an attribute until the
            entry already has one, so adding an attribute produced a bare text
            box labelled "not in the schema" — no description, no syntax, and a
            text box for something the schema calls a Boolean.
        ldif:
          type: string
          description: The entry as an LDIF content record, ready to copy.
        hasChildren: { type: boolean }

    TreeNode:
      type: object
      required: [dn, rdn, hasChildren]
      properties:
        dn: { type: string }
        rdn:
          type: string
          description: The leftmost RDN, which is what the tree shows as a label.
        hasChildren: { type: boolean }
        objectClasses: { type: array, items: { type: string } }
        structural:
          type: string
          description: The structural class, used to pick an icon.
        isNamingContext: { type: boolean }

    TreePage:
      type: object
      required: [nodes]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TreeNode" }
        cookie: { type: string }
        truncated: { type: boolean }
        hiddenChildren:
          type: integer
          description: |
            Children this parent has that the session could not see.

            Some servers publish `numSubordinates`, computed by the server and
            not filtered by the access rules, and where they do the gap between
            it and the children returned is exactly what this bind may not see.
            Absent where the server does not publish it, which is a capability
            and not a vendor trait — it is read from the entry, never inferred
            from who the server is. Absent too when the listing was truncated,
            since then the gap is paging rather than access.

    CountResult:
      type: object
      required: [count, truncated]
      properties:
        count: { type: integer }
        truncated:
          type: boolean
          description: |
            True when the limit was reached, so the real total is higher and the
            count must be reported as "at least".
        took: { type: string }

    SearchRequest:
      type: object
      required: [baseDn, scope, filter]
      properties:
        baseDn: { type: string }
        scope:
          type: string
          enum: [base, one, sub]
        filter:
          type: string
          description: A raw RFC 4515 filter. It is parsed, never interpolated.
        attributes:
          type: array
          items: { type: string }
        limit: { type: integer, minimum: 1, maximum: 10000, default: 100 }
        pageSize: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        cookie: { type: string }

    SearchResultEntry:
      type: object
      required: [dn]
      properties:
        dn: { type: string }
        rdn: { type: string }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/EntryAttribute" }

    SearchResponse:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/SearchResultEntry" }
        truncated:
          type: boolean
          description: |
            True when results were cut short. A silently truncated search is
            worse than no search, so this is always surfaced.
        cookie: { type: string }
        referrals: { type: array, items: { type: string } }
        took:
          type: string
          description: How long the search took, as a duration string.
        command:
          type: string
          description: |
            The `ldapsearch` that would run this same search, for a runbook, a
            ticket or a script.

            Rendered here rather than in the browser for the reason the LDIF
            preview is: the browser holds the filter as it was typed, the
            server holds the filter it parsed and would send, and normalising
            it is the point of parsing it. A command built from the typed text
            would describe a different search from the results beside it.

            Never contains the bind password. `-W` makes ldapsearch prompt.

    ObjectViewList:
      type: object
      required: [views]
      properties:
        views:
          type: array
          items: { $ref: "#/components/schemas/ObjectView" }

    ObjectView:
      type: object
      required: [id, label, filter, anchors, columns]
      properties:
        id:
          type: string
          enum: [users, groups, organizationalUnits]
          # Named explicitly: the bare generated constants would be Users and
          # Groups, which are far too general to sit in the package namespace.
          x-enum-varnames: [ViewUsers, ViewGroups, ViewOrganizationalUnits]
        label: { type: string }
        description:
          type: string
          description: One line on what this view is showing, in the UI's words.
        filter:
          type: string
          description: |
            An RFC 4515 filter over the anchor classes this server defines,
            rendered by the filter builder. It is posted to /search as-is.
        anchors:
          type: array
          items: { type: string }
          description: |
            The object classes the filter matches on. Shown to the user, so the
            view can say what it means by "user" rather than ask to be trusted.
        createClasses:
          type: array
          items: { type: string }
          description: |
            The structural classes this view matches, which are the classes a
            new one could be created as. A server publishes hundreds of
            structural classes and a list of all of them is not a choice anybody
            can make; this is the handful that would produce an entry this view
            would then show.
        columns:
          type: array
          items: { $ref: "#/components/schemas/ObjectViewColumn" }
        permittedColumns:
          type: array
          items: { $ref: "#/components/schemas/ObjectViewColumn" }
          description: |
            Every attribute an entry this view matches could hold, as candidates
            for the columns. `columns` is the default subset of this.

            Computed over every class the view's filter matches, not just the
            classes it anchors on — walking the superior chain alone would drop
            `mail` from Users, because `person` does not permit it and
            `inetOrgPerson` does. That is the bug the object views were fixed
            for once already, and repeating the walk in the browser is how the
            two copies would drift apart again.

    ObjectViewColumn:
      type: object
      required: [attribute, label]
      properties:
        attribute:
          type: string
          description: The attribute type, canonically spelled by the schema.
        label:
          type: string
          description: |
            A readable heading. Falls back to the attribute name itself, which
            is always shown alongside it: a friendly label that hides the real
            name is how somebody learns the wrong thing about their directory.
        desc:
          type: string
          description: The schema's own DESC, where the server published one.

    EntryComparison:
      type: object
      required: [left, right, attributes, counts, truncated]
      properties:
        left: { $ref: "#/components/schemas/ComparedEntry" }
        right: { $ref: "#/components/schemas/ComparedEntry" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/AttributeComparison" }
        counts: { $ref: "#/components/schemas/ComparisonCounts" }
        truncated:
          type: boolean
          description: Some attribute held more values than the limit reports.

    ComparedEntry:
      type: object
      required: [dn]
      properties:
        dn: { type: string }
        rdn: { type: string }
        objectClasses: { type: array, items: { type: string } }
        structural:
          type: string
          description: |
            The single structural class. A difference here explains most of the
            rows below it and should be read first.

    ComparisonCounts:
      type: object
      required: [same, differs, leftOnly, rightOnly, withheld, undetermined]
      description: |
        One bucket per status, and every attribute lands in exactly one, so the
        six sum to the length of `attributes`.
      properties:
        same: { type: integer }
        differs: { type: integer }
        leftOnly: { type: integer }
        rightOnly: { type: integer }
        undetermined:
          type: integer
          description: |
            One-sided, and the missing side could not be read. Counted apart
            from `leftOnly` and `rightOnly` because those name a difference
            between two entries and this names a limit on what the session may
            see.
        withheld:
          type: integer
          description: |
            Held by both and not compared. Counted separately rather than folded
            into `same`, which would be a claim about password material.

    AttributeComparison:
      type: object
      required: [name, status, left, right]
      properties:
        name:
          type: string
          description: |
            The attribute description, options included. `userCertificate;binary`
            and `userCertificate` are two rows, not one.
        status:
          type: string
          enum: [same, differs, leftOnly, rightOnly, withheld, undetermined]
          description: |
            `withheld` means both entries hold the attribute and it was not
            compared, because it is sensitive. It is a status of its own rather
            than `same` with a flag beside it: a client reading only this field
            must not be able to conclude that two passwords match.

            `undetermined` means the access rules stopped the comparison. The
            attribute is on one side and was not returned for the other, and
            asking the server directly said the bind may not look rather than
            that the entry lacks it. Reporting that as `leftOnly` would be a
            statement about the directory that this session has no basis for.
            The side that could not be read carries `denied`.
        left: { $ref: "#/components/schemas/ComparedSide" }
        right: { $ref: "#/components/schemas/ComparedSide" }
        values:
          type: array
          items: { $ref: "#/components/schemas/ValueComparison" }
          description: Absent for a withheld attribute.
        withheld:
          type: boolean
          description: |
            Sensitive, so no value crosses the wire from either side. Presence
            is still reported on each side, because `/entry` already says whether
            a password is set. Equality is not: reporting whether two entries
            hold the same password hash would be an oracle about password
            material the product offers nowhere else.
        truncated: { type: boolean }

    ComparedSide:
      type: object
      required: [present, valueCount, required, permitted]
      properties:
        present: { type: boolean }
        valueCount: { type: integer }
        required:
          type: boolean
          description: |
            Required by *this* entry's own classes. Required and absent is
            sometimes the whole answer, and is invisible to a diff of what is
            present.
        permitted:
          type: boolean
          description: |
            Permitted by this entry's own classes. Present but not permitted is
            reachable through an extensibleObject or a DIT content rule, and is
            a finding rather than a curiosity.
        denied:
          type: boolean
          description: |
            The access rules forbid this bind from reading the attribute on this
            side, so its absence here says nothing about the entry. Set only
            after the server was asked directly; a plain read cannot tell this
            from an attribute the entry does not hold.
        valueSchemes:
          type: array
          items: { type: string }
          description: The storage scheme of each withheld value, never the value.

    ValueComparison:
      type: object
      required: [side, value]
      properties:
        side:
          type: string
          enum: [both, left, right]
        value: { $ref: "#/components/schemas/AttributeValue" }

    InventoryRequest:
      type: object
      required: [baseDn, scope, attribute]
      properties:
        baseDn: { type: string }
        scope:
          type: string
          enum: [base, one, sub]
        filter:
          type: string
          description: An RFC 4515 filter narrowing what is examined. Parsed, never pasted.
        attribute:
          type: string
          description: |
            The attribute to tally. Attribute options are folded together:
            `alderTeam` and `alderTeam;lang-fr` are one attribute.
        limit:
          type: integer
          minimum: 1
          maximum: 250000
          default: 1000
          description: |
            Entries examined. The tally is folded a page at a time, so this
            bounds how long it takes rather than how much it holds — which is
            why it can be far larger than the other limits here.
        maxValues:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
          description: |
            Rows returned. The counts behind them stay exact — the tail is
            reported as a remainder rather than dropped.

    InventoryResponse:
      type: object
      required: [attribute, examined, limit, truncated, withValue, withoutValue, distinctValues, singletonValues, otherValues, otherEntries, values]
      properties:
        attribute: { type: string }
        examined:
          type: integer
          description: |
            Entries the search returned. Every other number here is about these
            entries, not about the directory.
        limit: { type: integer }
        truncated:
          type: boolean
          description: |
            The search reached its limit, so entries exist that were not
            examined and the tally is partial.
        withValue: { type: integer }
        withoutValue: { type: integer }
        distinctValues:
          type: integer
          description: Exact across the examined entries, even when fewer rows are returned.
        singletonValues:
          type: integer
          description: |
            Distinct values held by exactly one entry. The typo signal: a value
            one entry holds among three hundred is usually a misspelling of one
            that ninety hold.
        otherValues:
          type: integer
          description: Distinct values beyond `maxValues`, counted but not listed.
        otherEntries:
          type: integer
          description: Entries carrying one of those values.
        values:
          type: array
          items: { $ref: "#/components/schemas/InventoryRow" }

    InventoryRow:
      type: object
      required: [value, entries]
      properties:
        value: { $ref: "#/components/schemas/AttributeValue" }
        entries:
          type: integer
          description: Entries carrying this value, not occurrences of it.

    ResolveResult:
      type: object
      required: [query, destinations]
      properties:
        query: { type: string }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/Destination" }
          description: |
            Empty when the input is not usable — a half-typed filter, say.
            More than one when the input is genuinely ambiguous.

    Destination:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [entry, search]
        label: { type: string }
        dn:
          type: string
          description: Set for an entry destination; the DN, canonically rendered.
        filter:
          type: string
          description: |
            Set for a search destination, built by the filter package and
            escaped — the text came from a box somebody typed in.
        base: { type: string }

    MemberList:
      type: object
      required: [members, truncated]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/ExpandedMember" }
        truncated:
          type: boolean
          description: |
            True when the walk stopped at its bound. A membership list that
            quietly omits people is worse than none, since the question being
            asked is usually "who can get in".
        cycles:
          type: array
          items: { type: string }
          description: |
            Groups that contain themselves, directly or through others. A
            configuration error somebody should hear about, not a condition to
            survive silently.
        dangling:
          type: array
          items: { type: string }
          description: |
            Member values whose entry could not be read. Two things produce
            this and nothing distinguishes them: the entry was deleted while the
            group went on naming it, or it exists and this bind may not see it.
            A server answers "no such object" either way, deliberately, so that
            refusing access does not disclose what is there.

            So this is a list of members whose status is unknown, not a list of
            broken references. Reporting it as the latter tells an operator
            auditing who can reach something that a member is gone when they may
            still be in the group.
        unresolvable:
          type: array
          items: { type: string }
          description: |
            Membership values that are not DNs, and so cannot be followed to an
            entry: `memberUid` holds a login name, `memberURL` a search.

    ExpandedMember:
      type: object
      required: [dn, group, direct]
      properties:
        dn: { type: string }
        rdn: { type: string }
        group:
          type: boolean
          description: Whether this member is itself a group that was expanded.
        direct:
          type: boolean
          description: Whether the group names this member itself.
        via:
          type: array
          items: { type: string }
          description: |
            The chain of groups that brought this member in, outermost first.
            Empty for a direct member. This is the part a flat list cannot say,
            and the part somebody needs in order to remove an unwanted member
            from the right group.
        through:
          type: string
          description: The membership attribute that names this member.

    ReferenceList:
      type: object
      required: [references, truncated]
      properties:
        references:
          type: array
          items: { $ref: "#/components/schemas/Reference" }
        truncated:
          type: boolean
          description: |
            True when the search stopped early, so there are references this
            does not list. A list that quietly omits some is worse than none
            when the question is "what would break if I deleted this".

            Note that `false` does not make the list complete. It is the result
            of a search, so it holds the referring entries *this session can
            see*; one hidden by the access rules is absent exactly as one that
            does not exist is, and nothing in the protocol distinguishes them.
            The answer is "nothing I can see points at this", which is not the
            same claim as "nothing points at this".

            That applies to a list with entries in it as much as to an empty
            one: acting on three references you can see is no safer when there
            is a fourth you cannot. Unlike the comparison, there is nothing to
            detect here -- a Compare recovers absent-from-denied for an
            attribute on an entry you can already read, and no operation says
            "your search would have matched something you may not see".
        searchedBase:
          type: string
          description: The naming context this looked in.

    Reference:
      type: object
      required: [dn, attribute, value]
      properties:
        dn:
          type: string
          description: The entry doing the naming.
        rdn: { type: string }
        attribute:
          type: string
          description: |
            The attribute it names this entry by, canonically spelled. Removing
            the reference is a delete of one value of this attribute on that
            entry — which is why it is reported rather than inferred.
        value:
          type: string
          description: |
            The value as the directory stores it, which is not always the
            subject's own DN: `uniqueMember` may carry a `#uid` suffix, and a
            server may return a different but equivalent spelling. A delete has
            to name the stored value — `uniqueMemberMatch` compares the UID
            part too, so a delete of the bare DN would match nothing and the
            reference would survive a change that reported success.

    SchemaCounts:
      type: object
      properties:
        objectClasses: { type: integer }
        attributeTypes: { type: integer }
        syntaxes: { type: integer }
        matchingRules: { type: integer }
        matchingRuleUses: { type: integer }
        ditContentRules: { type: integer }
        nameForms: { type: integer }
        errors: { type: integer }

    ObjectClassSummary:
      type: object
      required: [name, oid, kind]
      properties:
        origin:
          type: string
          description: |
            Where this definition came from, in the server's own words. The
            X-ORIGIN extension where the server keeps one, and otherwise the
            schema collection holding it on a server that stores its schema in
            configuration entries.

            Deliberately not a "shipped or custom" flag. One of the two servers
            Alder targets discards X-ORIGIN when it loads a schema file, so on
            that server such a flag would be a guess. This reports what was
            actually published, and is absent where nothing was.
        name: { type: string }
        names: { type: array, items: { type: string } }
        oid: { type: string }
        desc: { type: string }
        kind: { type: string, enum: [STRUCTURAL, ABSTRACT, AUXILIARY] }
        obsolete: { type: boolean }
        superiors: { type: array, items: { type: string } }

    AttributeTypeSummary:
      type: object
      required: [name, oid]
      properties:
        origin:
          type: string
          description: |
            Where this definition came from, in the server's own words. The
            X-ORIGIN extension where the server keeps one, and otherwise the
            schema collection holding it on a server that stores its schema in
            configuration entries.

            Deliberately not a "shipped or custom" flag. One of the two servers
            Alder targets discards X-ORIGIN when it loads a schema file, so on
            that server such a flag would be a guess. This reports what was
            actually published, and is absent where nothing was.
        name: { type: string }
        names: { type: array, items: { type: string } }
        oid: { type: string }
        desc: { type: string }
        obsolete: { type: boolean }
        superior: { type: string }
        syntax: { type: string }
        syntaxLabel: { type: string }
        equality: { type: string }
        singleValue: { type: boolean }
        operational: { type: boolean }

    SyntaxSummary:
      type: object
      required: [oid]
      properties:
        oid: { type: string }
        desc: { type: string }
        kind: { type: string }
        usedByCount: { type: integer }

    MatchingRuleSummary:
      type: object
      required: [name, oid]
      properties:
        name: { type: string }
        oid: { type: string }
        desc: { type: string }
        syntax: { type: string }
        obsolete: { type: boolean }

    SchemaParseError:
      type: object
      properties:
        attribute: { type: string }
        definition: { type: string }
        message: { type: string }

    SchemaView:
      type: object
      required: [subschemaDn, counts]
      properties:
        subschemaDn: { type: string }
        counts: { $ref: "#/components/schemas/SchemaCounts" }
        objectClasses:
          type: array
          items: { $ref: "#/components/schemas/ObjectClassSummary" }
        attributeTypes:
          type: array
          items: { $ref: "#/components/schemas/AttributeTypeSummary" }
        syntaxes:
          type: array
          items: { $ref: "#/components/schemas/SyntaxSummary" }
        matchingRules:
          type: array
          items: { $ref: "#/components/schemas/MatchingRuleSummary" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/SchemaParseError" }
          description: |
            Definitions the server published that this parser could not read.
            A non-empty list is a partial load, not a failed one, and the UI
            says so rather than pretending the schema is complete.

    RequirementsView:
      type: object
      required: [requirements, kinds]
      properties:
        requirements: { $ref: "#/components/schemas/Requirements" }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/AttributeKind" }
          description: One per attribute in the MUST and MAY sets.

    ObjectClassDetail:
      type: object
      required: [summary]
      properties:
        summary: { $ref: "#/components/schemas/ObjectClassSummary" }
        must: { type: array, items: { type: string } }
        may: { type: array, items: { type: string } }
        inheritedMust: { type: array, items: { type: string } }
        inheritedMay: { type: array, items: { type: string } }
        superiorChain:
          type: array
          items: { type: string }
          description: Transitive superiors, nearest first.
        subclasses: { type: array, items: { type: string } }
        raw:
          type: string
          description: The definition exactly as the server published it.
        edit:
          $ref: "#/components/schemas/ObjectClassInput"

    AttributeTypeDetail:
      type: object
      required: [summary]
      properties:
        summary: { $ref: "#/components/schemas/AttributeTypeSummary" }
        kind: { $ref: "#/components/schemas/AttributeKind" }
        superiorChain: { type: array, items: { type: string } }
        requiredBy:
          type: array
          items: { type: string }
          description: Object classes that name this attribute in MUST.
        optionalIn:
          type: array
          items: { type: string }
          description: Object classes that name this attribute in MAY.
        raw: { type: string }
        edit:
          $ref: "#/components/schemas/AttributeTypeInput"

    ChangeMod:
      type: object
      required: [op, name]
      properties:
        op:
          type: string
          enum: [add, delete, replace]
        name: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/AttributeValue" }
          description: |
            A delete with no values removes the whole attribute; a delete with
            values removes exactly those.

    ChangeAttribute:
      type: object
      required: [name, values]
      properties:
        name: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/AttributeValue" }

    ChangeRequest:
      type: object
      required: [dn, type]
      properties:
        dn: { type: string }
        type:
          type: string
          enum: [add, modify, delete, modrdn, setpassword]
        newPassword:
          type: string
          format: password
          writeOnly: true
          description: |
            The new password, for `setpassword`. Write-only: it is never echoed
            by the preview, never rendered into the LDIF or the Ansible task,
            and never logged. A `setpassword` change is an RFC 3062 extended
            operation rather than a modification, so it has no LDIF form; the
            preview says so and shows the equivalent `ldappasswd` invocation.
        mods:
          type: array
          items: { $ref: "#/components/schemas/ChangeMod" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ChangeAttribute" }
        newRdn: { type: string }
        deleteOldRdn: { type: boolean }
        newSuperior: { type: string }

    ChangePreview:
      type: object
      required: [ldif, ansible, summary]
      properties:
        ldif:
          type: string
          description: |
            Unfolded, because the point of the preview is that a person reads
            it and a value broken at column 76 is harder to check.
        ldifFolded:
          type: string
          description: Folded at 76 columns, for download.
        ansible: { type: string }
        ansiblePlaybook: { type: string }
        summary: { type: string }
        affectedAttributes: { type: array, items: { type: string } }
        warnings:
          type: array
          items: { type: string }
          description: |
            Schema findings that do not block the change, such as setting an
            attribute no object class on the entry permits.

    ApplyResult:
      type: object
      required: [applied, dn]
      properties:
        applied: { type: boolean }
        dn:
          type: string
          description: The entry's DN after the change, which differs for a rename.
        storedDn:
          type: string
          description: |
            Where the entry actually came to rest, when that is not the DN the
            change was addressed to.

            A directory may store an added entry under a different name: where
            an entry's position among its siblings forms part of that name, the
            server assigns the position and rewrites the RDN. Reporting the
            requested DN in that case sends the caller to an entry that is not
            there.
        note:
          type: string
          description: |
            Present when the change was accepted but Alder could not confirm
            where the entry ended up.
        summary: { type: string }
        ldif: { type: string }

    SchemaChangeRequest:
      type: object
      required: [targetDn, kind, op]
      properties:
        targetDn:
          type: string
          description: |
            The schema entry to change. It must be one the capabilities listed;
            any other DN is refused, because accepting one would turn this into
            a way to aim an arbitrary modification at an arbitrary entry.
        kind:
          type: string
          enum: [objectClass, attributeType]
        op:
          type: string
          enum: [add, replace, delete]
        oid:
          type: string
          description: Which definition to replace or remove. Ignored for an add.
        objectClass:
          $ref: "#/components/schemas/ObjectClassInput"
        attributeType:
          $ref: "#/components/schemas/AttributeTypeInput"
        definition:
          type: string
          description: |
            A complete RFC 4512 definition, for someone who would rather write
            one than fill in a form. Takes precedence over the structured input
            when both are given, and is parsed and checked either way.

    ObjectClassInput:
      type: object
      description: |
        An object class as it declares itself, in the shape a change posts back.
        Returned by the detail response so an edit starts from the definition
        rather than from the summary, which resolves inherited attributes.
      required: [oid, names]
      properties:
        oid: { type: string }
        names: { type: array, items: { type: string } }
        desc: { type: string }
        obsolete: { type: boolean }
        superNames: { type: array, items: { type: string } }
        kind:
          type: string
          enum: [STRUCTURAL, ABSTRACT, AUXILIARY]
          x-enum-varnames: [KindStructural, KindAbstract, KindAuxiliary]
        must: { type: array, items: { type: string } }
        may: { type: array, items: { type: string } }
        extensions:
          type: object
          additionalProperties: { type: array, items: { type: string } }

    AttributeTypeInput:
      type: object
      description: |
        An attribute type as it declares itself, in the shape a change posts
        back.

        The detail responses return one of these so an edit starts from what the
        definition actually says. The summary alongside it is for reading: it
        reports effective values, resolved through SUP, which is what somebody
        looking at an attribute wants to know and exactly what an editor must not
        write back — a value inherited from a superior would become one declared
        here.
      required: [oid, names]
      properties:
        oid: { type: string }
        names: { type: array, items: { type: string } }
        desc: { type: string }
        obsolete: { type: boolean }
        superName: { type: string }
        equality: { type: string }
        ordering: { type: string }
        substr: { type: string }
        syntax: { type: string }
        syntaxLen: { type: integer }
        singleValue: { type: boolean }
        collective: { type: boolean }
        noUserModification: { type: boolean }
        usage:
          type: string
          enum: [userApplications, directoryOperation, distributedOperation, dSAOperation]
          # Named explicitly. The generator only prefixes enum constants when
          # they collide, so leaving these bare means a later enum sharing a
          # value silently renames them.
          x-enum-varnames:
            [UsageUserApplications, UsageDirectoryOperation, UsageDistributedOperation, UsageDSAOperation]
        extensions:
          type: object
          additionalProperties: { type: array, items: { type: string } }

    SchemaChangeBuild:
      type: object
      required: [change]
      properties:
        change:
          $ref: "#/components/schemas/ChangeRequest"
        definition:
          type: string
          description: The RFC 4512 text this change installs. Absent for a delete.
        removes:
          type: string
          description: |
            The definition this change removes, exactly as the server stores it.
            Shown so a replace can be read as the substitution it is.

    ChangesetRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/ChangeRequest" }
          description: |
            The changes, in the order they should be applied. A cap exists
            because the whole set is rendered and applied in one request.

    ChangesetPreview:
      type: object
      required: [ldif, changes]
      properties:
        ldif:
          type: string
          description: |
            Every change as one RFC 2849 document, in order. A password change
            appears as the notice explaining it has no LDIF form, so the
            document describes the run rather than silently omitting a step.
        ansiblePlaybook:
          type: string
          description: One playbook containing every task, in the same order.
        changes:
          type: array
          items: { $ref: "#/components/schemas/ChangePreview" }
        warnings:
          type: array
          items: { type: string }
          description: |
            Findings about the set as a whole, such as an entry created before
            its parent, or the same DN changed twice.

    ChangesetOutcome:
      type: object
      required: [index, dn, applied]
      properties:
        index:
          type: integer
          description: Position in the submitted list.
        dn: { type: string }
        applied: { type: boolean }
        summary: { type: string }
        error:
          $ref: "#/components/schemas/Error"

    ChangesetResult:
      type: object
      required: [outcomes, appliedCount]
      properties:
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/ChangesetOutcome" }
          description: |
            One per submitted change, in order. Entries after a failure are
            reported as not applied rather than omitted, so the caller can see
            what remains.
        appliedCount: { type: integer }
        failedIndex:
          type: integer
          description: The index that failed, absent when every change succeeded.

    ImportRequest:
      type: object
      required: [ldif]
      properties:
        ldif: { type: string }
        reconcile:
          type: boolean
          default: false
          description: |
            Turn a content record whose entry already exists into a modify that
            brings that entry to what the record describes.

            Without it such a record is an add, and a directory refuses an add
            for an entry that exists — which is correct, and makes the second
            half of an export/edit/import loop fail on every record.

            It replaces the attributes the record names and leaves every other
            attribute exactly as it is. The document is not treated as the whole
            truth about the entry: an export omits `userPassword` always and
            operational attributes by default, and a file that does not mention
            an attribute is not a file asking for it to be removed.

    ImportResult:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/ChangePreview" }
        requests:
          type: array
          items: { $ref: "#/components/schemas/ChangeRequest" }
          description: The parsed changes, ready to post back to /changes/apply.
        reconciled:
          type: integer
          description: |
            How many records were turned into a modify because their entry
            already exists. Only set when `reconcile` was asked for.
        unchanged:
          type: array
          items: { type: string }
          description: |
            The DNs whose entry already matches the document, and which are
            therefore absent from `changes`. Reported rather than shown as
            no-op modifications: a change that does nothing still has to be
            read and confirmed, and there is nothing there to confirm.
        skippedAttributes:
          type: array
          items: { type: string }
          description: |
            Attributes left out of a reconciliation because the directory owns
            them — operational or `NO-USER-MODIFICATION`. Enforcing one fails
            the whole record, and dropping it silently would let the file mean
            something other than it says.

    SourceOffer:
      type: object
      required: [license, sourceUrl, version, notice]
      properties:
        license:
          type: string
          description: The SPDX identifier Alder is licensed under.
        sourceUrl:
          type: string
          description: |
            Where the Corresponding Source of *this* build lives. An operator
            running a fork sets `--source-url` to their own; leaving it at the
            default while running a modified build does not comply.
        version: { type: string }
        revision:
          type: string
          description: The commit this binary was built from, when the build recorded one.
        modified:
          type: boolean
          description: |
            True when the build came from a tree with uncommitted changes, so
            `revision` alone does not identify the source. Absent means false.
        notice:
          type: string
          description: The offer in prose, for a person rather than a client.
