---
# Generated by Alder. Review before running.
#
# The connection variables are left unset on purpose: a bind password does
# not belong in a generated file. Supply them from a vault, the command
# line, or the environment.
- name: Apply directory changes
  hosts: localhost
  gather_facts: false
  vars:
    ldap_server_uri: "ldaps://directory.example.test"
    ldap_bind_dn: "cn=admin,dc=example,dc=test"
    ldap_bind_pw: "{{ lookup('env', 'LDAP_BIND_PW') }}"
  tasks:
    - name: Create "uid=carol,ou=people,dc=alder,dc=test"
      community.general.ldap_entry:
        server_uri: "{{ ldap_server_uri }}"
        bind_dn: "{{ ldap_bind_dn }}"
        bind_pw: "{{ ldap_bind_pw }}"
        dn: "uid=carol,ou=people,dc=alder,dc=test"
        objectClass:
          - "top"
          - "inetOrgPerson"
        attributes:
          "cn": "Carol Adler"
          "sn": "Adler"
        state: present
