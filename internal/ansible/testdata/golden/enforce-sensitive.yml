# Generated by Alder from a directory as it currently is.
#
# Each entry gets two tasks: one to create it if it is missing, and one
# to bring its attributes to exactly the values listed here. Running this
# against a directory whose entries differ will change them.
#
# base:  dc=alder,dc=test
# scope: sub
# 1 entry, ordered parent first
#
# Operational attributes, attributes the directory owns, and sensitive
# ones such as userPassword are not listed and are not enforced.

- name: Ensure "uid=alice,ou=people,dc=alder,dc=test" exists
  community.general.ldap_entry:
    server_uri: "{{ ldap_server_uri }}"
    bind_dn: "{{ ldap_bind_dn }}"
    bind_pw: "{{ ldap_bind_pw }}"
    dn: "uid=alice,ou=people,dc=alder,dc=test"
    objectClass:
      - "inetOrgPerson"
    state: present

- name: Enforce the attributes of "uid=alice,ou=people,dc=alder,dc=test"
  community.general.ldap_attrs:
    server_uri: "{{ ldap_server_uri }}"
    bind_dn: "{{ ldap_bind_dn }}"
    bind_pw: "{{ ldap_bind_pw }}"
    dn: "uid=alice,ou=people,dc=alder,dc=test"
    state: exact
    attributes:
      "cn": "Alice Liddell"
      "sn": "Liddell"
