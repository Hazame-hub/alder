# The Alder conformance harness: OpenLDAP and 389 Directory Server, both with
# TLS from the same test CA, both holding byte-identical seed data under
# dc=alder,dc=test.
#
# Everything is ephemeral on purpose. There are no data volumes, so "down" then
# "up" gives a clean directory and re-runs the seed. A conformance suite that
# depends on the order previous runs left things in is not a conformance suite.
#
# Certificates are the one thing that persists, in ./certs, because reissuing
# them on every start would mean the Go test client could never pin a CA.
#
#   task compose:up     bring it up and seed it
#   task compose:down   tear it down
#   task compose:logs   follow the logs
#
# There is also an opt-in bulk mode, "task compose:bulk -- <count>", which adds
# generated filler under ou=bulk for scale work. It rebuilds the harness from
# scratch and is not what the conformance suite runs against; see README.md.
#
# Ports on the host:
#   OpenLDAP  ldap://localhost:10389   ldaps://localhost:10636
#   389 DS    ldap://localhost:11389   ldaps://localhost:11636

name: alder-harness

services:
  # Issues the test CA and both server certificates into ./certs, then exits.
  # Idempotent: it does nothing if ./certs/ca.crt already exists.
  certs:
    build: ./openldap
    image: alder/harness-openldap
    entrypoint: ["/bin/sh", "/scripts/certgen.sh"]
    volumes:
      - ./certs:/certs
      - ./scripts:/scripts:ro

  openldap:
    build: ./openldap
    image: alder/harness-openldap
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      # Empty unless "task compose:bulk" put a path here. When it is empty the
      # container behaves exactly as it did before bulk mode existed; when it
      # is set, entrypoint.sh slapadds that file before slapd starts.
      ALDER_BULK_LDIF: ${ALDER_BULK_LDIF:-}
    volumes:
      - ./certs:/certs:ro
      # Both read-only, and both read only in bulk mode. ./seed is here because
      # slapadd needs the suffix entry to exist before ou=bulk can have a
      # parent, and 00-base.ldif is where that entry is defined.
      - ./seed:/seed:ro
      - ./bulk:/bulk:ro
    ports:
      - "10389:389"
      - "10636:636"

  ds389:
    # The 389 DS project publishes only "latest" and a rolling stream tag, so
    # the harness pins a digest instead. Bump it deliberately, in its own
    # commit, and re-run the conformance suite: a directory server changing
    # under the tests is exactly what this pin exists to prevent.
    image: quay.io/389ds/dirsrv:c9s@sha256:40b6cd8370de9ed2856262c5f8a675aeb84c17cf9f7f6957fe7cc8d88988004a
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      DS_DM_PASSWORD: alder-directory-manager
      DS_SUFFIX_NAME: alder
      DS_SUFFIX_DN: dc=alder,dc=test
    volumes:
      # The container looks for server.crt, server.key and ca/ca.crt here.
      - ./certs/ds389:/data/tls
      # Read only in bulk mode. 389 DS's import runs inside ns-slapd, so the
      # LDIF has to be a path that process can open -- handing the file to a
      # client would put it back on the LDAP path this exists to avoid.
      - ./bulk:/bulk:ro
    ports:
      - "11389:3389"
      - "11636:3636"
    healthcheck:
      test: ["CMD", "/usr/libexec/dirsrv/dscontainer", "-H"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30

  # Installs the custom schema where it is not already present and applies the
  # seed LDIF to both servers, then exits. Runs to completion on every "up".
  seed:
    build: ./openldap
    image: alder/harness-openldap
    entrypoint: ["/bin/sh", "/scripts/seed.sh"]
    depends_on:
      openldap:
        condition: service_healthy
      ds389:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro
      - ./ds389:/ds389:ro
      - ./scripts:/scripts:ro

  # The 389 DS half of the opt-in bulk load, plus the count check for both
  # servers. Behind a profile so that a plain "docker compose up" cannot start
  # it by accident; "task compose:bulk" is the only thing that runs it.
  bulk:
    build: ./openldap
    image: alder/harness-openldap
    profiles: ["bulk"]
    entrypoint: ["/bin/sh", "/scripts/bulk.sh"]
    environment:
      ALDER_BULK_LDIF: /bulk/bulk.ldif
    depends_on:
      openldap:
        condition: service_healthy
      ds389:
        condition: service_healthy
    volumes:
      - ./bulk:/bulk:ro
      - ./ds389:/ds389:ro
      - ./scripts:/scripts:ro
