# slapd configuration for the Alder conformance harness.
#
# This file is converted to a cn=config database at image build time by
# slaptest and then deleted. It is not read at run time.
#
# TLS is configured by entrypoint.sh, not here: see the Dockerfile.

include		/etc/ldap/schema/core.schema
include		/etc/ldap/schema/cosine.schema
include		/etc/ldap/schema/inetorgperson.schema
include		/etc/ldap/schema/nis.schema
include		/etc/ldap/schema/alder.schema

pidfile		/var/run/slapd/slapd.pid
argsfile	/var/run/slapd/slapd.args

modulepath	/usr/lib/ldap
moduleload	back_mdb
# The password policy overlay, so this side of the harness has what a real
# OpenLDAP has.
#
# Operational attributes were the first thing a real operator reported missing,
# and ppolicy is where OpenLDAP keeps the interesting ones: pwdAccountLockedTime
# locks an account, pwdReset forces a change at the next bind. Both are USAGE
# directoryOperation with no NO-USER-MODIFICATION -- the server keeps them and
# expects an administrator to set them. Without the overlay the schema does not
# define them at all, so there was nothing here to get right or wrong. Since
# OpenLDAP 2.5 the overlay registers its own schema, so no include is needed.
moduleload	ppolicy

# The config database, so that Alder can read cn=config capabilities. It is
# readable by the config admin only; v1 never writes to it.
database	config
rootdn		"cn=admin,cn=config"
rootpw		alder-config

database	mdb
suffix		"dc=alder,dc=test"
rootdn		"cn=admin,dc=alder,dc=test"
rootpw		alder-admin
directory	/var/lib/ldap
maxsize		268435456

index		objectClass			eq
index		entryUUID,entryCSN		eq
index		uid,cn,sn,givenName,mail	eq,sub
index		member,memberUid		eq
index		alderTeam			eq,sub

overlay		ppolicy

# Passwords are never readable, not even by the entry itself. Anonymous may
# only use them to bind. This is the shape of a real deployment, so that a bug
# where Alder leaks userPassword shows up in the conformance suite.
access to attrs=userPassword
	by self write
	by anonymous auth
	by * none

# The service account Alder binds as when it is not the rootdn.
#
# It administers people and groups and has no business in ou=services, where
# the other machines' credentials live -- so a whole subtree is invisible to
# it, which is the ordinary shape of a delegated account and the case nothing
# in this suite exercised before. Every test bound as cn=admin until now, and
# OpenLDAP's rootdn bypasses every rule in this file, so the userPassword rule
# above was never actually applied to anything.
#
# The account's own entry is inside the subtree and is hidden with the rest of
# it. A "by self read" exception was tried and removed: 389 DS's deny has no
# equivalent, so keeping it made the two servers disagree about one entry, and
# a suite whose point is that both behave identically should not carry a
# difference it invented itself. Binding does not require read access.
access to dn.subtree="ou=services,dc=alder,dc=test"
	by dn.exact="cn=svc-alder,ou=services,dc=alder,dc=test" none
	by users read
	by * read

# One attribute, on one entry, hidden from the delegated account.
#
# A fixture for the case a read cannot report honestly: alderTeam is readable
# on uid=user0001 and forbidden on uid=user0002, so comparing the two returns
# the attribute for one side and nothing for the other -- which is
# indistinguishable, in the result, from an entry that simply does not have it.
# Attribute-level delegation of exactly this shape is ordinary; what is
# artificial here is only that it applies to a single entry, so that one pair
# of seeded users exercises it.
access to dn.exact="uid=user0002,ou=people,dc=alder,dc=test" attrs=alderTeam
	by dn.exact="cn=svc-alder,ou=services,dc=alder,dc=test" none
	by users read
	by * read

access to *
	by self write
	by users read
	by * read
