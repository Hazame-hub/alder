# slapd configuration for the harness's OpenLDAP consumer.
#
# This is the same server software as slapd.conf's, arranged the other way
# round: it holds no seed data of its own and gets everything from the
# supplier over syncrepl. It exists so that replication visibility is proved
# against a directory that really is replicating, rather than against a
# configuration nobody ever ran.
#
# Converted to a cn=config database at image build time by slaptest and then
# deleted, exactly as slapd.conf is. TLS is configured by entrypoint.sh.

include		/etc/ldap/schema/core.schema
include		/etc/ldap/schema/cosine.schema
include		/etc/ldap/schema/inetorgperson.schema
include		/etc/ldap/schema/nis.schema
include		/etc/ldap/schema/alder.schema

# 2, because the supplier is 1. OpenLDAP writes the server ID into every
# entryCSN it generates, so this is what makes a change's origin legible.
serverID	2

pidfile		/var/run/slapd/slapd.pid
argsfile	/var/run/slapd/slapd.args

modulepath	/usr/lib/ldap
moduleload	back_mdb
# ppolicy, loaded and never configured as an overlay.
#
# Loading it is what registers the pwdPolicy schema, and the supplier's seed
# holds two entries that use it. Without the module the consumer's mdb backend
# cannot store an attribute it has no type for: syncrepl reports "be_modify
# failed (80)" on those two entries and retries for ever, so the consumer sits
# two entries short and every later change is stuck behind them. That failure
# is silent from the outside, which is why the harness asserts the entry
# counts match rather than trusting that replication is running.
moduleload	ppolicy
# syncprov on a consumer too. A consumer that carries it can answer a
# refreshAndPersist of its own -- which is how a chained topology is built --
# and, more to the point here, it is what maintains contextCSN on this side.
# Without it the consumer has no visible measure of how far behind it is, and
# "how far behind" is half of what this harness was doubled to prove.
moduleload	syncprov

database	config
rootdn		"cn=admin,cn=config"
rootpw		alder-config

database	mdb
suffix		"dc=alder,dc=test"
rootdn		"cn=admin,dc=alder,dc=test"
rootpw		alder-admin
directory	/var/lib/ldap
maxsize		268435456

index		objectClass			eq
index		entryUUID,entryCSN		eq
index		uid,cn,sn,givenName,mail	eq,sub

overlay		syncprov

# The agreement itself.
#
# rid is this consumer's number for the link, not the server's identity, and
# it is what appears in the replication view beside the provider URI. The
# credentials are in the value, which is why Alder treats a whole olcSyncrepl
# value as a secret and never renders one.
#
# retry="5 +" means: wait five seconds, retry for ever. The harness is brought
# up and torn down constantly, and a consumer that gives up after ten attempts
# is a consumer that is mysteriously empty on the eleventh.
syncrepl	rid=001
		provider=ldap://openldap:389
		type=refreshAndPersist
		retry="5 +"
		searchbase="dc=alder,dc=test"
		scope=sub
		schemachecking=off
		bindmethod=simple
		binddn="cn=admin,dc=alder,dc=test"
		credentials=alder-admin

# A write sent here is refused with a referral to the supplier rather than
# accepted locally and silently lost at the next refresh. This is the state an
# operator most often needs explained, and the reason the replication view
# says which of the two a server is.
updateref	ldap://openldap:389/

access to attrs=userPassword
	by self write
	by anonymous auth
	by * none

access to *
	by self write
	by users read
	by * read
