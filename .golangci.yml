# golangci-lint v2 configuration.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
  exclusions:
    rules:
      # Fixtures and generators are not production code.
      - path: test/compose/seed/gen/
        linters:
          - gosec
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
