name: cla

# Alder is AGPL-3.0 and the Maintainer wants to keep the option of licensing it
# on other terms. That option survives only while every line is covered by a
# grant permitting it, so the check runs on every pull request rather than being
# an honour-system note in CONTRIBUTING.md.
#
# Signatures are stored as JSON on the cla-signatures branch, so who agreed to
# what, and when, is in git rather than in a third-party service.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Runs for a pull request, or for the comment that signs one. Skipping every
    # other comment keeps this off the critical path of ordinary discussion.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'I have read the CLA Document'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1.json
          path-to-document: https://github.com/Hazame-hub/alder/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer's own commits do not need a grant from themselves,
          # and neither do the bots that open dependency pull requests.
          allowlist: Hazame-hub,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request.


            Alder is AGPL-3.0, and the project keeps the option of licensing it
            on other terms as well. That only works if every contribution comes
            with permission to do it, so there is a one-time Contributor Licence
            Agreement to sign. You keep the copyright in your work.


            Please read the [CLA](https://github.com/Hazame-hub/alder/blob/main/CLA.md)
            and, if you agree, reply to this pull request with exactly:
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thank you.
