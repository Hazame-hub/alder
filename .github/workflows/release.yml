name: release

# Releases are driven by the conventional-commit history rather than by anyone
# remembering to tag. release-please reads the commits since the last release,
# works out the next version, and keeps a release pull request open with the
# changelog it would produce. Merging that pull request is the act of releasing;
# there is no other manual step.
#
# The two jobs live in one workflow deliberately. A tag pushed using the default
# GITHUB_TOKEN does not trigger another workflow — GitHub suppresses that so
# workflows cannot recurse — so a separate "on: push: tags" job would simply
# never fire. Chaining them inside a single run sidesteps it and needs no
# personal access token to work around it.

on:
  push:
    branches: [main]
  # Manual recovery. If the release job half-succeeds -- creating the tag and
  # the release but failing before the artifacts are built -- there would
  # otherwise be no way to finish it, because the next push finds the release
  # already made and skips the build.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and publish artifacts for
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: prepare the release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          # A pull request opened with GITHUB_TOKEN does not trigger other
          # workflows -- GitHub suppresses that so workflows cannot recurse --
          # so the required checks never report on the release pull request and
          # it can never be merged without nudging it by hand.
          #
          # RELEASE_PLEASE_TOKEN is a fine-grained personal access token scoped
          # to this repository with contents:write and pull-requests:write. With
          # it, the release pull request behaves like any other and merges on
          # its own checks. Without it everything still works, with two manual
          # steps per release, which is why this falls back rather than failing.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    name: build and publish
    needs: release-please
    # Only when merging the release pull request actually cut a release. Every
    # other push to main stops at the job above, which just refreshes the
    # pending release pull request. always() is needed because release-please
    # is skipped on a manual dispatch, and a skipped dependency would otherwise
    # skip this too.
    if: >-
      always() && (
        (github.event_name == 'push' && needs.release-please.outputs.released == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Build the tag release-please just created rather than the branch
          # head, so the version compiled into the binary is the one released.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The SPA has to exist before the Go build, because embed.FS resolves at
      # compile time. GoReleaser checks for it and fails loudly if it is absent.
      - name: build the single-page application
        run: task web

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # .goreleaser.yaml asks for an SBOM per archive, and GoReleaser shells
      # out to syft to produce them. It is not on the runner by default, and
      # its absence only shows up after every archive has been built.
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
