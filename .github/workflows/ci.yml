name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: vet, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Built here rather than downloaded by the action, so the linter is the
      # one a developer gets from `go install` with this module's toolchain.
      #
      # And guarded, because a linter that cannot type-check the code says
      # "0 issues" and exits 0. Moving to Go 1.27.2 did exactly that with
      # v2.13.2: the export data was newer than it could read, it checked
      # almost nothing, and reported a clean run. A clean run is only
      # believed here if it actually type-checked.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          status=0
          out="$(golangci-lint run 2>&1)" || status=$?
          echo "$out"
          if echo "$out" | grep -q "typechecking error"; then
            echo "::error::golangci-lint could not type-check this code, so its result means nothing"
            exit 1
          fi
          exit "$status"

      # The release config is only exercised on a tag, so a mistake in it would
      # otherwise be found at the worst possible moment.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: go test
        run: go test -race ./...

      # The fuzz targets run as unit tests above via their seed corpus. This
      # step gives them a short random budget as well, which is where the
      # interesting DN and filter inputs have always come from.
      - name: fuzz smoke
        run: |
          go test ./internal/dn -run FuzzParse -fuzz FuzzParse -fuzztime 30s
          go test ./internal/filter -run FuzzParse -fuzz FuzzParse -fuzztime 30s
          go test ./internal/schema -run FuzzParseObjectClass -fuzz FuzzParseObjectClass -fuzztime 30s
          go test ./internal/schema -run FuzzParseAttributeType -fuzz FuzzParseAttributeType -fuzztime 30s
          go test ./internal/ldif -run FuzzUnmarshal -fuzz FuzzUnmarshal -fuzztime 30s

      - name: conformance suite compiles
        run: go vet -tags conformance ./test/conformance/

      # The SPA was not checked here at all until now, so a type error or a
      # broken unit test reached main and was found by building locally.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install the SPA dependencies
        run: npm --prefix web ci

      - name: type-check the SPA
        run: npm --prefix web run typecheck

      # Installed after a hook added below two early returns changed the hook
      # count between renders and served a blank page to anyone with a live
      # session. tsc was happy, the tests never reached that path, and the
      # rule that catches it had no linter to run in.
      - name: lint the SPA
        run: npm --prefix web run lint

      - name: SPA unit tests
        run: npm --prefix web run test

      # api/openapi.yaml is the source of truth and both clients are generated
      # from it, but the generated files are committed — so nothing stopped the
      # two drifting apart. `task generate` was found broken on main once, with
      # the committed output predating the break, which is exactly the failure
      # this catches: the spec says one thing, the code compiled against
      # another, and CI was happy with both.
      #
      # It runs the same command a developer runs, rather than reimplementing
      # it here, so the two cannot disagree either.
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: the generated API files match the spec
        run: |
          # oapi-codegen embeds a compressed copy of the spec in swaggerSpec,
          # and its bytes depend on the Go toolchain that ran the generator —
          # two different Go toolchains produce the same types and a
          # different blob -- which still happens across patch releases, even
          # now that every job reads its version from go.mod. It is rebuilt from the spec on every
          # generate and describes nothing the compiler uses, so comparing it
          # would only ever report which Go somebody had installed.
          #
          # Everything else is compared exactly, and the TypeScript has no
          # embedded copy at all, so it is compared whole.
          strip_embedded_spec() {
            awk '/^var swaggerSpec = \[\]string\{$/ { skip = 1 }
                 !skip { print }
                 skip && /^\}$/ { skip = 0 }' "$1"
          }

          git show HEAD:internal/api/api.gen.go > /tmp/api.gen.go.committed
          task generate

          strip_embedded_spec /tmp/api.gen.go.committed > /tmp/committed.go
          strip_embedded_spec internal/api/api.gen.go   > /tmp/regenerated.go

          status=0
          if ! diff -u /tmp/committed.go /tmp/regenerated.go; then
            status=1
          fi
          if ! git diff --exit-code -- web/src/lib/api.gen.ts internal/apiclient/apiclient.gen.go; then
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo
            echo "The generated API files do not match api/openapi.yaml."
            echo "Run 'task generate' and commit the result."
            exit 1
          fi

  cli-windows:
    # Alder ships Windows binaries, and the command-line client is the part of
    # the binary a Windows user runs directly: paths, standard input and output,
    # console detection and file replacement all behave differently there. The
    # client's tests run on Windows here rather than being assumed portable.
    name: command-line client on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go test
        run: go test ./internal/cli/... ./internal/envflags/... ./cmd/alder/...

  govulncheck:
    name: no known vulnerability our code reaches
    runs-on: ubuntu-latest
    # Added after 1.36.0 shipped built on go1.25.14, the last release of a
    # line that had stopped receiving security fixes, with eight standard
    # library vulnerabilities the code actually reaches. Nothing failed:
    # Dependabot alerts were off and no job looked. This one looks.
    #
    # Source mode, deliberately. It follows the call graph and fails only on
    # vulnerabilities this code can reach, so an advisory in a function we
    # never call does not block a pull request -- and a new one in something
    # we do call will, on the next pull request after it is published, which
    # is how anybody here finds out it is time to move the toolchain.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned, so the check is the same tool from run to run. The advisory
      # database it reads is fetched fresh every time, which is the point.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  seed:
    name: seed data is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: regenerate and diff
        run: |
          go run ./test/compose/seed/gen -out test/compose/seed
          git diff --exit-code -- test/compose/seed

  conformance:
    name: conformance suite on both servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: bring the directory servers up
        run: task compose:up
      # This is the gate. A feature is not done until this is green against
      # OpenLDAP and 389 Directory Server both.
      - name: run the conformance suite
        run: task test:conformance

      # The end-to-end journeys run here, on the harness already up, rather
      # than in a job of their own that would bring all four servers up a
      # second time. They run whether or not the suite passed: a journey that
      # fails beside a failing suite says something different from one that
      # fails alone.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json
      - name: install the journey dependencies and browser
        if: ${{ !cancelled() }}
        run: |
          npm --prefix test/e2e ci
          npm --prefix test/e2e exec -- playwright install --with-deps chromium
      - name: run the end-to-end journeys
        if: ${{ !cancelled() }}
        run: task test:e2e
      - name: keep the journey report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test/e2e/playwright-report
            test/e2e/test-results
          retention-days: 7

      - name: show the logs on failure
        if: failure()
        run: docker compose -f test/compose/docker-compose.yml logs
      - name: tear down
        if: always()
        run: task compose:down
